<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Sheets</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The accent IS the playhead purple, so the thing you follow while a song plays
   and the thing you click are the same colour. --btn sits a step away from --bg
   so a bordered button reads as a raised surface rather than a painted outline. */
:root{
  --bg:#E9E8EE; --surface:#F5F4F8; --paper:#FCFBF9; --paper-edge:#DBD9E2;
  --btn:#FFFFFF; --btn-edge:#C4C0D2;
  --ink:#1B1823; --ink-2:#5A5568; --ink-3:#8B869B;
  --line:#CBC7D6; --accent:#7C3AED; --accent-soft:rgba(124,58,237,.12);
  --accent-on:#FFFFFF; --cursor:#7C3AED; --radius:4px;
}
/* Day is the default; dark is opt-in via the toggle, never via the OS setting.
   Dark is a soft neutral grey rather than the near-black it used to be. */
:root[data-theme="dark"]{
  --bg:#26242B; --surface:#2F2D36; --paper:#343139; --paper-edge:#413E49;
  --btn:#3B3843; --btn-edge:#524E5C;
  --ink:#ECEAF1; --ink-2:#B3AEBE; --ink-3:#8A8598;
  --line:#474350; --accent:#B98CFF; --accent-soft:rgba(185,140,255,.18);
  --accent-on:#211F27; --cursor:#C77DFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:980px; margin:0 auto; padding-inline:16px; padding-block:32px 64px}

/* ---------- masthead ---------- */
/* One line, always: nothing here wraps, and the title is the only thing that
   gives ground when the window narrows. */
.masthead{display:flex; align-items:center; gap:14px; flex-wrap:nowrap;
  border-bottom:1px solid var(--line); padding-bottom:16px}
h1{font-family:"Playfair Display",Georgia,"Times New Roman",serif; font-weight:600;
  font-size:clamp(24px,4.4vw,42px); line-height:1.1; margin:0; letter-spacing:-.01em;
  flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.masthead .btn{flex:0 0 auto}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; margin-left:auto; flex:0 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctl.theme{font-size:12px; color:var(--ink-3); gap:8px; flex:0 0 auto}
.btn.browse{padding:10px 18px; font-size:14.5px; font-weight:600}
.seg{display:inline-flex; border:1px solid var(--btn-edge); border-radius:var(--radius);
  overflow:hidden; background:var(--btn)}
.seg input{position:absolute; opacity:0; width:0; height:0; pointer-events:none}
.seg label{padding:6px 11px; font-size:12px; font-weight:500; cursor:pointer; color:var(--ink-2);
  border-right:1px solid var(--btn-edge); line-height:1.2; user-select:none; white-space:nowrap}
.seg label:last-child{border-right:0}
.seg label:hover{color:var(--accent)}
.seg input:checked + label{background:var(--accent); color:var(--accent-on)}
.seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:-2px}

button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
.btn{border:1px solid var(--btn-edge); border-radius:var(--radius); background:var(--btn);
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:border-color .15s,color .15s; text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{border-color:var(--btn-edge); color:inherit}
.btn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.btn.ghost{padding:6px 11px; font-size:12.5px}
select{font:inherit; font-size:13px; color:var(--ink); background:var(--btn);
  border:1px solid var(--btn-edge); border-radius:var(--radius); padding:7px 9px; cursor:pointer}
select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- song picker ---------- */
.picker{display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap}
.picker .nav{min-width:66px; font-size:20px; line-height:1; padding:10px 22px; font-weight:600}
#songsel{flex:1 1 320px; min-width:0; font-size:15px; padding:9px 10px; font-weight:500}
.where{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.04em; white-space:nowrap}

/* ---------- transport ---------- */
.transport{position:sticky; top:0; z-index:20; margin-top:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px; display:flex; flex-direction:column; gap:11px}
.row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.play{min-width:104px; display:inline-flex; align-items:center; justify-content:center;
  gap:8px; background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.play:hover{color:var(--accent-on); filter:brightness(1.08)}
.play:disabled{filter:none}
.play .glyph{font-size:11px; line-height:1}
a.dl{color:var(--ink)} a.dl:hover{color:var(--accent)}
a.dl .arrow{color:var(--accent); font-weight:600}
.ctl{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.ctl input[type=range]{accent-color:var(--accent); width:118px}
.keygrp{gap:5px}
.keygrp select{min-width:104px; text-align:center}
.btn.step{padding:8px 14px; font-size:17px; line-height:1; font-weight:700; min-width:40px}
.ctl output{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; min-width:50px}
.barrow{display:flex; align-items:center; gap:12px}
.barrow .bar-strip{flex:1 1 auto; min-width:0}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto}
.readout b{color:var(--ink); font-weight:500}

/* ---------- scrub ---------- */
.bar-strip{position:relative; height:28px; cursor:pointer; touch-action:none; user-select:none}
.bar-strip.dragging{cursor:grabbing}
#track{position:absolute; inset:0; background:var(--bg); border-radius:2px; overflow:hidden}
#fill{position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--accent); opacity:.16; pointer-events:none}
.tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}
.tick.period{background:var(--ink-3); opacity:.5}
#head{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); pointer-events:none}
#head::after{content:""; position:absolute; left:-4px; right:-4px; top:-2px; height:6px;
  background:var(--ink); border-radius:1px}
.bar-strip:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- score ---------- */
.sheet{margin-top:20px; background:var(--paper); border:1px solid var(--paper-edge);
  border-radius:var(--radius); padding:22px 16px 28px}
#paper{color:var(--ink)}
#paper svg{max-width:100%; height:auto; display:block}
#paper svg path{fill:currentColor}
#paper svg text,#paper svg tspan{fill:currentColor}
#paper .abcjs-highlight,#paper .abcjs-highlight path,#paper .abcjs-highlight text{
  fill:var(--cursor) !important}
/* the playhead is an SVG line INSIDE the score, so it shares the score's
   coordinate system and stays put when the responsive SVG rescales */
#paper svg .playhead{stroke:var(--cursor); stroke-width:2.2; opacity:.92;
  stroke-linecap:round; pointer-events:none}
.empty{color:var(--ink-3); font-size:13px; font-style:italic; padding:44px 0; text-align:center}
#audiohost{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

/* ---------- modals ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-family:"Bodoni Moda",Didot,serif; font-weight:400; font-size:22px}
.modal-head .btn{margin-left:auto}
#spectext{margin:0; padding:18px 20px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  color:var(--ink-2); tab-size:2}
.dirlist{margin:0; padding:14px; overflow:auto; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.dircard{text-align:left; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px 15px; cursor:pointer; display:flex;
  flex-direction:column; gap:5px; transition:border-color .15s,background .15s}
.dircard:hover{border-color:var(--accent)}
.dircard[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.dircard .dt{font-weight:600; font-size:16px; display:flex; align-items:center; gap:11px}
.dircard .dicon{flex:0 0 auto; width:34px; height:34px; display:inline-flex;
  align-items:center; justify-content:center; border-radius:var(--radius);
  background:var(--accent-soft); color:var(--accent)}
.dircard .dicon svg{width:22px; height:22px; display:block}
.dircard:hover .dicon{background:var(--accent); color:var(--accent-on)}
.dircard .dn{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3)}
.dircard .db{font-size:13px; color:var(--ink-2); line-height:1.45}

@media (max-width:620px){
  .readout{margin-left:0; width:100%}
  .ctl input[type=range]{width:96px}
}
/* Portrait tablet: the transport wraps to two or three rows, so give the rows
   room and let the song picker own a full line of its own. */
@media (max-width:980px){
  .wrap{padding-block:22px 56px}
  h1{font-size:26px}
  .masthead{gap:9px}
  .masthead h1{font-size:clamp(20px,3.4vw,28px)}
  .btn.browse{padding:9px 13px; font-size:13.5px}
  .count{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
         flex:0 1 auto; min-width:0}
  .picker{gap:8px; flex-wrap:nowrap}
  .picker .nav{flex:0 0 auto; min-width:84px; padding:11px 16px}
  #songsel{flex:1 1 auto; min-width:0}
  .where{flex:0 0 auto}
  .row{flex-wrap:nowrap; gap:8px}
  .play{min-width:86px}
  .keygrp{flex:0 0 auto}
  .keygrp > span{display:none}
  .keygrp select{min-width:76px}
  .ctl.tempo > span{display:none}
  .ctl input[type=range]{width:92px}
  .ctl output{min-width:46px; font-size:12px}
  #pdf{flex:0 0 auto}
}
/* Anything driven by a finger gets a 44px-ish target. */
@media (pointer:coarse){
  .btn{padding:11px 16px; font-size:14px}
  .btn.ghost{padding:10px 14px; font-size:13px}
  select{padding:11px 10px; font-size:14px}
  .ctl.theme select{padding:8px 8px; font-size:13px}
  .picker .nav{padding:14px 24px; font-size:22px}
  .bar-strip{height:38px}
  .ctl input[type=range]{height:28px}
  .dircard{padding:16px 17px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important; transition:none !important}}
@media print{
  .masthead,.picker,.transport,.modal{display:none}
  body{background:#fff} .sheet{border:none; background:#fff; margin:0; padding:0}
  #paper svg .playhead{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Piano Sheets</h1>
    <button class="btn browse" id="browse" type="button">&#9776;&nbsp; Browse Categories</button>
    <button class="btn ghost" id="specbtn" type="button">View spec</button>
    <span class="count" id="count"></span>
    <div class="ctl theme">
      <div class="seg" role="radiogroup" aria-label="Theme">
        <input type="radio" name="theme" id="th-light" value="light">
        <label for="th-light">Day</label>
        <input type="radio" name="theme" id="th-dark" value="dark">
        <label for="th-dark">Dark</label>
      </div>
    </div>
  </header>

  <div class="picker">
    <button class="btn nav" id="prev" type="button" aria-label="Previous song">&#8249;</button>
    <select id="songsel" aria-label="Choose a song"></select>
    <button class="btn nav" id="next" type="button" aria-label="Next song">&#8250;</button>
    <span class="where" id="where"></span>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <span class="ctl keygrp"><span>Key</span>
        <button class="btn step" id="keydown" type="button" aria-label="Down a semitone">&#9662;</button>
        <select id="keysel" aria-label="Key"></select>
        <button class="btn step" id="keyup" type="button" aria-label="Up a semitone">&#9652;</button>
      </span>
      <label class="ctl tempo" for="tempo"><span>Tempo</span>
        <input type="range" id="tempo" min="40" max="225" step="1" value="100">
        <output id="bpm" for="tempo">100 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
    </div>
    <div class="barrow">
      <div class="bar-strip" id="strip" role="slider" tabindex="0"
           aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="32" aria-valuenow="1">
        <div id="track"></div>
        <div id="fill"></div>
        <div id="head"></div>
      </div>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">32</b></span>
    </div>
  </div>

  <div class="sheet">
    <div id="paper"><p class="empty">Loading&hellip;</p></div>
  </div>
</div>

<div class="modal" id="dirmodal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dirtitle">
    <div class="modal-head">
      <h2 id="dirtitle">Browse collections</h2>
      <button class="btn" id="dirclose" type="button">Close</button>
    </div>
    <div class="dirlist" id="dirlist"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="spectitle">
    <div class="modal-head">
      <h2 id="spectitle">Spec</h2>
      <button class="btn" id="specclose" type="button">Close</button>
    </div>
    <pre id="spectext"></pre>
  </div>
</div>

<div id="audiohost"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script>
(function () {
  "use strict";
  var COLLECTIONS = __COLLECTIONS__;

  var $ = function (id) { return document.getElementById(id); };
  var coll = null, flat = [], idx = -1;          // flat = [{song, set}] for the collection
  var song = null, set = null, visualObj = null, synth = null;
  var ready = false, playing = false, busy = false;
  var chordsOn = true, followOn = true, dragging = false;
  var curBar = 0, totalBars = 32, targetBpm = 100, transpose = 0;
  // Once the listener moves the slider, that tempo sticks across song changes
  // and reloads; until then each song opens at its own written tempo.
  var userTempo = null;
  try { var _ut = localStorage.getItem('userTempo'); if (_ut) userTempo = +_ut; } catch (e) {}
  var loadToken = 0, idc = 0, lastTop = null, playhead = null;
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var strip = $("strip"), paper = $("paper");

  var PC = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6,
             G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };
  var MAJOR = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  var MINOR = ["Am","Bbm","Bm","Cm","C#m","Dm","Ebm","Em","Fm","F#m","Gm","G#m"];

  function tonicPc(key) { return PC[key.replace(/m$/, "")]; }
  function isMinor(key) { return /m$/.test(key); }

  /* ================= collections ================= */
  // Inline rather than files: index.html has to work from file://, where an
  // <img src> to a sibling folder is fine but a fetch is not -- and drawing in
  // currentColor means the art follows the theme for free.
  var ART = {
    "folk-songs":
      '<path d="M12 21c-3 0-5.2-2-5.2-4.6 0-1.9 1.2-3 1.2-4.4S6.8 9.5 6.8 7.6C6.8 5 9 3.2 12 3.2' +
      's5.2 1.8 5.2 4.4c0 1.9-1.2 3-1.2 4.4s1.2 2.5 1.2 4.4C17.2 19 15 21 12 21z"/>' +
      '<circle cx="12" cy="13.4" r="1.7"/><path d="M12 3.2V1.6"/>',
    "classical":
      '<path d="M3.6 20.4h16.8M4.8 4.2h14.4M6 6.4h12"/>' +
      '<path d="M7.4 6.4v12M10 6.4v12M12.6 6.4v12M15.2 6.4v12M17.8 6.4v12"/>',
    "ragtime":
      '<rect x="2.6" y="5.4" width="18.8" height="13.2" rx="1.6"/>' +
      '<path d="M9 5.4v13.2M15 5.4v13.2"/>' +
      '<rect x="6.7" y="5.4" width="2.5" height="7.6" rx=".5" fill="currentColor" stroke="none"/>' +
      '<rect x="12.7" y="5.4" width="2.5" height="7.6" rx=".5" fill="currentColor" stroke="none"/>' +
      '<rect x="17.4" y="5.4" width="2.5" height="7.6" rx=".5" fill="currentColor" stroke="none"/>',
    "ai-music":
      '<path d="M8.6 2.4l1.3 3.6 3.6 1.3-3.6 1.3-1.3 3.6-1.3-3.6L3.7 7.3l3.6-1.3z"/>' +
      '<circle cx="13.6" cy="18.3" r="2.4"/><path d="M16 18.3v-7.1l3.8 1.4"/>'
  };
  var ART_FALLBACK =
    '<circle cx="8.5" cy="17.5" r="3"/><path d="M11.5 17.5V4.5l7 2.4"/>';

  function artFor(cid) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
           (ART[cid] || ART_FALLBACK) + '</svg>';
  }

  var dirlist = $("dirlist");
  COLLECTIONS.forEach(function (c) {
    var n = c.sets.reduce(function (a, s) { return a + s.songs.length; }, 0);
    var b = document.createElement("button");
    b.className = "dircard"; b.type = "button";
    b.innerHTML = '<span class="dt"><span class="dicon"></span><span class="dname"></span></span>' +
                  '<span class="dn"></span><span class="db"></span>';
    b.querySelector(".dicon").innerHTML = artFor(c.id);
    b.querySelector(".dname").textContent = c.title;
    b.querySelector(".dn").textContent =
      n + (n === 1 ? " song" : " songs") +
      (c.sets.length > 1 ? "  ·  " + c.sets.length + " sets" : "");
    b.querySelector(".db").textContent = c.blurb || "";
    b.addEventListener("click", function () { selectCollection(c.id); closeDir(); });
    b.dataset.cid = c.id;
    dirlist.appendChild(b);
  });

  function selectCollection(cid) {
    coll = COLLECTIONS.filter(function (c) { return c.id === cid; })[0] || COLLECTIONS[0];
    flat = [];
    coll.sets.forEach(function (s) {
      s.songs.forEach(function (sg) { flat.push({ song: sg, set: s }); });
    });
    var n = flat.length;
    $("count").textContent = coll.title + " · " + n + (n === 1 ? " song" : " songs");
    var cards = dirlist.querySelectorAll(".dircard");
    for (var i = 0; i < cards.length; i++) {
      cards[i].setAttribute("aria-current", String(cards[i].dataset.cid === coll.id));
    }
    buildSongList();
    try { localStorage.setItem("lastCollection", coll.id); } catch (e) {}
    if (flat.length) select(0);
  }

  function buildSongList() {
    var sel = $("songsel");
    sel.innerHTML = "";
    var multi = coll.sets.length > 1;
    var n = 0;
    coll.sets.forEach(function (s) {
      var parent = sel;
      if (multi) {
        parent = document.createElement("optgroup");
        // A set can give itself a display title; otherwise the folder name stands
        // in, which is what the AI Music sets (v1 … v6) want.
        parent.label = (s.title || s.id) + "  —  " + (s.label || "");
        sel.appendChild(parent);
      }
      s.songs.forEach(function (sg) {
        var o = document.createElement("option");
        o.value = String(n++);
        o.textContent = sg.title + "   ·   " + sg.key + "  ·  " + sg.meter +
                        "  ·  " + sg.bars + " bars  ·  ♩ " + sg.tempo;
        parent.appendChild(o);
      });
    });
    sel.addEventListener("change", function () { select(+this.value); });
  }

  /* ================= song ================= */
  function select(i) {
    if (i < 0 || i >= flat.length) return;
    idx = i;
    song = flat[i].song;
    set = flat[i].set;
    totalBars = song.bars;
    targetBpm = userTempo || song.tempo;
    transpose = 0;
    $("songsel").value = String(i);
    $("where").textContent = (idx + 1) + " / " + flat.length +
      (coll.sets.length > 1 ? "  ·  " + (set.title || set.id) : "");
    $("prev").disabled = idx === 0;
    $("next").disabled = idx === flat.length - 1;
    $("barsof").textContent = totalBars;
    strip.setAttribute("aria-valuemax", totalBars);
    targetBpm = Math.max(40, Math.min(targetBpm, 225));
    $("tempo").value = targetBpm;
    $("bpm").textContent = targetBpm + " bpm" + (userTempo ? "" : "");
    $("pdf").href = song.pdf;
    $("pdf").setAttribute("download", song.slug + ".pdf");
    $("spectitle").textContent = "Spec — " + coll.title +
      (coll.sets.length > 1 ? " · " + (set.title || set.id) : "");
    $("spectext").textContent = set.spec || (coll.blurb || "(no spec recorded)");
    buildKeys();
    buildTicks();
    render();
    curBar = 0; setBar(1);
    setupAudio();
    try { localStorage.setItem("lastSong", coll.id + "/" + song.slug); } catch (e) {}
  }

  function buildKeys() {
    var sel = $("keysel");
    sel.innerHTML = "";
    var names = isMinor(song.key) ? MINOR : MAJOR;
    var home = tonicPc(song.key);
    names.forEach(function (nm) {
      var semis = ((tonicPc(nm) - home + 6) % 12) - 6;   // keep it near the written key
      var o = document.createElement("option");
      o.value = String(semis);
      o.textContent = nm + (semis === 0 ? "  (written)" : "");
      sel.appendChild(o);
    });
    sel.value = "0";
  }

  function buildTicks() {
    var t = $("track");
    t.innerHTML = "";
    var every = totalBars > 24 ? 4 : 2;
    for (var b = 1 + every; b <= totalBars; b += every) {
      var d = document.createElement("div");
      d.className = "tick" + ((b - 1) % (every * 2) === 0 ? " period" : "");
      d.style.left = ((b - 1) / totalBars * 100) + "%";
      t.appendChild(d);
    }
  }

  /* ================= score ================= */

  // Left to itself abcjs fits four bars to a line and justifies each system to
  // the full width, so a sparse tune ends up with 250px bars. MAX_BAR_PX is the
  // only number worth touching here.
  var MAX_BAR_PX = 200;        // target width for the widest bar, in screen pixels
  var PER_LINE_MIN = 4;        // layouts to try, in measures per line
  var PER_LINE_MAX = 10;

  // abcjs stretches the final, short system out to the full width -- that is
  // where the very widest bars come from. %%stretchlast 0 leaves it alone.
  // It is a directive, not a render option, so it has to go into the ABC itself.
  function noStretch(abc) {
    var L = abc.split(/\r?\n/);
    L.splice(1, 0, "%%stretchlast 0");   // after X:, before the rest of the header
    return L.join("\n");
  }

  function renderWith(perLine) {
    paper.innerHTML = "";
    visualObj = ABCJS.renderAbc("paper", noStretch(song.abc), {
      responsive: "resize", add_classes: true, staffwidth: 880,
      paddingtop: 0, paddingbottom: 14, paddingleft: 0, paddingright: 0,
      visualTranspose: transpose,
      wrap: { minSpacing: 1.0, maxSpacing: 1.4, preferredMeasuresPerLine: perLine }
    });
  }

  // Widest gap between two barlines on the same system, in screen pixels.
  function widestBar() {
    var svg = paper.querySelector("svg");
    if (!svg) return 0;
    var rows = {};
    [].forEach.call(svg.querySelectorAll(".abcjs-bar"), function (e) {
      var b = e.getBoundingClientRect();
      var y = Math.round(b.top / 8) * 8;       // bucket by system
      (rows[y] = rows[y] || []).push(b.left);
    });
    var max = 0;
    Object.keys(rows).forEach(function (y) {
      var xs = rows[y].sort(function (a, b) { return a - b; });
      for (var i = 1; i < xs.length; i++) max = Math.max(max, xs[i] - xs[i - 1]);
    });
    return max;
  }

  // Which measures-per-line setting gives the narrowest bars is not monotonic --
  // it depends on how the remainder falls on the last system -- so try the range
  // and keep the airiest layout that fits. A dense tune may not reach the cap at
  // a readable note size; then we keep the narrowest layout going.
  function render() {
    var best = null, current = null;
    for (var n = PER_LINE_MIN; n <= PER_LINE_MAX; n++) {
      renderWith(n); current = n;
      var w = widestBar();
      if (best === null || w < best.w) best = { n: n, w: w };
      if (w <= MAX_BAR_PX) break;
    }
    if (best && best.n !== current) renderWith(best.n);
    addPlayhead();
  }

  // A <line> appended to abcjs's own <svg>, so it is measured in the score's
  // coordinate system -- which is what the note events report. A DOM overlay
  // would drift as soon as the responsive SVG scaled.
  function addPlayhead() {
    var svg = paper.querySelector("svg");
    if (!svg) { playhead = null; return; }
    playhead = document.createElementNS("http://www.w3.org/2000/svg", "line");
    playhead.setAttribute("class", "playhead");
    playhead.setAttribute("x1", 0); playhead.setAttribute("x2", 0);
    playhead.setAttribute("y1", 0); playhead.setAttribute("y2", 0);
    playhead.style.opacity = 0;
    svg.appendChild(playhead);
  }

  function movePlayhead(ev) {
    if (!playhead || ev.left == null) return;
    var x = ev.left - 2;
    playhead.setAttribute("x1", x);
    playhead.setAttribute("x2", x);
    playhead.setAttribute("y1", ev.top - 2);
    playhead.setAttribute("y2", ev.top + ev.height + 2);
    playhead.style.opacity = "";
  }

  function hidePlayhead() { if (playhead) playhead.style.opacity = 0; }

  function clearHighlights() {
    var old = paper.querySelectorAll(".abcjs-highlight");
    for (var i = 0; i < old.length; i++) old[i].classList.remove("abcjs-highlight");
  }

  /* ================= transport ================= */
  function setBar(bar) {
    if (bar === curBar) return;
    curBar = bar;
    $("barnum").textContent = bar;
    var pc = (bar - 1) / totalBars * 100;
    $("head").style.left = pc + "%";
    $("fill").style.width = pc + "%";
    strip.setAttribute("aria-valuenow", bar);
    strip.setAttribute("aria-valuetext", "bar " + bar + " of " + totalBars);
  }

  function paintPlay() {
    $("glyph").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
    $("playlab").textContent = playing ? "Pause" : "Play";
  }

  var MM_RE = /(?:^|\s)abcjs-mm(\d+)(?:\s|$)/;
  function measureOf(el) {
    if (!el) return null;
    var cls = el.getAttribute ? el.getAttribute("class") : null;
    var m = cls && MM_RE.exec(cls);
    return m ? +m[1] : null;
  }

  var cursorControl = {
    beatSubdivisions: 2,
    onStart: function () { lastTop = null; },
    onBeat: function (beatNumber, totalBeats) {
      if (dragging || busy) return;
      // Fallback only: proportional, so it is right in any meter. onEvent below
      // supersedes it with the exact measure whenever a note is sounding.
      if (!totalBeats) return;
      var frac = beatNumber / totalBeats;
      setBar(Math.max(1, Math.min(totalBars, Math.floor(frac * totalBars) + 1)));
    },
    onEvent: function (ev) {
      if (!ev || dragging || busy || (ev.measureStart && ev.left === null)) return;
      clearHighlights();
      var first = null;
      (ev.elements || []).forEach(function (s) {
        s.forEach(function (el) { el.classList.add("abcjs-highlight"); if (!first) first = el; });
      });
      var mm = measureOf(first);
      if (mm !== null) setBar(Math.max(1, Math.min(totalBars, mm + 1)));
      movePlayhead(ev);
      if (followOn && first && ev.top !== lastTop) {
        lastTop = ev.top;
        var r = first.getBoundingClientRect();
        if (r.top < 120 || r.bottom > innerHeight - 60) {
          scrollBy({ top: r.top - innerHeight * 0.38, behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
    },
    onFinished: function () {
      playing = false; paintPlay(); clearHighlights(); hidePlayhead();
      curBar = 0; setBar(1);
    }
  };

  /* ================= audio ================= */
  function audioParams() {
    // visualTranspose moves the notation and the chord NAMES but the synth
    // ignores it entirely -- the generated MIDI is byte-identical either way, so
    // the score would read Eb while the audio still played C. midiTranspose is
    // the separate lever that moves the sound, melody and comping alike.
    return { chordsOff: !chordsOn, program: 0, midiTranspose: transpose, qpm: targetBpm };
  }

  // A fresh controller per tune: reusing one leaves the previous tune primed, so
  // Play would sound the song you just navigated away from.
  function setupAudio() {
    if (!ABCJS.synth.supportsAudio()) { $("playlab").textContent = "No audio"; return; }
    var token = ++loadToken;
    ready = false; playing = false; busy = false;
    paintPlay();
    $("play").disabled = true;
    if (synth) {
      try { synth.pause(); } catch (e) {}
      try { synth.destroy(); } catch (e) {}
    }
    $("audiohost").innerHTML = "";
    synth = new ABCJS.synth.SynthController();
    synth.load("#audiohost", cursorControl,
      { displayPlay: true, displayProgress: true, displayWarp: true });
    var mine = synth;
    return mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;
      ready = true;
      $("play").disabled = false;
      paintPlay();
      // A fresh controller always starts at the tune's own Q: header -- the qpm
      // we pass to setTune does not stick -- so a sticky user tempo (or a
      // re-prime after transposing) has to be warped back in here. Without this
      // the slider reads 225 while the song plays at its written tempo.
      syncWarp();
    }).catch(function (e) {
      if (token !== loadToken) return;
      $("playlab").textContent = "Audio failed"; console.error(e);
    });
  }

  /* setWarp re-primes the audio AND the timing clock together and restores the
     position, so audio and playhead stay locked. Do not pause/seek around it. */
  function warpPct() { return Math.max(1, Math.round(targetBpm / song.tempo * 100)); }

  // Bring a freshly primed controller up to the current target tempo.
  function syncWarp() {
    if (!synth || !song) return;
    var pct = warpPct();
    if (pct === 100) return;
    try { synth.setWarp(pct); } catch (e) {}
  }

  function applyTempo(bpm) {
    targetBpm = bpm;
    $("bpm").textContent = bpm + " bpm";
    if (!synth || !ready || !song) return;
    var pct = warpPct();
    busy = true;
    var release = function () { busy = false; };
    var res = synth.setWarp(pct);
    if (res && typeof res.then === "function") res.then(release, release);
    else setTimeout(release, 500);
    setTimeout(release, 3000);
  }

  function applyTranspose(semis) {
    if (!song) return;
    transpose = semis;
    var wasPlaying = playing, bar = curBar;
    render();                       // re-engrave at the new key
    setupAudio().then(function () { // and re-prime from the transposed tune
      if (bar > 1) seekToBar(bar);
      if (wasPlaying) { playing = true; paintPlay(); synth.play(); }
    });
  }

  function seekToBar(bar) {
    bar = Math.max(1, Math.min(totalBars, bar));
    setBar(bar);
    if (!ready) return;
    clearHighlights(); hidePlayhead();
    lastTop = null;
    synth.seek((bar - 1) / totalBars);
  }

  /* ================= scrubbing ================= */
  function barAtX(clientX) {
    var r = strip.getBoundingClientRect();
    if (!r.width) return curBar;
    var f = Math.max(0, Math.min(0.99999, (clientX - r.left) / r.width));
    return Math.max(1, Math.min(totalBars, Math.floor(f * totalBars) + 1));
  }
  strip.addEventListener("pointerdown", function (e) {
    if (!ready || (e.button !== 0 && e.pointerType === "mouse")) return;
    dragging = true; strip.classList.add("dragging");
    try { strip.setPointerCapture(e.pointerId); } catch (_) {}
    clearHighlights(); hidePlayhead(); setBar(barAtX(e.clientX));
    e.preventDefault(); strip.focus();
  });
  strip.addEventListener("pointermove", function (e) {
    if (dragging) setBar(barAtX(e.clientX));
  });
  function endScrub(e) {
    if (!dragging) return;
    dragging = false; strip.classList.remove("dragging");
    try { strip.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToBar(barAtX(e.clientX));
  }
  strip.addEventListener("pointerup", endScrub);
  strip.addEventListener("pointercancel", endScrub);
  strip.addEventListener("keydown", function (e) {
    var d = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 4 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -4 : -1;
    else if (e.key === "Home") d = -totalBars;
    else if (e.key === "End") d = totalBars;
    else return;
    e.preventDefault(); seekToBar(curBar + d);
  });

  /* ================= controls ================= */
  $("prev").addEventListener("click", function () { select(idx - 1); });
  $("next").addEventListener("click", function () { select(idx + 1); });
  $("play").addEventListener("click", function () {
    if (!ready) return;
    playing = !playing; paintPlay(); synth.play();
  });
  // Chords and follow are always on now, so there is nothing to toggle.
  function keyStep(dir) {
    var sel = $("keysel");
    if (!sel.options.length) return;
    sel.selectedIndex = (sel.selectedIndex + dir + sel.options.length) % sel.options.length;
    applyTranspose(+sel.value);
  }
  $("keydown").addEventListener("click", function () { keyStep(-1); });
  $("keyup").addEventListener("click", function () { keyStep(1); });
  $("tempo").addEventListener("input", function () { $("bpm").textContent = this.value + " bpm"; });
  $("tempo").addEventListener("change", function () {
    userTempo = +this.value;
    try { localStorage.setItem("userTempo", userTempo); } catch (e) {}
    applyTempo(userTempo);
  });
  $("keysel").addEventListener("change", function () { applyTranspose(+this.value); });

  /* ================= modals ================= */
  function openDir() { $("dirmodal").hidden = false; $("dirclose").focus(); }
  function closeDir() { $("dirmodal").hidden = true; $("browse").focus(); }
  $("browse").addEventListener("click", openDir);
  $("dirclose").addEventListener("click", closeDir);
  $("dirmodal").addEventListener("click", function (e) { if (e.target === this) closeDir(); });

  function openSpec() { $("modal").hidden = false; $("specclose").focus(); }
  function closeSpec() { $("modal").hidden = true; $("specbtn").focus(); }
  $("specbtn").addEventListener("click", openSpec);
  $("specclose").addEventListener("click", closeSpec);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeSpec(); });

  addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("modal").hidden) { e.preventDefault(); closeSpec(); }
      else if (!$("dirmodal").hidden) { e.preventDefault(); closeDir(); }
      return;
    }
    if (!$("modal").hidden || !$("dirmodal").hidden) return;
    var tag = e.target.tagName;
    if (/^(INPUT|TEXTAREA|BUTTON|A|SELECT)$/.test(tag)) return;
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); select(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); select(idx - 1); }
  });

  /* ================= theme ================= */
  // Day or Dark, always stamped on the root, which every colour token keys off.
  // The root is never left unstamped, so prefers-color-scheme no longer decides:
  // the page opens in Day unless the listener has chosen otherwise.
  function applyTheme(v) {
    if (v !== "light" && v !== "dark") v = "light";
    document.documentElement.setAttribute("data-theme", v);
    try { localStorage.setItem("theme", v); } catch (e) {}
  }
  var startTheme = "light";
  // A stored 'auto' from the older three-way control falls back to Day.
  try { startTheme = localStorage.getItem("theme") || "light"; } catch (e) {}
  if (startTheme !== "light" && startTheme !== "dark") startTheme = "light";
  var themeRadios = document.querySelectorAll('.seg input[name="theme"]');
  for (var ti = 0; ti < themeRadios.length; ti++) {
    themeRadios[ti].checked = themeRadios[ti].value === startTheme;
    themeRadios[ti].addEventListener("change", function () {
      if (this.checked) applyTheme(this.value);
    });
  }
  applyTheme(startTheme);

  /* ================= boot ================= */
  var startC = COLLECTIONS.length ? COLLECTIONS[0].id : null;
  try {
    var lc = localStorage.getItem("lastCollection");
    for (var i = 0; i < COLLECTIONS.length; i++) if (COLLECTIONS[i].id === lc) startC = lc;
  } catch (e) {}
  if (startC) {
    selectCollection(startC);
    try {
      var ls = localStorage.getItem("lastSong");
      for (var j = 0; j < flat.length; j++) {
        if (coll.id + "/" + flat[j].song.slug === ls) { select(j); break; }
      }
    } catch (e) {}
  }

  window.__p = {
    bar: function () { return curBar; },
    bpm: function () { return targetBpm; },
    ready: function () { return ready; },
    song: function () { return song && song.slug; },
    collection: function () { return coll && coll.id; },
    setId: function () { return set && set.id; },
    index: function () { return idx; },
    count: function () { return flat.length; },
    transpose: function () { return transpose; },
    userTempo: function () { return userTempo; },
    written: function () { return song && song.tempo; },
    synthId: function () { return synth ? (synth.__id || (synth.__id = ++idc)) : null; },
    primedIsCurrent: function () {
      try { return synth.visualObj === visualObj[0]; } catch (e) { return null; }
    },
    playheadX: function () { return playhead ? +playhead.getAttribute("x1") : null; },
    theme: function () { return document.documentElement.getAttribute('data-theme') || 'auto'; },
    keySig: function () {
      try { return visualObj[0].getKeySignature().accidentals.length; } catch (e) { return null; }
    }
  };
})();
</script>
</body>
</html>
