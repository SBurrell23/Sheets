<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Lead Sheets</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E7EAE5; --surface:#F3F5F1; --paper:#FCFBF7; --paper-edge:#DCDFD7;
  --ink:#16201E; --ink-2:#55635E; --ink-3:#8A968F;
  --line:#C9D0C8; --accent:#2C6E67; --accent-soft:rgba(44,110,103,.13);
  --accent-on:#FCFBF7; --radius:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
    --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
    --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
    --accent-on:#0D1312;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
  --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
  --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
  --accent-on:#0D1312;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:36px 64px}

/* ---------- masthead ---------- */
.masthead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:18px}
h1{font-family:"Bodoni Moda",Didot,"Times New Roman",serif; font-weight:400;
  font-size:clamp(34px,6vw,52px); line-height:1; margin:0; letter-spacing:.005em}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; margin-left:auto}
.vpick{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.vpick select{font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:6px 9px; cursor:pointer}
.vpick select:hover{border-color:var(--accent)}
.btn.ghost{padding:6px 11px; font-size:12.5px}

/* ---------- spec modal ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
/* author rules beat the UA sheet's [hidden]{display:none}, so restate it here */
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-family:"Bodoni Moda",Didot,serif; font-weight:400; font-size:23px}
.modal-head .btn{margin-left:auto}
#spectext{margin:0; padding:18px 20px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  color:var(--ink-2); tab-size:2}

/* ---------- song list ---------- */
.library{display:grid; grid-template-columns:repeat(auto-fill,minmax(224px,1fr));
  gap:8px; margin-top:20px}
.card{
  display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px; font:inherit; color:inherit; position:relative;
  transition:border-color .15s, background .15s;
}
.card:hover{border-color:var(--accent)}
.card[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.card .t{font-weight:600; font-size:15px; line-height:1.3}
.card .m{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.card[aria-current="true"] .m{color:var(--accent)}

/* ---------- transport ---------- */
.transport{position:sticky; top:0; z-index:20; margin-top:22px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
.btn{border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:border-color .15s,color .15s; text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default}
.btn:disabled:hover{border-color:var(--line); color:inherit}
.play{min-width:100px; display:inline-flex; align-items:center; gap:8px;
  background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.play:hover{color:var(--accent-on); filter:brightness(1.08)}
.play:disabled{filter:none}
.play .glyph{font-size:11px; line-height:1}
a.dl{color:var(--ink)} a.dl:hover{color:var(--accent)}
a.dl .arrow{color:var(--accent); font-weight:600}
.tempo{display:inline-flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-2)}
.tempo input{accent-color:var(--accent); width:150px}
.tempo output{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; min-width:52px}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-2); font-variant-numeric:tabular-nums; margin-left:auto}
.readout b{color:var(--ink); font-weight:500}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- scrub bar ---------- */
.bar-strip{position:relative; height:30px; cursor:pointer; touch-action:none; user-select:none}
.bar-strip.dragging{cursor:grabbing}
#track{position:absolute; inset:0; background:var(--bg); border-radius:2px; overflow:hidden}
#fill{position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--accent); opacity:.16; pointer-events:none}
.tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}
.tick.period{background:var(--ink-3); opacity:.5}
#head{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); pointer-events:none}
#head::after{content:""; position:absolute; left:-4px; right:-4px; top:-2px; height:6px;
  background:var(--ink); border-radius:1px}
.bar-strip:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- score ---------- */
.sheet{margin-top:22px; background:var(--paper); border:1px solid var(--paper-edge);
  border-radius:var(--radius); padding:24px 18px 30px}
#paper{color:var(--ink)}
#paper svg{max-width:100%; height:auto; display:block}
#paper svg path{fill:currentColor}
#paper svg text,#paper svg tspan{fill:currentColor}
#paper .abcjs-highlight,#paper .abcjs-highlight path,#paper .abcjs-highlight text{
  fill:var(--accent) !important}
.empty{color:var(--ink-3); font-size:13px; font-style:italic; padding:48px 0; text-align:center}
#audiohost{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

@media (max-width:560px){
  .readout{margin-left:0; width:100%}
  .tempo input{width:110px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important; transition:none !important}}
@media print{
  .masthead,.library,.transport{display:none}
  body{background:#fff} .sheet{border:none; background:#fff; margin:0; padding:0}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Piano Lead Sheets</h1>
    <label class="vpick" for="version">Set
      <select id="version"></select>
    </label>
    <button class="btn ghost" id="specbtn" type="button">View spec</button>
    <span class="count" id="count"></span>
  </header>

  <div class="library" id="library"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="spectitle">
      <div class="modal-head">
        <h2 id="spectitle">Spec</h2>
        <button class="btn" id="specclose" type="button">Close</button>
      </div>
      <pre id="spectext"></pre>
    </div>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <button class="btn" id="restart" disabled>Restart</button>
      <button class="btn" id="chords" aria-pressed="true">Chords on</button>
      <button class="btn" id="follow" aria-pressed="true">Follow</button>
      <label class="tempo" for="tempo">Tempo
        <input type="range" id="tempo" min="40" max="250" step="1" value="84">
        <output id="bpm" for="tempo">84 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">40</b></span>
    </div>
    <div class="bar-strip" id="strip" role="slider" tabindex="0"
         aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="40" aria-valuenow="1">
      <div id="track"></div>
      <div id="fill"></div>
      <div id="head"></div>
    </div>
  </div>

  <div class="sheet">
    <div id="paper"><p class="empty">Pick a song above.</p></div>
  </div>
</div>

<div id="audiohost"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script>
(function () {
  "use strict";
  var VERSIONS = __VERSIONS__;

  var $ = function (id) { return document.getElementById(id); };
  var version = null, SONGS = [];
  var song = null, visualObj = null, synth = null;
  var ready = false, playing = false, busy = false;
  var chordsOn = true, followOn = true, dragging = false;
  var curBar = 0, totalBars = 40, targetBpm = 84;
  var loadToken = 0;
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var strip = $("strip"), paper = $("paper"), lib = $("library");

  /* ================= versions ================= */
  var vsel = $("version");
  VERSIONS.forEach(function (v) {
    var o = document.createElement("option");
    o.value = v.id;
    o.textContent = v.id + " — " + v.bars + " bars";
    vsel.appendChild(o);
  });
  vsel.addEventListener("change", function () { selectVersion(this.value); });

  function selectVersion(id) {
    version = VERSIONS.filter(function (v) { return v.id === id; })[0] || VERSIONS[0];
    vsel.value = version.id;
    SONGS = version.songs;
    $("count").textContent = SONGS.length + (SONGS.length === 1 ? " song" : " songs");
    $("spectitle").textContent = "Spec — " + version.id + " · " + version.label;
    $("spectext").textContent = version.spec || "(no spec recorded for this set)";
    buildLibrary();
    try { localStorage.setItem("lastVersion", version.id); } catch (e) {}
    if (SONGS.length) select(0);
  }

  /* ================= library ================= */
  function buildLibrary() {
    lib.innerHTML = "";
    SONGS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "card";
      b.type = "button";
      b.setAttribute("aria-current", "false");
      b.innerHTML = '<span class="t"></span><span class="m"></span>';
      b.querySelector(".t").textContent = s.title;
      b.querySelector(".m").textContent =
        s.key + "  ·  " + s.bars + " bars  ·  ♩ " + s.tempo;
      b.addEventListener("click", function () { select(i); });
      lib.appendChild(b);
    });
  }

  function select(i) {
    song = SONGS[i];
    totalBars = song.bars;
    targetBpm = song.tempo;
    var cards = lib.querySelectorAll(".card");
    for (var k = 0; k < cards.length; k++) cards[k].setAttribute("aria-current", String(k === i));
    $("barsof").textContent = totalBars;
    strip.setAttribute("aria-valuemax", totalBars);
    $("tempo").value = targetBpm;
    $("bpm").textContent = targetBpm + " bpm";
    $("pdf").href = song.pdf;
    $("pdf").setAttribute("download", song.slug + ".pdf");
    buildTicks();
    render();
    curBar = 0; setBar(1);
    setupAudio();
    try { localStorage.setItem("lastSong", song.slug); } catch (e) {}
  }

  function buildTicks() {
    var t = $("track");
    t.innerHTML = "";
    for (var b = 5; b <= totalBars; b += 4) {
      var d = document.createElement("div");
      d.className = "tick" + ((b - 1) % 8 === 0 ? " period" : "");
      d.style.left = ((b - 1) / totalBars * 100) + "%";
      t.appendChild(d);
    }
  }

  /* ================= score ================= */
  function render() {
    paper.innerHTML = "";
    visualObj = ABCJS.renderAbc("paper", song.abc, {
      responsive: "resize", add_classes: true, staffwidth: 860,
      paddingtop: 0, paddingbottom: 14, paddingleft: 0, paddingright: 0
    });
  }

  function clearHighlights() {
    var old = paper.querySelectorAll(".abcjs-highlight");
    for (var i = 0; i < old.length; i++) old[i].classList.remove("abcjs-highlight");
  }

  /* ================= transport state ================= */
  function setBar(bar) {
    if (bar === curBar) return;
    curBar = bar;
    $("barnum").textContent = bar;
    var pc = (bar - 1) / totalBars * 100;
    $("head").style.left = pc + "%";
    $("fill").style.width = pc + "%";
    strip.setAttribute("aria-valuenow", bar);
    strip.setAttribute("aria-valuetext", "bar " + bar + " of " + totalBars);
  }

  function paintPlay() {
    $("glyph").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
    $("playlab").textContent = playing ? "Pause" : "Play";
  }

  var lastTop = null;
  var cursorControl = {
    beatSubdivisions: 2,
    onStart: function () { lastTop = null; },
    onBeat: function (beatNumber) {
      if (dragging || busy) return;
      setBar(Math.max(1, Math.min(totalBars, Math.floor(beatNumber / 4) + 1)));
    },
    onEvent: function (ev) {
      if (!ev || dragging || busy || (ev.measureStart && ev.left === null)) return;
      clearHighlights();
      var first = null;
      (ev.elements || []).forEach(function (set) {
        set.forEach(function (el) { el.classList.add("abcjs-highlight"); if (!first) first = el; });
      });
      if (followOn && first && ev.top !== lastTop) {
        lastTop = ev.top;
        var r = first.getBoundingClientRect();
        if (r.top < 120 || r.bottom > innerHeight - 60) {
          scrollBy({ top: r.top - innerHeight * 0.38, behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
    },
    onFinished: function () {
      playing = false; paintPlay(); clearHighlights();
      curBar = 0; setBar(1);
    }
  };

  /* ================= audio ================= */
  function audioParams() {
    return { chordsOff: !chordsOn, program: 0, midiTranspose: 0, qpm: targetBpm };
  }

  /* Picking a new song used to leave the PREVIOUS tune primed inside the controller, so
     pressing Play replayed the song you had just navigated away from. Reusing one
     SynthController across tunes is not reliable -- tear it down and build a fresh one
     for every song. loadToken also defeats the race where you click through songs fast
     and an older setTune() resolves after a newer one. */
  function setupAudio() {
    if (!ABCJS.synth.supportsAudio()) { $("playlab").textContent = "No audio"; return; }
    var token = ++loadToken;
    ready = false; playing = false; busy = false;
    paintPlay();
    $("play").disabled = true; $("restart").disabled = true;
    if (synth) {
      try { synth.pause(); } catch (e) {}
      try { synth.destroy(); } catch (e) {}
    }
    $("audiohost").innerHTML = "";
    synth = new ABCJS.synth.SynthController();
    synth.load("#audiohost", cursorControl,
      { displayPlay: true, displayProgress: true, displayWarp: true });
    var mine = synth;
    return mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;   // superseded by a newer pick
      ready = true;
      $("play").disabled = false; $("restart").disabled = false;
      paintPlay();
    }).catch(function (e) {
      if (token !== loadToken) return;
      $("playlab").textContent = "Audio failed"; console.error(e);
    });
  }

  /* Tempo.
     setWarp() is self-contained: it tears the tune down, re-primes the audio AND the
     TimingCallbacks clock at the new rate, restores the playback position, and resumes
     if it was playing. So audio and playhead stay locked together by construction.
     Do NOT pause/seek/play around it -- doing so races its own restart and stalls the
     clock. Just hold off our beat handler until its promise settles. */
  function applyTempo(bpm) {
    targetBpm = bpm;
    $("bpm").textContent = bpm + " bpm";
    if (!synth || !ready || !song) return;
    var pct = Math.max(1, Math.round(bpm / song.tempo * 100));
    busy = true;
    var release = function () { busy = false; };
    var res = synth.setWarp(pct);
    if (res && typeof res.then === "function") res.then(release, release);
    else setTimeout(release, 500);
    setTimeout(release, 3000);            // safety net if the promise never settles
  }

  function seekToBar(bar) {
    bar = Math.max(1, Math.min(totalBars, bar));
    setBar(bar);
    if (!ready) return;
    clearHighlights();
    lastTop = null;
    synth.seek((bar - 1) / totalBars);
  }

  /* ================= scrubbing ================= */
  function barAtX(clientX) {
    var r = strip.getBoundingClientRect();
    if (!r.width) return curBar;
    var f = (clientX - r.left) / r.width;
    f = Math.max(0, Math.min(0.99999, f));
    return Math.max(1, Math.min(totalBars, Math.floor(f * totalBars) + 1));
  }
  strip.addEventListener("pointerdown", function (e) {
    if (!ready || (e.button !== 0 && e.pointerType === "mouse")) return;
    dragging = true; strip.classList.add("dragging");
    try { strip.setPointerCapture(e.pointerId); } catch (_) {}
    clearHighlights(); setBar(barAtX(e.clientX));
    e.preventDefault(); strip.focus();
  });
  strip.addEventListener("pointermove", function (e) {
    if (dragging) setBar(barAtX(e.clientX));
  });
  function endScrub(e) {
    if (!dragging) return;
    dragging = false; strip.classList.remove("dragging");
    try { strip.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToBar(barAtX(e.clientX));
  }
  strip.addEventListener("pointerup", endScrub);
  strip.addEventListener("pointercancel", endScrub);
  strip.addEventListener("keydown", function (e) {
    var d = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 4 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -4 : -1;
    else if (e.key === "Home") d = -totalBars;
    else if (e.key === "End") d = totalBars;
    else return;
    e.preventDefault(); seekToBar(curBar + d);
  });

  /* ================= controls ================= */
  $("play").addEventListener("click", function () {
    if (!ready) return;
    playing = !playing; paintPlay(); synth.play();
  });
  $("restart").addEventListener("click", function () {
    if (!ready) return;
    synth.restart(); curBar = 0; setBar(1);
    if (!playing) { playing = true; paintPlay(); synth.play(); }
  });
  $("chords").addEventListener("click", function () {
    if (!ready) return;
    chordsOn = !chordsOn;
    this.setAttribute("aria-pressed", String(chordsOn));
    this.textContent = chordsOn ? "Chords on" : "Chords off";
    var bar = curBar, wasPlaying = playing, token = ++loadToken, mine = synth;
    playing = false; paintPlay(); ready = false;
    mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;
      ready = true; seekToBar(bar);
      if (wasPlaying) { playing = true; paintPlay(); synth.play(); }
    });
  });
  $("follow").addEventListener("click", function () {
    followOn = !followOn;
    this.setAttribute("aria-pressed", String(followOn));
    this.textContent = followOn ? "Follow" : "Follow off";
  });
  $("tempo").addEventListener("input", function () { $("bpm").textContent = this.value + " bpm"; });
  $("tempo").addEventListener("change", function () { applyTempo(+this.value); });

  addEventListener("keydown", function (e) {
    if (e.code === "Space" && !/^(INPUT|TEXTAREA|BUTTON|A)$/.test(e.target.tagName)) {
      e.preventDefault(); $("play").click();
    }
  });

  /* ================= spec modal ================= */
  function openSpec() {
    $("modal").hidden = false;
    $("specclose").focus();
  }
  function closeSpec() { $("modal").hidden = true; $("specbtn").focus(); }
  $("specbtn").addEventListener("click", openSpec);
  $("specclose").addEventListener("click", closeSpec);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeSpec(); });
  addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("modal").hidden) { e.preventDefault(); closeSpec(); }
  });

  /* ================= boot ================= */
  var startVersion = VERSIONS.length ? VERSIONS[0].id : null;
  try {
    var lastV = localStorage.getItem("lastVersion");
    for (var vi = 0; vi < VERSIONS.length; vi++) {
      if (VERSIONS[vi].id === lastV) startVersion = lastV;
    }
  } catch (e) {}
  if (startVersion) {
    selectVersion(startVersion);
    try {
      var last = localStorage.getItem("lastSong");
      for (var i = 0; i < SONGS.length; i++) if (SONGS[i].slug === last) { select(i); break; }
    } catch (e) {}
  }

  // test hook
  window.__p = {
    bar: function () { return curBar; },
    bpm: function () { return targetBpm; },
    ready: function () { return ready; },
    song: function () { return song && song.slug; },
    version: function () { return version && version.id; },
    synthId: function () { return synth ? (synth.__id || (synth.__id = ++idc)) : null; },
    // true when the PRIMED tune is the one currently on screen -- the switching bug
    primedIsCurrent: function () {
      try { return synth.visualObj === visualObj[0]; } catch (e) { return null; }
    },
    dur: function () {
      try { return Math.round(synth.midiBuffer.duration * 100) / 100; } catch (e) { return null; }
    }
  };
  var idc = 0;
})();
</script>
