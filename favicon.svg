<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheets">
  <!-- The forte marking, which is an italic f. Set as text rather than drawn as a
       path: the printed dynamic IS a letterform, and a hand-built path came out
       stiff and uniform where a real italic has thick-and-thin and a long
       descender. The glyph is plain ASCII "f", so the worst a machine without
       Georgia can do is fall back to another serif italic, never a blank box.
       That last risk is what ruled out the Unicode forte character U+1D191. -->
  <rect width="64" height="64" rx="14" fill="#1F5C56"/>
  <text x="33" y="47" text-anchor="middle"
        font-family="Georgia,'Times New Roman','Playfair Display',serif"
        font-style="italic" font-weight="700" font-size="54" fill="#FCFBF7">f</text>
</svg>
