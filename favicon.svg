<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Piano lead sheets">
  <rect width="64" height="64" rx="14" fill="#1F5C56"/>
  <g fill="#FCFBF7">
    <!-- beam joining the two stems -->
    <path d="M20.5 15.5 L51 9.5 L51 19.5 L20.5 25.5 Z"/>
    <!-- stems -->
    <rect x="20.5" y="15.5" width="5" height="30"/>
    <rect x="46" y="10.5" width="5" height="30"/>
    <!-- note heads, tilted the way engraved noteheads sit -->
    <ellipse cx="15" cy="45.5" rx="9" ry="6.8" transform="rotate(-20 15 45.5)"/>
    <ellipse cx="40.5" cy="40.5" rx="9" ry="6.8" transform="rotate(-20 40.5 40.5)"/>
  </g>
</svg>
