<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Lead Sheets</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E7EAE5; --surface:#F3F5F1; --paper:#FCFBF7; --paper-edge:#DCDFD7;
  --ink:#16201E; --ink-2:#55635E; --ink-3:#8A968F;
  --line:#C9D0C8; --accent:#2C6E67; --accent-soft:rgba(44,110,103,.13);
  --accent-on:#FCFBF7; --cursor:#9333EA; --radius:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
    --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
    --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
    --accent-on:#0D1312; --cursor:#C77DFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
  --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
  --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
  --accent-on:#0D1312; --cursor:#C77DFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:980px; margin:0 auto; padding-inline:16px; padding-block:32px 64px}

/* ---------- masthead ---------- */
.masthead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:16px}
h1{font-family:"Bodoni Moda",Didot,"Times New Roman",serif; font-weight:400;
  font-size:clamp(30px,5.5vw,46px); line-height:1; margin:0}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; margin-left:auto}
.ctl.theme{font-size:12px; color:var(--ink-3); gap:8px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; background:var(--bg)}
.seg input{position:absolute; opacity:0; width:0; height:0; pointer-events:none}
.seg label{padding:6px 11px; font-size:12px; font-weight:500; cursor:pointer; color:var(--ink-2);
  border-right:1px solid var(--line); line-height:1.2; user-select:none; white-space:nowrap}
.seg label:last-child{border-right:0}
.seg label:hover{color:var(--accent)}
.seg input:checked + label{background:var(--accent); color:var(--accent-on)}
.seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:-2px}

button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
.btn{border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:border-color .15s,color .15s; text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{border-color:var(--line); color:inherit}
.btn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.btn.ghost{padding:6px 11px; font-size:12.5px}
select{font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px; cursor:pointer}
select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- song picker ---------- */
.picker{display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap}
.picker .nav{min-width:66px; font-size:20px; line-height:1; padding:10px 22px; font-weight:600}
#songsel{flex:1 1 320px; min-width:0; font-size:15px; padding:9px 10px; font-weight:500}
.where{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.04em; white-space:nowrap}

/* ---------- transport ---------- */
.transport{position:sticky; top:0; z-index:20; margin-top:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px; display:flex; flex-direction:column; gap:11px}
.row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.play{min-width:104px; display:inline-flex; align-items:center; justify-content:center;
  gap:8px; background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.play:hover{color:var(--accent-on); filter:brightness(1.08)}
.play:disabled{filter:none}
.play .glyph{font-size:11px; line-height:1}
a.dl{color:var(--ink)} a.dl:hover{color:var(--accent)}
a.dl .arrow{color:var(--accent); font-weight:600}
.ctl{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.ctl input[type=range]{accent-color:var(--accent); width:118px}
.keygrp{gap:5px}
.keygrp select{min-width:104px; text-align:center}
.btn.step{padding:8px 14px; font-size:17px; line-height:1; font-weight:700; min-width:40px}
.ctl output{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; min-width:50px}
.barrow{display:flex; align-items:center; gap:12px}
.barrow .bar-strip{flex:1 1 auto; min-width:0}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto}
.readout b{color:var(--ink); font-weight:500}

/* ---------- scrub ---------- */
.bar-strip{position:relative; height:28px; cursor:pointer; touch-action:none; user-select:none}
.bar-strip.dragging{cursor:grabbing}
#track{position:absolute; inset:0; background:var(--bg); border-radius:2px; overflow:hidden}
#fill{position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--accent); opacity:.16; pointer-events:none}
.tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}
.tick.period{background:var(--ink-3); opacity:.5}
#head{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); pointer-events:none}
#head::after{content:""; position:absolute; left:-4px; right:-4px; top:-2px; height:6px;
  background:var(--ink); border-radius:1px}
.bar-strip:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- score ---------- */
.sheet{margin-top:20px; background:var(--paper); border:1px solid var(--paper-edge);
  border-radius:var(--radius); padding:22px 16px 28px}
#paper{color:var(--ink)}
#paper svg{max-width:100%; height:auto; display:block}
#paper svg path{fill:currentColor}
#paper svg text,#paper svg tspan{fill:currentColor}
#paper .abcjs-highlight,#paper .abcjs-highlight path,#paper .abcjs-highlight text{
  fill:var(--cursor) !important}
/* the playhead is an SVG line INSIDE the score, so it shares the score's
   coordinate system and stays put when the responsive SVG rescales */
#paper svg .playhead{stroke:var(--cursor); stroke-width:2.2; opacity:.92;
  stroke-linecap:round; pointer-events:none}
.empty{color:var(--ink-3); font-size:13px; font-style:italic; padding:44px 0; text-align:center}
#audiohost{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

/* ---------- modals ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-family:"Bodoni Moda",Didot,serif; font-weight:400; font-size:22px}
.modal-head .btn{margin-left:auto}
#spectext{margin:0; padding:18px 20px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  color:var(--ink-2); tab-size:2}
.dirlist{margin:0; padding:14px; overflow:auto; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.dircard{text-align:left; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px 15px; cursor:pointer; display:flex;
  flex-direction:column; gap:5px; transition:border-color .15s,background .15s}
.dircard:hover{border-color:var(--accent)}
.dircard[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.dircard .dt{font-weight:600; font-size:16px}
.dircard .dn{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3)}
.dircard .db{font-size:13px; color:var(--ink-2); line-height:1.45}

@media (max-width:620px){
  .readout{margin-left:0; width:100%}
  .ctl input[type=range]{width:96px}
}
/* Portrait tablet: the transport wraps to two or three rows, so give the rows
   room and let the song picker own a full line of its own. */
@media (max-width:980px){
  .wrap{padding-block:22px 56px}
  h1{font-size:26px}
  .masthead{gap:10px; flex-wrap:nowrap; align-items:center}
  .masthead h1{flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .count{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
         flex:0 1 auto; min-width:0}
  .ctl.theme{flex:0 0 auto}
  .ctl.theme > span{display:none}
  .picker{gap:8px; flex-wrap:nowrap}
  .picker .nav{flex:0 0 auto; min-width:84px; padding:11px 16px}
  #songsel{flex:1 1 auto; min-width:0}
  .where{flex:0 0 auto}
  .row{flex-wrap:nowrap; gap:8px}
  .play{min-width:86px}
  .keygrp{flex:0 0 auto}
  .keygrp > span{display:none}
  .keygrp select{min-width:76px}
  .ctl.tempo > span{display:none}
  .ctl input[type=range]{width:92px}
  .ctl output{min-width:46px; font-size:12px}
  #pdf{flex:0 0 auto}
}
/* Anything driven by a finger gets a 44px-ish target. */
@media (pointer:coarse){
  .btn{padding:11px 16px; font-size:14px}
  .btn.ghost{padding:10px 14px; font-size:13px}
  select{padding:11px 10px; font-size:14px}
  .ctl.theme select{padding:8px 8px; font-size:13px}
  .picker .nav{padding:14px 24px; font-size:22px}
  .bar-strip{height:38px}
  .ctl input[type=range]{height:28px}
  .dircard{padding:16px 17px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important; transition:none !important}}
@media print{
  .masthead,.picker,.transport,.modal{display:none}
  body{background:#fff} .sheet{border:none; background:#fff; margin:0; padding:0}
  #paper svg .playhead{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Piano Lead Sheets</h1>
    <button class="btn ghost" id="browse" type="button">&#9776;&nbsp; Browse</button>
    <button class="btn ghost" id="specbtn" type="button">View spec</button>
    <span class="count" id="count"></span>
    <div class="ctl theme">
      <span>Theme</span>
      <div class="seg" role="radiogroup" aria-label="Theme">
        <input type="radio" name="theme" id="th-auto" value="auto">
        <label for="th-auto">Auto</label>
        <input type="radio" name="theme" id="th-light" value="light">
        <label for="th-light">Day</label>
        <input type="radio" name="theme" id="th-dark" value="dark">
        <label for="th-dark">Dark</label>
      </div>
    </div>
  </header>

  <div class="picker">
    <button class="btn nav" id="prev" type="button" aria-label="Previous song">&#8249;</button>
    <select id="songsel" aria-label="Choose a song"></select>
    <button class="btn nav" id="next" type="button" aria-label="Next song">&#8250;</button>
    <span class="where" id="where"></span>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <span class="ctl keygrp"><span>Key</span>
        <button class="btn step" id="keydown" type="button" aria-label="Down a semitone">&#9662;</button>
        <select id="keysel" aria-label="Key"></select>
        <button class="btn step" id="keyup" type="button" aria-label="Up a semitone">&#9652;</button>
      </span>
      <label class="ctl tempo" for="tempo"><span>Tempo</span>
        <input type="range" id="tempo" min="40" max="225" step="1" value="100">
        <output id="bpm" for="tempo">100 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
    </div>
    <div class="barrow">
      <div class="bar-strip" id="strip" role="slider" tabindex="0"
           aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="32" aria-valuenow="1">
        <div id="track"></div>
        <div id="fill"></div>
        <div id="head"></div>
      </div>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">32</b></span>
    </div>
  </div>

  <div class="sheet">
    <div id="paper"><p class="empty">Loading&hellip;</p></div>
  </div>
</div>

<div class="modal" id="dirmodal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dirtitle">
    <div class="modal-head">
      <h2 id="dirtitle">Browse collections</h2>
      <button class="btn" id="dirclose" type="button">Close</button>
    </div>
    <div class="dirlist" id="dirlist"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="spectitle">
    <div class="modal-head">
      <h2 id="spectitle">Spec</h2>
      <button class="btn" id="specclose" type="button">Close</button>
    </div>
    <pre id="spectext"></pre>
  </div>
</div>

<div id="audiohost"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script>
(function () {
  "use strict";
  var COLLECTIONS = [
  {
    "id": "classics",
    "title": "Classics",
    "blurb": "Traditional and early-popular melodies that are in the public domain, arranged as beginner-intermediate lead sheets. Written in C; use the Key control to transpose any of them.",
    "order": 1,
    "sets": [
      {
        "id": "classics",
        "label": "Public-domain traditional melodies",
        "spec": "# Arranging spec — Classics\n\nThis collection is **not** original composition. Each song here is an existing, well-known\nmelody that is in the **public domain**, arranged as a beginner–intermediate lead sheet:\na single-line melody in the treble clef with chord symbols above it. No left-hand part.\n\nYour job is to transcribe a tune faithfully, not to invent one.\n\n---\n\n## 1. The job\n\nYou are given **one song title**. Write the melody as you know it, in the **key of C** (or A\nminor for minor-key tunes), with simple chord symbols underneath.\n\nTwo things matter more than anything else:\n\n1. **The melody must be recognisable.** Someone who knows the song should be able to hum along\n   from bar one. Get the tune right — the rhythm of it as much as the pitches. If you are\n   unsure of a passage, choose the most commonly sung version rather than an ornate one.\n2. **Keep it playable.** This is for a beginner–intermediate pianist. Do not add ornaments,\n   grace notes or runs that are not in the tune.\n\nWrite **only the main strain** — typically one verse, or a verse plus its chorus. 16 to 40 bars\nis the normal range. Do not write out repeats; write the tune once through.\n\n## 2. The file\n\nWrite exactly one file to the path you are given, `collections/classics/songs/<slug>.json`:\n\n```json\n{\n  \"title\": \"Oh! Susanna\",\n  \"source\": \"Stephen Foster, 1848 — public domain\",\n  \"key\": \"C\",\n  \"meter\": \"4/4\",\n  \"pickup\": 4,\n  \"tempo\": 116,\n  \"bars\": [\n    { \"chord\": \"C\", \"notes\": \"C5:2 D5:2\" },\n    { \"chord\": \"C\", \"notes\": \"E5:4 G5:4 G5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — the song's usual title, spelled normally.\n- `source` — composer/date if known, otherwise \"Traditional\", **and the words \"public domain\"**.\n- `key` — `C` for major tunes, `Am` for minor ones. Nothing else.\n- `meter` — one of `4/4`, `3/4`, `2/4`, `6/8`. Use the meter the tune is normally written in.\n- `pickup` — **omit it** if the tune starts on beat 1. If the tune starts with an upbeat, set\n  this to the length of that upbeat in sixteenth units, and make bar 1 exactly that long.\n- `tempo` — a sensible performance tempo in beats per minute.\n- `bars` — the tune, one object per bar.\n\n## 3. The note language\n\n**Durations are counted in sixteenth notes.** A full bar is 16 units in 4/4, 12 in 3/4 or 6/8,\nand 8 in 2/4.\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C, so `C5` sits in the treble staff),\n`F#5:2`, `Bb4:8`, `R:4` for a rest, `[G7]D5:4` to change chord mid-bar.\n\n**There is no tie syntax.** A note cannot be held across a barline. Where a tune holds a note\nacross a bar line, write the note as long as the bar allows and let the next bar begin the next\nnote — or, better, choose the phrasing that keeps each bar self-contained.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Every bar's durations sum to exactly the bar length** for your meter (16 / 12 / 8).\n   The pickup bar, if you declare one, sums to exactly the `pickup` value. This is the most\n   common mistake — add each bar up.\n2. **Every bar begins with a struck note** — never a rest. (The pickup bar counts as a bar.)\n3. **Range `G4` to `C6`.** If the tune as you know it goes outside that, move the offending\n   phrase by an octave, or pick the octave that keeps the whole tune inside the window.\n4. **The song ends on the tonic** — `C5` (or `A5`/`A4` in A minor) — held at least a half note.\n5. Chord suffixes allowed: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`,\n   `6`, `m6`. A slash bass is allowed: `G/B`.\n\n## 5. Harmony\n\nKeep it simple and traditional — the harmony a folk guitarist or a parlour pianist would use.\n\n- In **C**: mostly `C`, `F`, `G` and `G7`, with `Am`, `Dm` and `Em` where the tune asks for them.\n- In **Am**: mostly `Am`, `Dm`, `E7` and `G`, with `C` and `F`.\n- One chord per bar is the norm. Two is fine where the tune clearly changes mid-bar — use the\n  `[Chord]` marker for the second one.\n- A `G7` before the final `C` is almost always right.\n- Do not add jazz reharmonisation. These are folk tunes; plain triads and the odd seventh.\n\n## 6. Check your work — required\n\n```bash\npython src/validate.py collections/classics/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen read your own file back and check the melody by singing it in your head against the tune\nyou know. Ask specifically:\n\n- does bar 1 start where the tune starts (upbeat or downbeat)?\n- is the rhythm of the opening phrase right, including any dotted notes?\n- does each phrase end where it should, on the note it should?\n- would someone recognise it?\n\nA file that passes the validator but does not sound like the song has failed the task.\n\n## 7. Public domain\n\nOnly arrange the melody you were asked for, and only because it is old enough to be in the\npublic domain. Do not substitute a modern song, and do not copy any particular modern\npublisher's arrangement — write the traditional tune as it is commonly sung.\n",
        "songs": [
          {
            "slug": "amazing-grace",
            "title": "Amazing Grace",
            "key": "C",
            "meter": "3/4",
            "tempo": 80,
            "bars": 16,
            "source": "Traditional — tune \"New Britain\", 1835; words John Newton — public domain",
            "pdf": "songs/classics/amazing-grace.pdf",
            "abc": "X:1\nM:3/4\nL:1/16\nQ:1/4=80\nK:C clef=treble\n\"C\"G4 | \"C\"c8 e2c2 | \"C\"e8 d4 | \"F\"c8 A4 |\n\"C\"G8 G4 | \"C\"c8 e2c2 | \"Am\"e8 d2e2 | \"C\"g12 |\n\"C\"g8 e2g2 | \"C\"g8 e2c2 | \"Am\"e8 e2d2 | \"F\"c8 A4 |\n\"C\"G8 G4 | \"C\"c8 e2c2 | \"C\"e8 \"G7\"d4 | \"C\"Hc12 |]\n"
          },
          {
            "slug": "auld-lang-syne",
            "title": "Auld Lang Syne",
            "key": "C",
            "meter": "4/4",
            "tempo": 92,
            "bars": 17,
            "source": "Traditional Scottish; words by Robert Burns, 1788 - public domain",
            "pdf": "songs/classics/auld-lang-syne.pdf",
            "abc": "X:1\nM:4/4\nL:1/16\nQ:1/4=92\nK:C clef=treble\n\"C\"G4 | \"C\"c6 c2 c4 e4 | \"G7\"d6 c2 d4 e4 | \"C\"c6 c2 e4 g4 |\n\"F\"a12 a4 | \"C\"g6 e2 e4 c4 | \"G7\"d6 c2 d4 e4 | \"F\"c6 A2 A4 \"G7\"G4 |\n\"C\"c12 a4 | \"C\"g6 e2 e4 c4 | \"G7\"d6 c2 d4 a4 | \"C\"g6 e2 e4 g4 |\n\"F\"a12 c'4 | \"C\"g6 e2 e4 c4 | \"G7\"d6 c2 d4 e4 | \"F\"c6 A2 A4 \"G7\"G4 |\n\"C\"Hc16 |]\n"
          },
          {
            "slug": "aura-lee",
            "title": "Aura Lee",
            "key": "C",

        "label": "32-bar AABA, jaunty animated-musical style",
        "spec": "# Songwriting spec v6 — 32-bar AABA, jaunty animated-musical style\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What this set is\n\nv6 returns to the **v3 structure** — 32-bar AABA with a cadence that rotates every eight bars —\nand changes the *style*. There is no swing here: you write exactly the rhythms you mean, and\nthey are printed and played exactly as written.\n\nThe sound to aim at is the **jaunty production number from a golden-age animated musical**:\nbright, bouncing, grinning, the kind of tune a character sings while striding down a road or\nsweeping a floor. Cheerful and busy, with a bounce in the rhythm and a wink in the harmony.\n\nThree things make that style, and all three are unusual compared with the earlier sets:\n\n1. **A dotted bounce.** The signature rhythm is the dotted-eighth-plus-sixteenth snap —\n   written `3 1`. It is springy where a plain pair of eighths is flat. Your head figure\n   contains one; use it as the character of the tune.\n2. **Leaps, not just steps.** Earlier sets asked for stepwise melodies. This one wants\n   confidence: rising sixths, octaves, and openings that spell out the chord. Up to **45%** of\n   your intervals may be larger than a major third — roughly half again what the other sets\n   allow. Take the room.\n3. **Sweetened harmony.** Added sixths, secondary dominants and chromatic passing chords.\n   This is what separates the style from a folk tune. See §10.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: key, tempo, character, a **head figure**, a\n**syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v6/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C6\",  \"notes\": \"C5:3 E5:1 G5:4 E5:4 G5:4\" },\n    { \"chord\": \"A7\",  \"notes\": \"A5:4 G5:3 F#5:1 E5:4 C#5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C), `F#5:2`, `Bb4:8`, `R:4` for a rest,\n`[Am]E5:4` to change chord mid-bar. **There is no tie syntax**: a note may not cross a barline.\n\n`3 1` is the dotted snap, and in this set you write it yourself — nothing is transformed at\nbuild time.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.**\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb.\n6. Chord suffixes: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. Head figures — the bounce\n\nEach contains at least one dotted snap. Use yours on the moving bars of A, A′ and A″.\n\n| id | rhythm | where the snap falls |\n|----|--------|----------------------|\n| J1 | `3 1 4 4 4`       | beat 1 |\n| J2 | `4 3 1 4 4`       | beat 2 |\n| J3 | `3 1 3 1 4 4`     | beats 1 and 2 |\n| J4 | `4 4 3 1 4`       | beat 3 |\n| J5 | `2 2 4 3 1 4`     | beat 3, after an eighth pair |\n| J6 | `3 1 2 2 4 4`     | beat 1, into an eighth pair |\n| J7 | `2 2 2 2 3 1 4`   | beat 3, after running eighths |\n| J8 | `3 1 4 2 2 4`     | beat 1, eighth pair on beat 3 |\n\n## 6. Syncopation figures — the charleston\n\nEach throws a long note onto an off-beat. Use yours across B and at least 3 other bars.\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| K1 | `6 2 6 2`     | | K5 | `4 2 2 6 2` |\n| K2 | `4 6 2 4`     | | K6 | `6 2 4 2 2` |\n| K3 | `6 6 4`       | | K7 | `2 2 6 2 4` |\n| K4 | `2 6 2 6`     | | K8 | `6 2 2 2 4` |\n\n## 7. Landing figures — one per 8-bar section\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\n\n| id | rhythm  | | id | rhythm    | | id | rhythm |\n|----|---------|-|----|-----------|-|----|--------|\n| LA | `4 4 8` | | LD | `6 2 8`   | | LH | `8 8`  |\n| LB | `8 4 4` | | LE | `2 2 4 8` | | LJ | `4 8 4` |\n| LC | `4 12`  | | LF | `12 4`    | | LG | `2 2 12` |\n\nKeep the rhythm exactly; the pitches are yours, and the two landings in a section should differ\n— the first more open, the second more conclusive.\n\n## 8. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune on your head figure. **Ends OPEN** — bar 8 on the dominant, a non-tonic note. |\n| 9–16  | **A′**  | The tune varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge: new harmony, your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each section: bars 1–3 move (head figure, the shape sequencing by step), bar 4 lands,\nbars 5–7 move, bar 8 lands.\n\n## 9. Melody — write it to be sung with a grin\n\n- **Open with the chord.** Begin a phrase by outlining the chord — `C5 E5 G5`, or a rising\n  sixth `C5` up to `A5`. An arpeggio opening followed by a stepwise fall is the classic shape\n  of this style, and it is what the raised leap allowance is for.\n- **Answer a leap by stepping back** the other way. A leap up then a scale down is the whole\n  gesture; a leap up then another leap up is just noise.\n- **Repeated notes are good here.** Three or four of the same pitch in a row reads as patter —\n  the rhythm of words. This set lifts the \"never repeat a pitch more than twice\" rule: you may\n  repeat up to **four** times when the rhythm is doing the work.\n- **Land on chord tones** on beat 1, and usually beat 3. With sevenths and sixths in the\n  harmony you have more chord tones to land on — use the 6th and the 7th, they are the colour.\n- **One high point**, in B, reached once, and reach it by leap for maximum grin.\n- Keep the whole thing inside `G4`–`C6`.\n\n## 10. Harmony — this is where the style lives\n\nOne chord loop across A, A′ and A″; a different one for B. One chord per bar, though a\nmid-bar change with `[Chord]` is welcome at a cadence.\n\n**Use all three of these devices.** A song that only uses plain triads will not sound like this\nstyle no matter what the rhythm does.\n\n1. **Added sixths.** Use `C6`, `F6`, `G6` in place of plain major chords, especially on the\n   tonic at a landing. It is the period sound.\n2. **Secondary dominants.** A major 7th chord borrowed to lead into a diatonic chord:\n   in C, `D7` pulls to `G`, `A7` pulls to `Dm`, `E7` pulls to `Am`. Put the chromatic note in\n   the melody — `F#` over `D7`, `C#` over `A7`, `G#` over `E7`. Use at least **three** across\n   the song; a chain of them (`E7 – A7 – D7 – G7 – C`) is a fine way to build a bridge.\n3. **Diminished passing chords.** `dim` between two diatonic chords a step apart:\n   `C – C#dim – Dm`, or `F – F#dim – C/G`. One or two is plenty.\n\nDiatonic chords to build the loop from:\n\n| key | chords |\n|-----|--------|\n| **C**  | C, C6, Dm, Em, F, F6, G, G7, Am, Cmaj7, Dm7, Am7 |\n| **G**  | G, G6, Am, Bm, C, C6, D, D7, Em, Gmaj7, Am7, Em7 |\n| **D**  | D, D6, Em, F#m, G, G6, A, A7, Bm, Dmaj7, Em7, Bm7 |\n| **F**  | F, F6, Gm, Am, Bb, Bb6, C, C7, Dm, Fmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Bb6, Cm, Dm, Eb, Eb6, F, F7, Gm, Bbmaj7, Cm7, Gm7 |\n| **Am** | Am, Am6, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Em6, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Dm6, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nSecondary dominants available to you, by key:\n\n| key | use |\n|-----|-----|\n| **C**  | D7→G, A7→Dm, E7→Am, C7→F |\n| **G**  | A7→D, E7→Am, B7→Em, G7→C |\n| **D**  | E7→A, B7→Em, F#7→Bm, D7→G |\n| **F**  | G7→C, D7→Gm, A7→Dm, F7→Bb |\n| **Bb** | C7→F, G7→Cm, D7→Gm, Bb7→Eb |\n| **Am**, **Em**, **Dm** | the major dominant at each cadence (`E7`, `B7`, `A7`), plus `D7→G` in Am, `A7→D` in Em, `G7→C` in Dm |\n\nIn the minor keys the major dominant needs its raised leading tone in the melody — `G#` in Am,\n`D#` in Em, `C#` in Dm.\n\n**Key signatures:** D has F# and C#. Bb has Bb and Eb. F and Dm have Bb. G and Em have F#.\n\n## 11. Check your work — required\n\n```bash\npython src/validate.py v6/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen confirm by eye:\n\n- bars 4 and 8 share a figure; 12 and 16 a different one; 20 and 24 a third; 28 a fourth;\n- bars 8, 16 and 32 end differently (open / closed / final);\n- your head figure's dotted snap is audible throughout A, A′ and A″;\n- at least three secondary dominants, with their chromatic notes in the melody;\n- at least one added-sixth chord and one diminished passing chord.\n\n## 12. File-format reference\n\n`src/example-song.json` is a valid song — read it **for JSON syntax only**. It is a 40-bar v1\nsong in a plain diatonic style and is not a model for anything here.\n",

        "id": "v5",
        "label": "32-bar AABA, shuffle feel, leaner eighth texture",
        "spec": "# Songwriting spec v5 — 32-bar AABA with a shuffle feel\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What changed from v4 — read this first\n\nTwo changes: the songs **swing**, and the texture is **leaner**.\n\n| | v4 average | **v5 target** |\n|---|---|---|\n| eighth notes | 149 | **60–86** (about half) |\n| half notes | 10.8 | at least **10** |\n| bars with a run of 4+ short notes | 20.2 | at least **10** |\n\nv4 filled almost every moving bar with running eighths. v5 pulls that back: fewer eighths, more\nquarters and held notes, and the eighths that remain are grouped into **pairs that swing**.\n\n### How the swing works — this affects how you write\n\nYou write **straight eighths**. At build time, every eighth pair that **starts on a beat** is\nrewritten as a dotted-eighth plus a sixteenth — a shuffle — in the printed score, the on-screen\nscore and the audio alike.\n\n```\nyou write:   C5:2 D5:2 E5:4 F5:4      ->   built as:   C5:3 D5:1 E5:4 F5:4\n```\n\nThis is done literally rather than by printing \"swing the eighths\" over straight notation,\nbecause the playback engine has no swing setting — a marking alone would look right and play\nstraight. The score carries the words *Shuffle — swing the eighths* as well.\n\n**The consequence for you: an eighth only swings if it is in a pair that begins on a beat.**\nA bar is divided into four beats at positions 0, 4, 8 and 12 (counting in sixteenths).\n\n- `4 2 2 4 4` — the pair starts at position 4, on beat 2. **Swings.** ✅\n- `2 2 4 4 4` — the pair starts at position 0, on beat 1. **Swings.** ✅\n- `6 2 4 4` — a lone eighth at position 6, off the beat. **Stays straight.** ❌\n\nThe validator warns if fewer than 70% of your eighths sit in on-beat pairs. Every head and\nsyncopation figure below is already built correctly — if you stick to them you are fine.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: key, tempo, character, a **head figure**, a\n**syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v5/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\", \"notes\": \"C5:2 D5:2 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"G\", \"notes\": \"D5:8 E5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C), `F#5:2`, `Bb4:8`, `R:4` for a rest,\n`[Am]E5:4` to change chord mid-bar. **There is no tie syntax**: a note may not cross a barline.\n\nDo **not** write `3` or `1` yourself. Write straight eighths and let the build swing them.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.**\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb.\n6. Chord suffixes: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. Head figures — the rhythm of your moving bars\n\nEach has exactly four eighths, all in on-beat pairs, so each bar gives you two shuffle beats\nand two steady ones. That alternation is the shuffle groove.\n\n| id | rhythm | swinging pairs begin at |\n|----|--------|-------------------------|\n| W1 | `2 2 4 2 2 4`   | beats 1 and 3 |\n| W2 | `2 2 2 2 4 4`   | beats 1 and 2 |\n| W3 | `4 2 2 2 2 4`   | beats 2 and 3 |\n| W4 | `4 4 2 2 2 2`   | beats 3 and 4 |\n| W5 | `2 2 4 4 2 2`   | beats 1 and 4 |\n| W6 | `8 2 2 2 2`     | beats 3 and 4 |\n| W7 | `2 2 2 2 8`     | beats 1 and 2 |\n| W8 | `2 2 8 2 2`     | beats 1 and 4 |\n\n## 6. Syncopation figures — use yours across B and at least 3 other bars\n\nEach displaces a longer note off the beat while keeping an on-beat eighth pair.\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| X1 | `2 2 6 2 4`   | | X5 | `2 2 2 2 6 2` |\n| X2 | `4 2 2 6 2`   | | X6 | `4 2 2 4 2 2` |\n| X3 | `6 2 4 2 2`   | | X7 | `2 2 6 4 2` |\n| X4 | `2 2 4 6 2`   | | X8 | `6 2 2 2 4` |\n\n## 7. Landing figures — one per 8-bar section\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\n\n| id | rhythm    | | id | rhythm |\n|----|-----------|-|----|--------|\n| LA | `4 4 8`   | | LE | `2 2 4 8` |\n| LB | `8 4 4`   | | LH | `8 8`     |\n| LD | `6 2 8`   | | LJ | `4 8 4`   |\n\nKeep the rhythm exactly; the pitches are yours, and the two landings in a section should differ\n— the first more open, the second more conclusive.\n\n**Half notes:** your rotation supplies most of the ten you need. If you are short, hold a half\nnote at the top of a phrase. Dotted halves and whole notes do not count toward the total.\n\n## 8. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune on your head figure. **Ends OPEN** — bar 8 on the dominant, a non-tonic note. |\n| 9–16  | **A′**  | The tune varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge: different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the single high point. |\n| 25–32 | **A″**  | The tune returns, lightly decorated. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each section: bars 1–3 move (head figure, the shape sequencing by step), bar 4 lands,\nbars 5–7 move, bar 8 lands.\n\n## 9. Melody\n\n- **Step more than you leap.** A swung eighth pair is at its best as two neighbouring scale\n  steps — the shuffle does the work, the line stays smooth.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step. Use it, and in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n- Sixteenths are not needed in v5 and you should mostly avoid writing them — the shuffle already\n  supplies the short notes. A couple of 2-note turns in A″ is the most you want.\n\n## 10. Harmony\n\nOne chord loop across A, A′ and A″; a different one for B. One chord per bar. Seventh chords\n(`7`, `m7`, `maj7`, `6`) suit a shuffle especially well — use them freely.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, C6, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, G6, Cmaj7, Am7, Em7 |\n| **D**  | D, Em, F#m, G, A, Bm, A7, Dmaj7, D6, Gmaj7, Em7, Bm7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, F6, Bbmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Cm, Dm, Eb, F, Gm, F7, Bbmaj7, Bb6, Ebmaj7, Cm7, Gm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Am6, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Em6, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Dm6, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at the A′ and A″\ncadences, with its raised leading tone (`G#`, `D#`, `C#`) in the melody.\n\n**Key signatures:** D has F# and C#. Bb has Bb and Eb. F and Dm have Bb. G and Em have F#.\n\n## 11. Check your work — required\n\n```bash\npython src/validate.py v5/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`. The validator reports your actual eighth-note, half-note and run-bar counts, and\nwarns if too few of your eighths sit in on-beat pairs.\n\nThen confirm by eye:\n\n- bars 4 and 8 share a figure; 12 and 16 a different one; 20 and 24 a third; 28 a fourth;\n- bars 8, 16 and 32 end differently (open / closed / final);\n- your eighths are in pairs starting on beats 1, 2, 3 or 4 — never stranded off the beat.\n\n## 12. File-format reference\n\n`src/example-song.json` is a valid song — read it **for JSON syntax only**. It is a 40-bar v1\nsong and does not follow any of the rules above.\n",

        "spec": "# Songwriting spec v4 — 32-bar AABA, running eighths over held landings\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What changed from v3 — read this first\n\nv3 was correct in shape but too *even* in texture: too many plain quarter notes, so the line\nwalked rather than flowed. v4 changes the texture, not the structure.\n\n| | v3 average per song | **v4 minimum per song** |\n|---|---|---|\n| eighth notes | 46 | **88** — roughly double |\n| half notes | 5 | **10** |\n| bars containing a run of 4+ eighths/sixteenths | 7 | **14** |\n\nThe validator checks all three and will tell you your actual numbers.\n\nThe sound you are aiming for is **long notes at the phrase endings, and flowing runs between\nthem.** A landing bar holds; the three bars before it move. Think of the held notes as the\nposts of a fence and the runs as the rails between them. Quarter notes are now the exception,\nnot the default — if you catch yourself writing `4 4 4 4`, that bar should probably be eighths.\n\nEverything else — AABA, the landing rotation, one bar per chord, bars opening on beat 1 — is\nunchanged from v3.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, a **head figure**,\na **syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v4/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:2 D5:2 E5:2 G5:2 A5:2 G5:2 E5:2 D5:2\" },\n    { \"chord\": \"G\",  \"notes\": \"D5:8 E5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C), `F#5:2`, `Bb4:8`, `R:4` for a rest,\n`[Am]E5:4` to change chord mid-bar. **There is no tie syntax**: a note may not cross a barline.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb.\n6. Chord suffixes: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. Texture — the point of v4\n\n### Runs go between the landings\n\nEach 4-bar phrase is **three moving bars then one landing bar**. The moving bars carry the runs;\nthe landing bar holds. A run is four or more consecutive eighths (or sixteenths) moving mostly\n**by step** — a scale fragment, a turn, a neighbour-note figure. Not arpeggios: stepwise.\n\nAt least **14 of your 32 bars** must contain such a run. With 24 moving bars available that is\ncomfortable if your head figure is itself a run — and the ones below are.\n\n### Head figures — the rhythm of your moving bars\n\n| id | rhythm | eighths |\n|----|--------|---------|\n| E1 | `2 2 2 2 2 2 2 2`   | 8 |\n| E2 | `2 2 2 2 2 2 4`     | 6 |\n| E3 | `4 2 2 2 2 2 2`     | 6 |\n| E4 | `2 2 1 1 2 2 2 2 2` | 7 + two sixteenths |\n| E5 | `1 1 2 2 2 2 2 2 2` | 7 + two sixteenths |\n| E6 | `2 2 2 2 2 2 1 1 2` | 7 + two sixteenths |\n| E7 | `2 2 2 1 1 2 2 2 2` | 7 + two sixteenths |\n| E8 | `2 2 2 2 2 2 2 2`   | 8 (same as E1; use a different contour) |\n\n### Syncopation figures — use yours across the B section and at least 3 other bars\n\nEach one displaces a longer note off the beat while staying inside the bar.\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| Y1 | `2 4 2 2 2 2 2` | | Y5 | `2 6 2 2 2 2` |\n| Y2 | `2 2 4 2 2 2 2` | | Y6 | `2 2 6 2 2 2` |\n| Y3 | `2 2 2 4 2 2 2` | | Y7 | `4 2 2 6 2` |\n| Y4 | `2 2 2 2 4 2 2` | | Y8 | `2 4 4 2 2 2` |\n\n### Landing figures — one per 8-bar section\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\nThe validator checks both.\n\n| id | rhythm    | halves |\n|----|-----------|--------|\n| LA | `4 4 8`   | 1 |\n| LB | `8 4 4`   | 1 |\n| LD | `6 2 8`   | 1 |\n| LE | `2 2 4 8` | 1 |\n| LH | `8 8`     | 2 |\n| LJ | `4 8 4`   | 1 |\n\nKeep the rhythm exactly; the pitches are yours, and the two landings in a section should differ\n— the first more open, the second more conclusive.\n\n### Where the half notes come from\n\nYour rotation supplies most of them. If you are still short of **10**, add a held half note at\nthe top of a phrase — the peak of a run is a natural place for the line to stop and breathe.\nDotted halves and whole notes do **not** count toward the half-note total.\n\n## 6. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune, built on your head figure. **Ends OPEN** — bar 8 lands on the dominant and a non-tonic note. |\n| 9–16  | **A′**  | The tune again, varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge: different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns, its runs decorated with sixteenths. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each section: bars 1–3 move (head figure, the shape sequencing by step each bar), bar 4\nlands, bars 5–7 move, bar 8 lands.\n\n## 7. Melody\n\n- **Step more than you leap** — this matters more than ever now that the line is mostly eighths.\n  A run of eighths should be a scale fragment or a turn, not a series of jumps.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step is your strongest\n  device. Use it, and again in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n- **Tempo caution:** these are quick pieces. Sixteenths belong in short 2–4 note turns; above\n  170 BPM avoid them outside your head figure.\n\n## 8. Harmony\n\nOne chord loop across A, A′ and A″; a different one for B. One chord per bar.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **D**  | D, Em, F#m, G, A, Bm, A7, Dmaj7, Gmaj7, Em7, Bm7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Cm, Dm, Eb, F, Gm, F7, Bbmaj7, Ebmaj7, Cm7, Gm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at the A′ and A″\ncadences, with         "id": "v3",
        "label": "32-bar AABA, cadence rotates every 8 bars, double tempo",
        "spec": "# Songwriting spec v3 — 32-bar AABA, rotating cadence\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nThe song must be **predictable and catchy** — a listener should be able to hum where the tune is\ngoing — while having real rhythmic life: eighths, sixteenths, and genuine syncopation.\n\n> ### What changed from v2, and why\n> **v1's problem:** every *song* ended every phrase the same way, and so did every other song.\n> **v2 fixed the cross-song half** by assigning each song its own landing figure.\n> **v2's remaining problem:** each song still used that one figure for all seven phrase endings,\n> so a single song got monotonous even though the set was varied.\n>\n> **v3 rotates the cadence.** You get **four** landing figures, one per 8-bar section. The two\n> phrase endings *inside* a section share a figure; each section uses a *different* one. So the\n> ear gets a pattern it can learn (8 bars) and then a fresh one.\n>\n> Tempos are also roughly double v2's — these are quicker pieces.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, a **head figure**,\na **syncopation figure**, and a **landing rotation** of four figures. Those are binding. Build\nthe whole piece out of them.\n\n## 2. The file\n\nWrite exactly one file: `v3/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:4 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"A5:4 G5:4 E5:2 D5:2 C5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given on your card: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card (v3 tempos run 130–200).\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>`:\n\n- `C5:4` — `C4` is middle C, so `C5` sits in the treble staff.\n- `F#5:2` `Bb4:8` — accidentals with `#` / `b`.\n- `R:4` — a quarter rest.\n- `[Am]E5:4` — changes the chord *mid-bar*, starting at this note.\n\nThere is deliberately **no tie syntax**. A note may not be held across a barline.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb,\n   `D5:16` in D and Dm, and so on.\n6. Chord symbols use a root (`A`–`G`, optional `#`/`b`) plus one of:\n   `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. The landing rotation — the heart of v3\n\nA **landing bar** is the last bar of a 4-bar phrase: bars 4, 8, 12, 16, 20, 24, 28.\n(Bar 32 is the final whole note and is exempt.)\n\nYour card gives four figures in order. Apply them by section:\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″ -----|------|\n| LA | `4 4 8`   | quarter, quarter, half |\n| LB | `8 4 4`   | lands long, then walks on |\n| LC | `4 12`    | one step, then a long hold |\n| LD | `6 2 8`   | lilt into a held note |\n| LE | `2 2 4 8` | two eighths, quarter, half |\n| LF | `12 4`    | held, with a quarter that pushes into the next phrase |\n\n### Syncopation figures — use yours for the B section and at least 3 other bars\n\n| id | rhythm | where the accents fall |\n|----|--------|------------------------|\n| S1 | `4 2 4 2 4` | on the \"and\" of 2 and of 3 |\n| S2 | `2 4 4 4 2` | everything after beat 1 is displaced |\n| S3 | `3 1 3 1 4 4` | two dotted-eighth/sixteenth snaps |\n| S4 | `2 4 2 4 4` | early off-beat pair |\n| S5 | `6 6 4`     | two dotted quarters across the beat |\n| S6 | `4 6 2 4`   | a dotted quarter straddling beat 2 |\n\n### Sixteenth runs — use at least two of these bars\n\n```\n1 1 1 1 4 4 4            a turn on beat 1\n4 1 1 1 1 4 4            a turn on beat 2\n1 1 1 1 1 1 1 1 4 4      a half-bar scale run\n2 1 1 2 2 4 4            a flick inside running eighths\n```\n\n## 6. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune, plainly, built on your head figure. **Ends OPEN** — bar 8 lands on the dominant chord and a non-tonic note, so it sounds unfinished. |\n| 9–16  | **A′**  | The tune again, varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge. Different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns, decorated with your sixteenth runs. **Ends FINAL** — bar 32 is the tonic whole note. |\n\n**The three A sections must not end the same way.** Open, then closed, then final. That contrast\nis what keeps a 32-bar AABA from sounding like a loop.\n\nWithin each 8-bar section: bars 1–3 move (head figure, pitches sequencing up or down a step\neach         "spec": "# Songwriting spec — 40-bar piano lead sheets\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved\nsheet music (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nAbove all the song must be **predictable and singable**. A listener should be able to hum\nwhere the tune is going. Surprise is not the goal; shapeliness is.\n\n---\n\n## 1. The file\n\nWrite exactly one file: `src/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"First Light\",\n  \"key\": \"C\",\n  \"tempo\": 84,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:2 E5:2 G5:4 E5:4 D5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"C5:2 E5:2 A5:4 G5:4 E5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash. It becomes the printed title.\n- `key` — one of `C`, `G`, `F`, `Am`, `Em`, `Dm`. You will be told which.\n- `tempo` — whole number, quarter-note BPM. Pick something between **66 and 100**.\n- `bars` — exactly **40** objects, in order.\n\n## 2. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>`:\n\n- `C5:4` — middle-C quarter note. `C4` is middle C, so `C5` sits in the treble staff.\n- `F#5:2` `Bb4:8` — accidentals with `#` / `b`.\n- `R:4` — a quarter rest.\n- `[Am]E5:4` — changes the chord *mid-bar*, starting at this note. Use sparingly.\n\nThere is deliberately **no tie syntax**. A note may not be held across a barline.\n\n## 3. Hard rules — the validator rejects these\n\n1. **Exactly 40 bars.**\n2. **Every bar's durations sum to exactly 16.** This is the most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest, never a held-over note.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 40 is a single whole note on the tonic**, e.g. `\"C5:16\"` in C, `\"A5:16\"` in Am.\n6. Chord symbols use a root (`A`–`G`, optional `#`/`b`) plus one of:\n   `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 4. Structure — follow this shape\n\n40 bars = five 8-bar sections. Each 8-bar section is two 4-bar phrases.\n\n| bars   | section | what happens |\n|--------|---------|--------------|\n| 1–8    | **A**   | State the tune plainly. This is the melody everything else refers back to. |\n| 9–16   | **A′**  | The same tune again, lifted in register or lightly varied. Ends with a full cadence on the tonic. |\n| 17–24  | **B**   | Contrast: a different rhythmic figure, and harmony that leans away from the tonic (IV, vi, or the relative key). |\n| 25–32  | **A″**  | The tune returns, now decorated with sixteenth notes. |\n| 33–40  | **Coda**| Quote the opening, wind down, cadence and stop. |\n\n**Phrase landings — this is what makes a song feel like it lands:**\n\n- Bars **4, 8, 12, 16, 20, 24, 28, 32, 36, 40** end 4-bar phrases. Each must be a\n  **landing bar**: at most 4 notes, ideally `X:4 Y:4 Z:8` — quarter, quarter, half.\n- Bars **8, 16, 24, 32, 40** end 8-bar periods. Their last note must be a **half note or\n  longer**, so the phrase can breathe.\n- Use the *same* landing figure repeatedly. Hearing `F5:4 E5:4 D5:8` come back four times is\n  the point, not a flaw.\n\n## 5. Rhythm — repeat a figure, don't invent a new one every bar\n\nPick **one** rhythm for the moving bars of a phrase and use it for all three, changing only the\npitches. That single decision is most of what makes a tune predictable.\n\nGood bar rhythms (each sums to 16):\n\n```\n4 4 8          landing            2 2 2 2 4 4      running eighths\n4 4 4 4        walking quarters   1 1 1 1 4 4 4    sixteenth turn, then quarters\n2 2 4 4 4      the head figure    1 1 2 2 2 4 4    sixteenth pickup\n6 2 4 4        lilt               3 1 4 4 4        dotted eighth + sixteenth\n8 4 4          long note first    2 2 4 2 2 4      eighths around a quarter\n```\n\nDensity requirements (the validator warns):\n\n- At least **16 of the 40 bars** contain eighth notes.\n- At least **6 bars** contain sixteenth notes. Put them in section A″ (bars 25–32) and one or\n  two elsewhere — sixteenths are decoration on a tune you have already established.\n- Keep a dotted quarter *inside* its bar (`6 2 4 4` finishes on beat 2½). Never let a long note\n  run past the barline.\n\n## 6. Melody\n\n- **Step more than you leap.** Most intervals should be a second or a third. After a leap,\n  turn around and step back the other way.\n- **Land on chord tones.** The note on beat 1 — and usually beat 3 — should belong to the bar's\n  chord. Passing dissonance on weak beats is good; on beat 1 it should be deliberate.\n- **Sequence.** Three bars of the same rhythm with the shape moving up or down a step each time\n  is the single most effective device available to you. Use it in section A.\n- Give the song **one high point**, usually in B or A″, and only go there once.\n- Do not repeat the same pitch more than twice in a row.\n\n## 7. Harmony\n\nSet up a 4-bar or 8-bar chord loop and reuse it. Repetition here is what lets the melody vary\nwithout the song becoming confusing. One chord per bar is the default.\n\nDiatonic chords to draw from:\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nIn the minor keys, use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at cadences —\nit needs a raised leading tone in the melody (`G#` in Am, `D#` in Em, `C#` in Dm). That is the\none place a chromatic note belongs.\n\n## 8. Check your work — required\n\n```bash\npython src/validate.py src/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING` and run it again. You are not finished until it\nprints `PASS`. Do not hand back a song that has not printed `PASS`.\n\nIf a bar's durations do not sum to 16, the error tells you the bar number and the total it got.\n\n## 9. A complete worked example\n\n`src/example-song.json` is a finished, passing song in C. Read it before you start. Note\nhow bar 4 (`F5:4 E5:4 D5:8`) comes back at bars 12, 28 and 36 unchanged, how bars 1–3 all share\nthe rhythm `2 2 4 4 4`, and how the sixteenths only appear from bar 14 onward.\n\nDo **not** imitate its melody — write your own. Imitate its discipline.\n",

    $("prev").disabled = idx === 0;
    $("next").disabled = idx === flat.length - 1;
    $("barsof").textContent = totalBars;
    strip.setAttribute("aria-valuemax", totalBars);
    $("tempo").value = Math.min(targetBpm, 225);
    $("bpm").textContent = targetBpm + " bpm";
    $("pdf").href = song.pdf;
    $("pdf").setAttribute("download", song.slug + ".pdf");
    $("spectitle").textContent = "Spec — " + coll.title +
      (coll.sets.length > 1 ? " · " + set.id : "");
    $("spectext").textContent = set.spec || (coll.blurb || "(no spec recorded)");
    buildKeys();
    buildTicks();
    render();
    curBar = 0; setBar(1);
    setupAudio();
    try { localStorage.setItem("lastSong", coll.id + "/" + song.slug); } catch (e) {}
  }

  function buildKeys() {
    var sel = $("keysel");
    sel.innerHTML = "";
    var names = isMinor(song.key) ? MINOR : MAJOR;
    var home = tonicPc(song.key);
    names.forEach(function (nm) {
      var semis = ((tonicPc(nm) - home + 6) % 12) - 6;   // keep it near the written key
      var o = document.createElement("option");
      o.value = String(semis);
      o.textContent = nm + (semis === 0 ? "  (written)" : "");
      sel.appendChild(o);
    });
    sel.value = "0";
  }

  function buildTicks() {
    var t = $("track");
    t.innerHTML = "";
    var every = totalBars > 24 ? 4 : 2;
    for (var b = 1 + every; b <= totalBars; b += every) {
      var d = document.createElement("div");
      d.className = "tick" + ((b - 1) % (every * 2) === 0 ? " period" : "");
      d.style.left = ((b - 1) / totalBars * 100) + "%";
      t.appendChild(d);
    }
  }

  /* ================= score ================= */
  function render() {
    paper.innerHTML = "";
    visualObj = ABCJS.renderAbc("paper", song.abc, {
      responsive: "resize", add_classes: true, staffwidth: 880,
      paddingtop: 0, paddingbottom: 14, paddingleft: 0, paddingright: 0,
      visualTranspose: transpose
    });
    addPlayhead();
  }

  // A <line> appended to abcjs's own <svg>, so it is measured in the score's
  // coordinate system -- which is what the note events report. A DOM overlay
  // would drift as soon as the responsive SVG scaled.
  function addPlayhead() {
    var svg = paper.querySelector("svg");
    if (!svg) { playhead = null; return; }
    playhead = document.createElementNS("http://www.w3.org/2000/svg", "line");
    playhead.setAttribute("class", "playhead");
    playhead.setAttribute("x1", 0); playhead.setAttribute("x2", 0);
    playhead.setAttribute("y1", 0); playhead.setAttribute("y2", 0);
    playhead.style.opacity = 0;
    svg.appendChild(playhead);
  }

  function movePlayhead(ev) {
    if (!playhead || ev.left == null) return;
    var x = ev.left - 2;
    playhead.setAttribute("x1", x);
    playhead.setAttribute("x2", x);
    playhead.setAttribute("y1", ev.top - 2);
    playhead.setAttribute("y2", ev.top + ev.height + 2);
    playhead.style.opacity = "";
  }

  function hidePlayhead() { if (playhead) playhead.style.opacity = 0; }

  function clearHighlights() {
    var old = paper.querySelectorAll(".abcjs-highlight");
    for (var i = 0; i < old.length; i++) old[i].classList.remove("abcjs-highlight");
  }

  /* ================= transport ================= */
  function setBar(bar) {
    if (bar === curBar) return;
    curBar = bar;
    $("barnum").textContent = bar;
    var pc = (bar - 1) / totalBars * 100;
    $("head").style.left = pc + "%";
    $("fill").style.width = pc + "%";
    strip.setAttribute("aria-valuenow", bar);
    strip.setAttribute("aria-valuetext", "bar " + bar + " of " + totalBars);
  }

  function paintPlay() {
    $("glyph").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
    $("playlab").textContent = playing ? "Pause" : "Play";
  }

  var MM_RE = /(?:^|\s)abcjs-mm(\d+)(?:\s|$)/;
  function measureOf(el) {
    if (!el) return null;
    var cls = el.getAttribute ? el.getAttribute("class") : null;
    var m = cls && MM_RE.exec(cls);
    return m ? +m[1] : null;
  }

  var cursorControl = {
    beatSubdivisions: 2,
    onStart: function () { lastTop = null; },
    onBeat: function (beatNumber, totalBeats) {
      if (dragging || busy) return;
      // Fallback only: proportional, so it is right in any meter. onEvent below
      // supersedes it with the exact measure whenever a note is sounding.
      if (!totalBeats) return;
      var frac = beatNumber / totalBeats;
      setBar(Math.max(1, Math.min(totalBars, Math.floor(frac * totalBars) + 1)));
    },
    onEvent: function (ev) {
      if (!ev || dragging || busy || (ev.measureStart && ev.left === null)) return;
      clearHighlights();
      var first = null;
      (ev.elements || []).forEach(function (s) {
        s.forEach(function (el) { el.classList.add("abcjs-highlight"); if (!first) first = el; });
      });
      var mm = measureOf(first);
      if (mm !== null) setBar(Math.max(1, Math.min(totalBars, mm + 1)));
      movePlayhead(ev);
      if (followOn && first && ev.top !== lastTop) {
        lastTop = ev.top;
        var r = first.getBoundingClientRect();
        if (r.top < 120 || r.bottom > innerHeight - 60) {
          scrollBy({ top: r.top - innerHeight * 0.38, behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
    },
    onFinished: function () {
      playing = false; paintPlay(); clearHighlights(); hidePlayhead();
      curBar = 0; setBar(1);
    }
  };

  /* ================= audio ================= */
  function audioParams() {
    return { chordsOff: !chordsOn, program: 0, midiTranspose: 0, qpm: targetBpm };
  }

  // A fresh controller per tune: reusing one leaves the previous tune primed, so
  // Play would sound the song you just navigated away from.
  function setupAudio() {
    if (!ABCJS.synth.supportsAudio()) { $("playlab").textContent = "No audio"; return; }
    var token = ++loadToken;
    ready = false; playing = false; busy = false;
    paintPlay();
    $("play").disabled = true;
    if (synth) {
      try { synth.pause(); } catch (e) {}
      try { synth.destroy(); } catch (e) {}
    }
    $("audiohost").innerHTML = "";
    synth = new ABCJS.synth.SynthController();
    synth.load("#audiohost", cursorControl,
      { displayPlay: true, displayProgress: true, displayWarp: true });
    var mine = synth;
    return mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;
      ready = true;
      $("play").disabled = false;
      paintPlay();
    }).catch(function (e) {
      if (token !== loadToken) return;
      $("playlab").textContent = "Audio failed"; console.error(e);
    });
  }

  /* setWarp re-primes the audio AND the timing clock together and restores the
     position, so audio and playhead stay locked. Do not pause/seek around it. */
  function applyTempo(bpm) {
    targetBpm = bpm;
    $("bpm").textContent = bpm + " bpm";
    if (!synth || !ready || !song) return;
    var pct = Math.max(1, Math.round(bpm / song.tempo * 100));
    busy = true;
    var release = function () { busy = false; };
    var res = synth.setWarp(pct);
    if (res && typeof res.then === "function") res.then(release, release);
    else setTimeout(release, 500);
    setTimeout(release, 3000);
  }

  function applyTranspose(semis) {
    if (!song) return;
    transpose = semis;
    var wasPlaying = playing, bar = curBar;
    render();                       // re-engrave at the new key
    setupAudio().then(function () { // and re-prime from the transposed tune
      if (bar > 1) seekToBar(bar);
      if (wasPlaying) { playing = true; paintPlay(); synth.play(); }
    });
  }

  function seekToBar(bar) {
    bar = Math.max(1, Math.min(totalBars, bar));
    setBar(bar);
    if (!ready) return;
    clearHighlights(); hidePlayhead();
    lastTop = null;
    synth.seek((bar - 1) / totalBars);
  }

  /* ================= scrubbing ================= */
  function barAtX(clientX) {
    var r = strip.getBoundingClientRect();
    if (!r.width) return curBar;
    var f = Math.max(0, Math.min(0.99999, (clientX - r.left) / r.width));
    return Math.max(1, Math.min(totalBars, Math.floor(f * totalBars) + 1));
  }
  strip.addEventListener("pointerdown", function (e) {
    if (!ready || (e.button !== 0 && e.pointerType === "mouse")) return;
    dragging = true; strip.classList.add("dragging");
    try { strip.setPointerCapture(e.pointerId); } catch (_) {}
    clearHighlights(); hidePlayhead(); setBar(barAtX(e.clientX));
    e.preventDefault(); strip.focus();
  });
  strip.addEventListener("pointermove", function (e) {
    if (dragging) setBar(barAtX(e.clientX));
  });
  function endScrub(e) {
    if (!dragging) return;
    dragging = false; strip.classList.remove("dragging");
    try { strip.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToBar(barAtX(e.clientX));
  }
  strip.addEventListener("pointerup", endScrub);
  strip.addEventListener("pointercancel", endScrub);
  strip.addEventListener("keydown", function (e) {
    var d = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 4 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -4 : -1;
    else if (e.key === "Home") d = -totalBars;
    else if (e.key === "End") d = totalBars;
    else return;
    e.preventDefault(); seekToBar(curBar + d);
  });

  /* ================= controls ================= */
  $("prev").addEventListener("click", function () { select(idx - 1); });
  $("next").addEventListener("click", function () { select(idx + 1); });
  $("play").addEventListener("click", function () {
    if (!ready) return;
    playing = !playing; paintPlay(); synth.play();
  });
  // Chords and follow are always on now, so there is nothing to toggle.
  function keyStep(dir) {
    var sel = $("keysel");
    if (!sel.options.length) return;
    sel.selectedIndex = (sel.selectedIndex + dir + sel.options.length) % sel.options.length;
    applyTranspose(+sel.value);
  }
  $("keydown").addEventListener("click", function () { keyStep(-1); });
  $("keyup").addEventListener("click", function () { keyStep(1); });
  $("tempo").addEventListener("input", function () { $("bpm").textContent = this.value + " bpm"; });
  $("tempo").addEventListener("change", function () { applyTempo(+this.value); });
  $("keysel").addEventListener("change", function () { applyTranspose(+this.value); });

  /* ================= modals ================= */
  function openDir() { $("dirmodal").hidden = false; $("dirclose").focus(); }
  function closeDir() { $("dirmodal").hidden = true; $("browse").focus(); }
  $("browse").addEventListener("click", openDir);
  $("dirclose").addEventListener("click", closeDir);
  $("dirmodal").addEventListener("click", function (e) { if (e.target === this) closeDir(); });

  function openSpec() { $("modal").hidden = false; $("specclose").focus(); }
  function closeSpec() { $("modal").hidden = true; $("specbtn").focus(); }
  $("specbtn").addEventListener("click", openSpec);
  $("specclose").addEventListener("click", closeSpec);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeSpec(); });

  addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("modal").hidden) { e.preventDefault(); closeSpec(); }
      else if (!$("dirmodal").hidden) { e.preventDefault(); closeDir(); }
      return;
    }
    if (!$("modal").hidden || !$("dirmodal").hidden) return;
    var tag = e.target.tagName;
    if (/^(INPUT|TEXTAREA|BUTTON|A|SELECT)$/.test(tag)) return;
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); select(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); select(idx - 1); }
  });

  /* ================= theme ================= */
  // 'auto' leaves the root unstamped so prefers-color-scheme decides; the explicit
  // values stamp data-theme, which every colour token already keys off.
  function applyTheme(v) {
    var root = document.documentElement;
    if (v === "light" || v === "dark") root.setAttribute("data-theme", v);
    else root.removeAttribute("data-theme");
    try { localStorage.setItem("theme", v); } catch (e) {}
  }
  var startTheme = "auto";
  try { startTheme = localStorage.getItem("theme") || "auto"; } catch (e) {}
  var themeRadios = document.querySelectorAll('.seg input[name="theme"]');
  for (var ti = 0; ti < themeRadios.length; ti++) {
    themeRadios[ti].checked = themeRadios[ti].value === startTheme;
    themeRadios[ti].addEventListener("change", function () {
      if (this.checked) applyTheme(this.value);
    });
  }
  applyTheme(startTheme);

  /* ================= boot ================= */
  var startC = COLLECTIONS.length ? COLLECTIONS[0].id : null;
  try {
    var lc = localStorage.getItem("lastCollection");
    for (var i = 0; i < COLLECTIONS.length; i++) if (COLLECTIONS[i].id === lc) startC = lc;
  } catch (e) {}
  if (startC) {
    selectCollection(startC);
    try {
      var ls = localStorage.getItem("lastSong");
      for (var j = 0; j < flat.length; j++) {
        if (coll.id + "/" + flat[j].song.slug === ls) { select(j); break; }
      }
    } catch (e) {}
  }

  window.__p = {
    bar: function () { return curBar; },
    bpm: function () { return targetBpm; },
    ready: function () { return ready; },
    song: function () { return song && song.slug; },
    collection: function () { return coll && coll.id; },
    setId: function () { return set && set.id; },
    index: function () { return idx; },
    count: function () { return flat.length; },
    transpose: function () { return transpose; },
    synthId: function () { return synth ? (synth.__id || (synth.__id = ++idc)) : null; },
    primedIsCurrent: function () {
      try { return synth.visualObj === visualObj[0]; } catch (e) { return null; }
    },
    playheadX: function () { return playhead ? +playhead.getAttribute("x1") : null; },
    theme: function () { return document.documentElement.getAttribute('data-theme') || 'auto'; },
    keySig: function () {
      try { return visualObj[0].getKeySignature().accidentals.length; } catch (e) { return null; }
    }
  };
})();
</script>
</body>
</html>
