<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Lead Sheets</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E7EAE5; --surface:#F3F5F1; --paper:#FCFBF7; --paper-edge:#DCDFD7;
  --ink:#16201E; --ink-2:#55635E; --ink-3:#8A968F;
  --line:#C9D0C8; --accent:#2C6E67; --accent-soft:rgba(44,110,103,.13);
  --accent-on:#FCFBF7; --cursor:#9333EA; --radius:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
    --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
    --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
    --accent-on:#0D1312; --cursor:#C77DFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
  --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
  --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
  --accent-on:#0D1312; --cursor:#C77DFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:980px; margin:0 auto; padding-inline:16px; padding-block:32px 64px}

/* ---------- masthead ---------- */
.masthead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:16px}
h1{font-family:"Bodoni Moda",Didot,"Times New Roman",serif; font-weight:400;
  font-size:clamp(30px,5.5vw,46px); line-height:1; margin:0}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; margin-left:auto}
.ctl.theme{font-size:12px; color:var(--ink-3); gap:8px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; background:var(--bg)}
.seg input{position:absolute; opacity:0; width:0; height:0; pointer-events:none}
.seg label{padding:6px 11px; font-size:12px; font-weight:500; cursor:pointer; color:var(--ink-2);
  border-right:1px solid var(--line); line-height:1.2; user-select:none; white-space:nowrap}
.seg label:last-child{border-right:0}
.seg label:hover{color:var(--accent)}
.seg input:checked + label{background:var(--accent); color:var(--accent-on)}
.seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:-2px}

button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
.btn{border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:border-color .15s,color .15s; text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{border-color:var(--line); color:inherit}
.btn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.btn.ghost{padding:6px 11px; font-size:12.5px}
select{font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px; cursor:pointer}
select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- song picker ---------- */
.picker{display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap}
.picker .nav{min-width:66px; font-size:20px; line-height:1; padding:10px 22px; font-weight:600}
#songsel{flex:1 1 320px; min-width:0; font-size:15px; padding:9px 10px; font-weight:500}
.where{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.04em; white-space:nowrap}

/* ---------- transport ---------- */
.transport{position:sticky; top:0; z-index:20; margin-top:14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px; display:flex; flex-direction:column; gap:11px}
.row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.play{min-width:104px; display:inline-flex; align-items:center; justify-content:center;
  gap:8px; background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.play:hover{color:var(--accent-on); filter:brightness(1.08)}
.play:disabled{filter:none}
.play .glyph{font-size:11px; line-height:1}
a.dl{color:var(--ink)} a.dl:hover{color:var(--accent)}
a.dl .arrow{color:var(--accent); font-weight:600}
.ctl{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.ctl input[type=range]{accent-color:var(--accent); width:118px}
.keygrp{gap:5px}
.keygrp select{min-width:104px; text-align:center}
.btn.step{padding:8px 14px; font-size:17px; line-height:1; font-weight:700; min-width:40px}
.ctl output{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; min-width:50px}
.barrow{display:flex; align-items:center; gap:12px}
.barrow .bar-strip{flex:1 1 auto; min-width:0}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto}
.readout b{color:var(--ink); font-weight:500}

/* ---------- scrub ---------- */
.bar-strip{position:relative; height:28px; cursor:pointer; touch-action:none; user-select:none}
.bar-strip.dragging{cursor:grabbing}
#track{position:absolute; inset:0; background:var(--bg); border-radius:2px; overflow:hidden}
#fill{position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--accent); opacity:.16; pointer-events:none}
.tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}
.tick.period{background:var(--ink-3); opacity:.5}
#head{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); pointer-events:none}
#head::after{content:""; position:absolute; left:-4px; right:-4px; top:-2px; height:6px;
  background:var(--ink); border-radius:1px}
.bar-strip:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- score ---------- */
.sheet{margin-top:20px; background:var(--paper); border:1px solid var(--paper-edge);
  border-radius:var(--radius); padding:22px 16px 28px}
#paper{color:var(--ink)}
#paper svg{max-width:100%; height:auto; display:block}
#paper svg path{fill:currentColor}
#paper svg text,#paper svg tspan{fill:currentColor}
#paper .abcjs-highlight,#paper .abcjs-highlight path,#paper .abcjs-highlight text{
  fill:var(--cursor) !important}
/* the playhead is an SVG line INSIDE the score, so it shares the score's
   coordinate system and stays put when the responsive SVG rescales */
#paper svg .playhead{stroke:var(--cursor); stroke-width:2.2; opacity:.92;
  stroke-linecap:round; pointer-events:none}
.empty{color:var(--ink-3); font-size:13px; font-style:italic; padding:44px 0; text-align:center}
#audiohost{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

/* ---------- modals ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-family:"Bodoni Moda",Didot,serif; font-weight:400; font-size:22px}
.modal-head .btn{margin-left:auto}
#spectext{margin:0; padding:18px 20px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  color:var(--ink-2); tab-size:2}
.dirlist{margin:0; padding:14px; overflow:auto; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.dircard{text-align:left; background:var(--bg); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px 15px; cursor:pointer; display:flex;
  flex-direction:column; gap:5px; transition:border-color .15s,background .15s}
.dircard:hover{border-color:var(--accent)}
.dircard[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.dircard .dt{font-weight:600; font-size:16px}
.dircard .dn{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3)}
.dircard .db{font-size:13px; color:var(--ink-2); line-height:1.45}

@media (max-width:620px){
  .readout{margin-left:0; width:100%}
  .ctl input[type=range]{width:96px}
}
/* Portrait tablet: the transport wraps to two or three rows, so give the rows
   room and let the song picker own a full line of its own. */
@media (max-width:980px){
  .wrap{padding-block:22px 56px}
  h1{font-size:26px}
  .masthead{gap:10px; flex-wrap:nowrap; align-items:center}
  .masthead h1{flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .count{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
         flex:0 1 auto; min-width:0}
  .ctl.theme{flex:0 0 auto}
  .ctl.theme > span{display:none}
  .picker{gap:8px; flex-wrap:nowrap}
  .picker .nav{flex:0 0 auto; min-width:84px; padding:11px 16px}
  #songsel{flex:1 1 auto; min-width:0}
  .where{flex:0 0 auto}
  .row{flex-wrap:nowrap; gap:8px}
  .play{min-width:86px}
  .keygrp{flex:0 0 auto}
  .keygrp > span{display:none}
  .keygrp select{min-width:76px}
  .ctl.tempo > span{display:none}
  .ctl input[type=range]{width:92px}
  .ctl output{min-width:46px; font-size:12px}
  #pdf{flex:0 0 auto}
}
/* Anything driven by a finger gets a 44px-ish target. */
@media (pointer:coarse){
  .btn{padding:11px 16px; font-size:14px}
  .btn.ghost{padding:10px 14px; font-size:13px}
  select{padding:11px 10px; font-size:14px}
  .ctl.theme select{padding:8px 8px; font-size:13px}
  .picker .nav{padding:14px 24px; font-size:22px}
  .bar-strip{height:38px}
  .ctl input[type=range]{height:28px}
  .dircard{padding:16px 17px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important; transition:none !important}}
@media print{
  .masthead,.picker,.transport,.modal{display:none}
  body{background:#fff} .sheet{border:none; background:#fff; margin:0; padding:0}
  #paper svg .playhead{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Piano Lead Sheets</h1>
    <button class="btn ghost" id="browse" type="button">&#9776;&nbsp; Browse</button>
    <button class="btn ghost" id="specbtn" type="button">View spec</button>
    <span class="count" id="count"></span>
    <div class="ctl theme">
      <span>Theme</span>
      <div class="seg" role="radiogroup" aria-label="Theme">
        <input type="radio" name="theme" id="th-auto" value="auto">
        <label for="th-auto">Auto</label>
        <input type="radio" name="theme" id="th-light" value="light">
        <label for="th-light">Day</label>
        <input type="radio" name="theme" id="th-dark" value="dark">
        <label for="th-dark">Dark</label>
      </div>
    </div>
  </header>

  <div class="picker">
    <button class="btn nav" id="prev" type="button" aria-label="Previous song">&#8249;</button>
    <select id="songsel" aria-label="Choose a song"></select>
    <button class="btn nav" id="next" type="button" aria-label="Next song">&#8250;</button>
    <span class="where" id="where"></span>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <span class="ctl keygrp"><span>Key</span>
        <button class="btn step" id="keydown" type="button" aria-label="Down a semitone">&#9662;</button>
        <select id="keysel" aria-label="Key"></select>
        <button class="btn step" id="keyup" type="button" aria-label="Up a semitone">&#9652;</button>
      </span>
      <label class="ctl tempo" for="tempo"><span>Tempo</span>
        <input type="range" id="tempo" min="40" max="225" step="1" value="100">
        <output id="bpm" for="tempo">100 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
    </div>
    <div class="barrow">
      <div class="bar-strip" id="strip" role="slider" tabindex="0"
           aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="32" aria-valuenow="1">
        <div id="track"></div>
        <div id="fill"></div>
        <div id="head"></div>
      </div>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">32</b></span>
    </div>
  </div>

  <div class="sheet">
    <div id="paper"><p class="empty">Loading&hellip;</p></div>
  </div>
</div>

<div class="modal" id="dirmodal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dirtitle">
    <div class="modal-head">
      <h2 id="dirtitle">Browse collections</h2>
      <button class="btn" id="dirclose" type="button">Close</button>
    </div>
    <div class="dirlist" id="dirlist"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="spectitle">
    <div class="modal-head">
      <h2 id="spectitle">Spec</h2>
      <button class="btn" id="specclose" type="button">Close</button>
    </div>
    <pre id="spectext"></pre>
  </div>
</div>

<div id="audiohost"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script>
(function () {
  "use strict";
  var COLLECTIONS = [
  {
    "id": "folk-songs",
    "title": "Folk Songs",
    "blurb": "Traditional and early-popular melodies that are in the public domain, arranged as beginner-intermediate lead sheets. Written in C or A minor; use the Key control to transpose any of them.",
    "order": 1,
    "sets": [
      {
        "id": "folk-songs",
        "label": "Public-domain traditional melodies",
        "spec": "# Arranging spec — Classics\n\nThis collection is **not** original composition. Each song here is an existing, well-known\nmelody that is in the **public domain**, arranged as a beginner–intermediate lead sheet:\na single-line melody in the treble clef with chord symbols above it. No left-hand part.\n\nYour job is to transcribe a tune faithfully, not to invent one.\n\n---\n\n## 1. The job\n\nYou are given **one song title**. Write the melody as you know it, in the **key of C** (or A\nminor for minor-key tunes), with simple chord symbols underneath.\n\nTwo things matter more than anything else:\n\n1. **The melody must be recognisable.** Someone who knows the song should be able to hum along\n   from bar one. Get the tune right — the rhythm of it as much as the pitches. If you are\n   unsure of a passage, choose the most commonly sung version rather than an ornate one.\n2. **Keep it playable.** This is for a beginner–intermediate pianist. Do not add ornaments,\n   grace notes or runs that are not in the tune.\n\nWrite **only the main strain** — typically one verse, or a verse plus its chorus. 16 to 40 bars\nis the normal range. Do not write out repeats; write the tune once through.\n\n## 2. The file\n\nWrite exactly one file to the path you are given, `collections/classics/songs/<slug>.json`:\n\n```json\n{\n  \"title\": \"Oh! Susanna\",\n  \"source\": \"Stephen Foster, 1848 — public domain\",\n  \"key\": \"C\",\n  \"meter\": \"4/4\",\n  \"pickup\": 4,\n  \"tempo\": 116,\n  \"bars\": [\n    { \"chord\": \"C\", \"notes\": \"C5:2 D5:2\" },\n    { \"chord\": \"C\", \"notes\": \"E5:4 G5:4 G5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — the song's usual title, spelled normally.\n- `source` — composer/date if known, otherwise \"Traditional\", **and the words \"public domain\"**.\n- `key` — `C` for major tunes, `Am` for minor ones. Nothing else.\n- `meter` — one of `4/4`, `3/4`, `2/4`, `6/8`. Use the meter the tune is normally written in.\n- `pickup` — **omit it** if the tune starts on beat 1. If the tune starts with an upbeat, set\n  this to the length of that upbeat in sixteenth units, and make bar 1 exactly that long.\n- `tempo` — a sensible performance tempo in beats per minute.\n- `bars` — the tune, one object per bar.\n\n## 3. The note language\n\n**Durations are counted in sixteenth notes.** A full bar is 16 units in 4/4, 12 in 3/4 or 6/8,\nand 8 in 2/4.\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C, so `C5` sits in the treble staff),\n`F#5:2`, `Bb4:8`, `R:4` for a rest, `[G7]D5:4` to change chord mid-bar.\n\n**There is no tie syntax.** A note cannot be held across a barline. Where a tune holds a note\nacross a bar line, write the note as long as the bar allows and let the next bar begin the next\nnote — or, better, choose the phrasing that keeps each bar self-contained.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Every bar's durations sum to exactly the bar length** for your meter (16 / 12 / 8).\n   The pickup bar, if you declare one, sums to exactly the `pickup` value. This is the most\n   common mistake — add each bar up.\n2. Bars *may* begin with a rest where the tune genuinely rests there. Prefer a struck downbeat,\n   but never invent a note — or a pickup the tune has not got — just to avoid one.\n3. **Range `G4` to `C6`.** If the tune as you know it goes outside that, move the offending\n   phrase by an octave, or pick the octave that keeps the whole tune inside the window.\n4. **End where the song ends.** A tonic close held at least a half note is the usual and\n   preferred ending, but it is not forced: if the tune genuinely closes elsewhere, write that.\n   Do not manufacture a held tonic the song has not got. The validator prints a NOTE rather than\n   an error when the close is unusual — read it and check you have not stopped mid-phrase.\n5. Chord suffixes allowed: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`,\n   `6`, `m6`. A slash bass is allowed: `G/B`.\n\n## 5. Harmony\n\nKeep it simple and traditional — the harmony a folk guitarist or a parlour pianist would use.\n\n- In **C**: mostly `C`, `F`, `G` and `G7`, with `Am`, `Dm` and `Em` where the tune asks for them.\n- In **Am**: mostly `Am`, `Dm`, `E7` and `G`, with `C` and `F`.\n- One chord per bar is the norm. Two is fine where the tune clearly changes mid-bar — use the\n  `[Chord]` marker for the second one.\n- A `G7` before the final `C` is almost always right.\n- Do not add jazz reharmonisation. These are folk tunes; plain triads and the odd seventh.\n\n## 6. Check your work — required\n\n```bash\npython src/validate.py collections/classics/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen read your own file back and check the melody by singing it in your head against the tune\nyou know. Ask specifically:\n\n- does bar 1 start where the tune starts (upbeat or downbeat)?\n- is the rhythm of the opening phrase right, including any dotted notes?\n- does each phrase end where it should, on the note it should?\n- would someone recognise it?\n\nA file that passes the validator but does not sound like the song has failed the task.\n\n## 7. Public domain\n\nOnly arrange the melody you were asked for, and only because it is old enough to be in the\npublic domain. Do not substitute a modern song, and do not copy any particular modern\npublisher's arrangement — write the traditional tune as it is commonly sung.\n",
        "songs": [
          {
            "slug": "amazing-grace",
            "title": "Amazing Grace",
            "key": "C",
            "meter": "3/4",
            "tempo": 80,
            "bars": 16,
            "source": "Traditional — tune \"New Britain\", 1835; words John Newton — public domain",
            "pdf": "songs/folk-songs/amazing-grace.pdf",
            "abc": "X:1\nM:3/4\nL:1/16\nQ:1/4=80\nK:C clef=treble\n\"C\"G4 | \"C\"c8 e2c2 | \"C\"e8 d4 | \"F\"c8 A4 |\n\"C\"G8 G4 | \"C\"c8 e2c2 | \"Am\"e8 d2e2 | \"C\"g12 |\n\"C\"g8 e2g2 | \"C\"g8 e2c2 | \"Am\"e8 e2d2 | \"F\"c8 A4 |\n\"C\"G8 G4 | \"C\"c8 e2c2 | \"C\"e8 \"G7\"d4 | \"C\"Hc12 |]\n"
          },
          {
            "slug": "auld-lang-syne",
            "title": "Auld Lang Syne",
            "key": "C",
            "meter": "4/4",
            "tempo": 92,
            "bars": 17,

 No. 9, fourth movement\").\n- `source` — composer, work and date, **plus the words \"public domain\"**. This string is printed\n  as the credit line on the engraved score, so make it accurate and presentable.\n- `key` — `C` for major themes, `Am` for minor ones. Nothing else; the player transposes.\n- `meter` — one of `4/4`, `3/4`, `2/4`, `6/8`. Use the meter the piece is written in.\n- `pickup` — **omit** if the theme starts on beat 1. Otherwise set it to the upbeat's length in\n  sixteenth units, and make bar 1 exactly that long.\n- `tempo` — a sensible performance tempo in BPM (50–220).\n- `bars` — the theme, one object per bar.\n\n## 3. The note language\n\n**Durations are counted in sixteenth notes.** A full bar is 16 units in 4/4, 12 in 3/4 and 6/8,\nand 8 in 2/4.\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C, so `C5` sits in the treble staff),\n`F#5:2`, `Bb4:8`, `R:4` for a rest, `[G7]D5:4` to change chord mid-bar.\n\n**There is no tie syntax.** A note cannot be held across a barline. Where the theme sustains\nacross a bar line, write the note as long as the bar allows and begin the next bar afresh.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Every bar's durations sum to exactly the bar length** for your meter (16 / 12 / 8). The\n   pickup bar, if declared, sums to exactly the `pickup` value. This is the most common mistake.\n2. Bars *may* begin with a rest where the theme genuinely rests there. Prefer a struck\n   downbeat, but do not invent a note, or a pickup the theme has not got, to avoid one.\n3. **Range `G4` to `C6`.** Move a phrase by an octave, or choose the octave that fits the whole\n   theme. If the theme genuinely cannot fit in either octave, adjust the smallest number of\n   notes you can and say so in your report.\n4. **End where the theme ends.** A tonic close held at least a half note is the usual and\n   preferred ending, but it is no longer forced: if the theme genuinely closes on the third, on\n   the dominant, or on a short note, write that. Do not manufacture a held tonic the music has\n   not got. The validator will print a NOTE, not an error, when the close is unusual — read it\n   and make sure you have not simply stopped mid-phrase.\n5. Chord suffixes allowed: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`,\n   `6`, `m6`. A slash bass is allowed: `G/B`.\n\n## 5. Harmony\n\nClassical harmony is richer than folk harmony, and you should reflect that — but keep it to one\nchord per bar where you can.\n\n- In **C**: `C`, `F`, `G`, `G7`, `Am`, `Dm`, `Em`, plus `D7` and `E7` as secondary dominants and\n  the occasional `dim` passing chord where the original clearly modulates.\n- In **Am**: `Am`, `Dm`, `E7`, `G`, `C`, `F`, `Bm7b5`.\n- Use `[Chord]` for a genuine mid-bar change — common in classical phrases.\n- A `G7 → C` (or `E7 → Am`) at the close is almost always right.\n- Follow the original's harmony where you can hear it. Do not reharmonise.\n\n## 6. Check your work — required\n\n```bash\npython src/validate.py collections/classical/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen read your file back and sing it against the piece you know:\n\n- does bar 1 start where the theme starts (upbeat or downbeat)?\n- is the rhythm of the opening right, including dotted figures?\n- have you accidentally written the accompaniment instead of the tune?\n- would someone name the piece from the first two bars?\n\nA file that passes the validator but is not recognisably the piece has failed the task.\n\n## 7. Method\n\nDo not work from memory alon         "label": "Public-domain ragtime, blues and early jazz",
        "spec": "# Arranging spec — Ragtime & Blues\n\nThis collection is **not** original composition. Each entry is a real ragtime, early blues or\nNew Orleans jazz number that is in the **public domain**, arranged as a beginner–intermediate\nlead sheet: a single-line melody in the treble clef with chord symbols above it. No left-hand\npart, no stride bass, no inner voices.\n\nYour job is to write the tune a listener would whistle, with the harmony underneath it.\n\n---\n\n## 1. The job\n\nYou are given **one title**. Write its melody as a single line, in the **key of C** (or\n**A minor** for minor-key numbers), with chord symbols.\n\nThree things matter, in this order:\n\n1. **It must be recognisable.** Someone who knows the piece should identify it within two bars.\n2. **It must be the melody, not the piano part.** A rag is a two-handed piano piece; the tune is\n   the right hand's top line. Where the right hand plays chords, take the top note. Where it\n   breaks into octaves, take one. The left-hand stride becomes a chord symbol, never notes.\n3. **It must be playable at this level.** Keep the syncopation — that is the whole point of the\n   style — but no written-out octaves, no tremolos, no cascading runs. If the original has a\n   four-octave break, write the shape underneath it.\n\n## 2. Length — write the whole piece\n\n**There is no bar limit, and no soft cap.** Earlier collections here stopped at a single strain;\nthis one should not. If the piece has more to it, write more.\n\nA rag is a multi-strain form, usually `A A B B A C C D D` with a four-bar intro and a key change\ninto the C strain (the \"trio\"). Write **every distinct strain, once each, in the order the piece\nplays them, including the return to A** where the form returns to it. So that example becomes\n`A B A C D` — typically 64 to 100 bars. Do not write literal repeats; one pass of each strain is\nenough, and `A B A C D` already gives the listener the whole shape.\n\nFor a blues, write the **complete song**, not one 12-bar chorus: Handy's blues have several\ndistinct strains (`St. Louis Blues` has a 12-bar strain, a 16-bar habanera strain in the minor,\nand a third strain), and a traditional blues usually wants two or three choruses' worth of\nmelodic variation rather than the same twelve bars repeated.\n\nIf the trio modulates in the original (rags almost always go to the subdominant), **stay in C** —\ndo not change key signature — and reflect the modulation in the chord symbols instead. Write\nthe strain's real intervals against C.\n\n## 3. The file\n\nWrite exactly one file to the path you are given, `collections/ragtime/songs/<slug>.json`:\n\n```json\n{\n  \"title\": \"The Entertainer\",\n  \"source\": \"Scott Joplin, 1902 - public domain\",\n  \"key\": \"C\",\n  \"meter\": \"4/4\",\n  \"tempo\": 88,\n  \"bars\": [\n    { \"chord\": \"C\", \"notes\": \"E5:2 C#5:2 D5:2 E5:2 C5:4 R:4\" }\n  ]\n}\n```\n\n- `title` — the name people know it by.\n- `source` — composer and date where known, otherwise \"Traditional\", **plus the words\n  \"public domain\"**. This string is printed as the credit line on the engraved score, so make it\n  accurate and presentable.\n- `key` — `C` for major numbers, `Am` for minor ones. Nothing else; the player transposes.\n- `meter` — usually `4/4` for a rag or blues, `2/4` for a march-tempo rag, `3/4` for a ragtime\n  waltz. Use what the piece is written in.\n- `pickup` — **omit** if the tune starts on beat 1. Otherwise set it to the upbeat's length in\n  sixteenth units, and make bar 1 exactly that long.\n- `tempo` — a sensible performance tempo (50–220). Rags are marched, not raced: Joplin wrote\n  \"Not fast\" on most of them. 76–96 suits nearly all of these.\n- `bars` — the arrangement, one object per bar.\n\n## 4. The note language\n\n**Durations are counted in sixteenth notes.** A full bar is 16 units in 4/4, 12 in 3/4 and 6/8,\nand 8 in 2/4.\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C, so `C5` sits in the treble staff),\n`F#5:2`, `Bb4:8`, `R:4` for a rest, `[G7]D5:4` to change chord mid-bar.\n\n**There is no tie syntax.** A note cannot be held across a barline. Where the tune sustains\nacross a bar line, write the note as long as the bar allows and begin the next bar afresh.\n\n### House notation — read this before you write a bar\n\nJoplin and his contemporaries notated rags in **2/4 with sixteenth notes** as the running value.\n**Do not copy that literally.** This collection writes rags in **4/4 with the EIGHTH note as the\nrunning value** — one written 4/4 bar per one original 2/4 bar, note values doubled. A sixteenth\nin the first edition becomes an eighth here.\n\nThat convention is what the rest of the collection uses, and there are two reasons for it:\n\n- **Readability.** A bar of fourteen sixteenth notes is not a beginner–intermediate lead sheet,\n  whatever the first edition looks like.\n- **Tempo.** The player reads `tempo` as quarter-notes per minute. Halving the note values makes\n  the piece play at double speed against every other song on the site.\n\nSo a full `A B A C D` at 16 bars a strain comes to **about 80 written bars**, and a typical bar\nlooks like `E5:2 C6:4 E5:2 C6:4 E5:2 C6:2` — not `A5:1 G5:2 F5:1 E5:1 Eb5:1 E5:1 D5:1 C5:1 ...`.\nUse sixteenths (`1`) only for genuine ornamental runs, never as the default pulse.\n\n### Writing ragtime syncopation\n\nThe characteristic rag figure is a three-note cell across the beat — `2 4 2` (eighth, quarter,\neighth) — and its cousin `1 2 1`. Those, plus the `3 1` dotted snap, are what make this music\nsound like itself. Use them freely; they are the reason this collection exists. The one thing you\nmust not do is run a note past a barline — there is no tie syntax.\n\n## 5. Hard rules — the validator rejects these\n\n1. **Every bar's durations sum to exactly the bar length** for your meter (16 / 12 / 8). The\n   pickup bar, if declared, sums to exactly the `pickup` value. This is the most common mistake.\n2. Bars *may* begin with a rest where the piece genuinely rests there — common in a blues\n   response phrase. Prefer a struck downbeat, but never invent a note, or a pickup the piece\n   has not got, just to avoid one.\n3. **Range `G4` to `C6`.** Move a phrase by an octave, or choose the octave that fits the whole\n   tune. Rags range widely; if a strain genuinely will not fit, move that whole strain by an\n   octave rather than bending individual notes, and say so in your report.\n4. **The piece ends on the tonic `C5`** (or `A5`/`A4` in A minor) — **or on the root of the\n   closing chord**, held at least a half note. That second option exists for this collection\n   specifically: most rags modulate to the subdominant for the trio and **end there**, so a rag\n   whose last strain is in F should end on `F5` under an `F` chord. Write the ending the piece\n   actually has. Do not drag a trio-key ending back to C — it sounds unresolved and wrong.\n5. Chord suffixes allowed: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`,\n   `6`, `m6`. A slash bass is allowed: `G/B`.\n\n## 6. Harmony\n\nThis music's harmony is richer than folk harmony and you should reflect it.\n\n- Ragtime runs on **secondary dominants** round the circle: `E7 → A7 → D7 → G7 → C`. That chain\n  is the sound of the style; write it where the original has it.\n- **Diminished passing chords** are everywhere in rags — `C#dim`, `D#dim` between diatonic\n  chords. Use `dim`.\n- A **blues** wants dominant sevenths on I, IV and V: in C that is `C7`, `F7`, `G7`, with a\n  `quick IV` in bar 2 and often a `Dm7 G7` turnaround in bars 11–12.\n- Handy's blues use the **habanera / tango** bass and often a minor strain — `Cm` is not\n  available in the key of C, so write such a strain in the relative area with the chord symbols\n  the harmony actually needs (`Am`, `E7`, `Dm`).\n- Use `[Chord]` for a genuine mid-bar change. Rags change chord every two beats often enough.\n- Follow the original's harmony where you can hear it. Do not reharmonise.\n\n## 7. Check your work — required\n\n```bash\npython src/validate.py collections/ragtime/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen read your file back and play it against the piece you know:\n\n- does bar 1 start where the tune starts (upbeat or downbeat)?\n- is the syncopation right, or have you flattened it into straight eighths?\n- have you accidentally written the stride bass or the chord voicing instead of the tune?\n- have you included **every strain**, or stopped after the famous one?\n- would someone name the piece from the first two bars?\n\nA file that passes the validator but is not recognisably the piece has failed the task.\n\n## 8. Method\n\nDo not work from memory alone. Cross-check against published public-domain sources — IMSLP has\nscans of nearly every Joplin and Handy first edition, and there are LilyPond and ABC\ntranscriptions of the well-known rags on Mutopia and abcnotation.com. Transpose into C or A\nminor afterwards. Do not spend forever on sourcing; two or three lookups, then write.\n\n## 9. Public domain\n\nEverything in this collection must be **published in 1930 or earlier**, which is the current US\npublic-domain cutoff — copyright runs 95 years from publication, and the line rolls forward\nevery January. Composers of this era (Joplin d. 1917, Handy d. 1958 but all the relevant works\nare pre-1930) are fine. Record the attribution in `source`.\n\n## 10. One thing to avoid\n\nA great deal of popular music from 1890–1920 comes out of blackface minstrelsy, and some of it\ncarries slurs in the title or lyrics. **Do not arrange minstrel-show material**, and if a piece\nyou are given turns out to have an offensive alternate title, use the neutral one and say so in\nyour report. The titles in this collection have been chosen to avoid the problem; you should not\nrun into it, but do not go looking for extra material on your own.\n",

        "spec": "# Songwriting spec v6 — 32-bar AABA, jaunty animated-musical style\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What this set is\n\nv6 returns to the **v3 structure** — 32-bar AABA with a cadence that rotates every eight bars —\nand changes the *style*. There is no swing here: you write exactly the rhythms you mean, and\nthey are printed and played exactly as written.\n\nThe sound to aim at is the **jaunty production number from a golden-age animated musical**:\nbright, bouncing, grinning, the kind of tune a character sings while striding down a road or\nsweeping a floor. Cheerful and busy, with a bounce in the rhythm and a wink in the harmony.\n\nThree things make that style, and all three are unusual compared with the earlier sets:\n\n1. **A dotted bounce.** The signature rhythm is the dotted-eighth-plus-sixteenth snap —\n   written `3 1`. It is springy where a plain pair of eighths is flat. Your head figure\n   contains one; use it as the character of the tune.\n2. **Leaps, not just steps.** Earlier sets asked for stepwise melodies. This one wants\n   confidence: rising sixths, octaves, and openings that spell out the chord. Up to **45%** of\n   your intervals may be larger than a major third — roughly half again what the other sets\n   allow. Take the room.\n3. **Sweetened harmony.** Added sixths, secondary dominants and chromatic passing chords.\n   This is what separates the style from a folk tune. See §10.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: key, tempo, character, a **head figure**, a\n**syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v6/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C6\",  \"notes\": \"C5:3 E5:1 G5:4 E5:4 G5:4\" },\n    { \"chord\": \"A7\",  \"notes\": \"A5:4 G5:3 F#5:1 E5:4 C#5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C), `F#5:2`, `Bb4:8`, `R:4` for a rest,\n`[Am]E5:4` to change chord mid-bar. **There is no tie syntax**: a note may not cross a barline.\n\n`3 1` is the dotted snap, and in this set you write it yourself — nothing is transformed at\nbuild time.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.**\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb.\n6. Chord suffixes: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. Head figures — the bounce\n\nEach contains at least one dotted snap. Use yours on the moving bars of A, A′ and A″.\n\n| id | rhythm | where the snap falls |\n|----|--------|----------------------|\n| J1 | `3 1 4 4 4`       | beat 1 |\n| J2 | `4 3 1 4 4`       | beat 2 |\n| J3 | `3 1 3 1 4 4`     | beats 1 and 2 |\n| J4 | `4 4 3 1 4`       | beat 3 |\n| J5 | `2 2 4 3 1 4`     | beat 3, after an eighth pair |\n| J6 | `3 1 2 2 4 4`     | beat 1, into an eighth pair |\n| J7 | `2 2 2 2 3 1 4`   | beat 3, after running eighths |\n| J8 | `3 1 4 2 2 4`     | beat 1, eighth pair on beat 3 |\n\n## 6. Syncopation figures — the charleston\n\nEach throws a long note onto an off-beat. Use yours across B and at least 3 other bars.\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| K1 | `6 2 6 2`     | | K5 | `4 2 2 6 2` |\n| K2 | `4 6 2 4`     | | K6 | `6 2 4 2 2` |\n| K3 | `6 6 4`       | | K7 | `2 2 6 2 4` |\n| K4 | `2 6 2 6`     | | K8 | `6 2 2 2 4` |\n\n## 7. Landing figures — one per 8-bar section\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\n\n| id | rhythm  | | id | rhythm    | | id | rhythm |\n|----|---------|-|----|-----------|-|----|--------|\n| LA | `4 4 8` | | LD | `6 2 8`   | | LH | `8 8`  |\n| LB | `8 4 4` | | LE | `2 2 4 8` | | LJ | `4 8 4` |\n| LC | `4 12`  | | LF | `12 4`    | | LG | `2 2 12` |\n\nKeep the rhythm exactly; the pitches are yours, and the two landings in a section should differ\n— the first more open, the second more conclusive.\n\n## 8. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune on your head figure. **Ends OPEN** — bar 8 on the dominant, a non-tonic note. |\n| 9–16  | **A′**  | The tune varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge: new harmony, your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each section: bars 1–3 move (head figure, the shape sequencing by step), bar 4 lands,\nbars 5–7 move, bar 8 lands.\n\n## 9. Melody — write it to be sung with a grin\n\n- **Open with the chord.** Begin a phrase by outlining the chord — `C5 E5 G5`, or a rising\n  sixth `C5` up to `A5`. An arpeggio opening followed by a stepwise fall is the classic shape\n  of this style, and it is what the raised leap allowance is for.\n- **Answer a leap by stepping back** the other way. A leap up then a scale down is the whole\n  gesture; a leap up then another leap up is just noise.\n- **Repeated notes are good here.** Three or four of the same pitch in a row reads as patter —\n  the rhythm of words. This set lifts the \"never repeat a pitch more than twice\" rule: you may\n  repeat up to **four** times when the rhythm is doing the work.\n- **Land on chord tones** on beat 1, and usually beat 3. With sevenths and sixths in the\n  harmony you have more chord tones to land on — use the 6th and the 7th, they are the colour.\n- **One high point**, in B, reached once, and reach it by leap for maximum grin.\n- Keep the whole thing inside `G4`–`C6`.\n\n## 10. Harmony — this is where the style lives\n\nOne chord loop across A, A′ and A″; a different one for B. One chord per bar, though a\nmid-bar change with `[Chord]` is welcome at a cadence.\n\n**Use all three of these devices.** A song that only uses plain triads will not sound like this\nstyle no matter what the rhythm does.\n\n1. **Added sixths.** Use `C6`, `F6`, `G6` in place of plain major chords, especially on the\n   tonic at a landing. It is the period sound.\n2. **Secondary dominants.** A major 7th chord borrowed to lead into a diatonic chord:\n   in C, `D7` pulls to `G`, `A7` pulls to `Dm`, `E7` pulls to `Am`. Put the chromatic note in\n   the melody — `F#` over `D7`, `C#` over `A7`, `G#` over `E7`. Use at least **three** across\n   the song; a chain of them (`E7 – A7 – D7 – G7 – C`) is a fine way to build a bridge.\n3. **Diminished passing chords.** `dim` between two diatonic chords a step apart:\n   `C – C#dim – Dm`, or `F – F#dim – C/G`. One or two is plenty.\n\nDiatonic chords to build the loop from:\n\n| key | chords |\n|-----|--------|\n| **C**  | C, C6, Dm, Em, F, F6, G, G7, Am, Cmaj7, Dm7, Am7 |\n| **G**  | G, G6, Am, Bm, C, C6, D, D7, Em, Gmaj7, Am7, Em7 |\n| **D**  | D, D6, Em, F#m, G, G6, A, A7, Bm, Dmaj7, Em7, Bm7 |\n| **F**  | F, F6, Gm, Am, Bb, Bb6, C, C7, Dm, Fmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Bb6, Cm, Dm, Eb, Eb6, F, F7, Gm, Bbmaj7, Cm7, Gm7 |\n| **Am** | Am, Am6, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Em6, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Dm6, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nSecondary dominants available to you, by key:\n\n| key | use |\n|-----|-----|\n| **C**  | D7→G, A7→Dm, E7→Am, C7→F |\n| **G**  | A7→D, E7→Am, B7→Em, G7→C |\n| **D**  | E7→A, B7→Em, F#7→Bm, D7→G |\n| **F**  | G7→C, D7→Gm, A7→Dm, F7→Bb |\n| **Bb** | C7→F, G7→Cm, D7→Gm, Bb7→Eb |\n| **Am**, **Em**, **Dm** | the major dominant at each cadence (`E7`, `B7`, `A7`), plus `D7→G` in Am, `A7→D` in Em, `G7→C` in Dm |\n\nIn the minor keys the major dominant needs its raised leading tone in the melody — `G#` in Am,\n`D#` in Em, `C#` in Dm.\n\n**Key signatures:** D has F# and C#. Bb has Bb and Eb. F and Dm have Bb. G and Em have F#.\n\n## 11. Check your work — required\n\n```bash\npython src/validate.py v6/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen confirm by eye:\n\n- bars 4 and 8 share a figure; 12 and 16 a different one; 20 and 24 a third; 28 a fourth;\n- bars 8, 16 and 32 end differently (open / closed / final);\n- your head figure's dotted snap is audible throughout A, A′ and A″;\n- at least three secondary dominants, with their chromatic notes in the melody;\n- at least one added-sixth chord and one diminished passing chord.\n\n## 12. File-format reference\n\n`src/example-song.json` is a valid song — read it **for JSON syntax only**. It is a 40-bar v1\nsong in a plain diatonic style and is not a model for anything here.\n",

        "spec": "# Songwriting spec v4 — 32-bar AABA, running eighths over held landings\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What changed from v3 — read this first\n\nv3 was correct in shape but too *even* in texture: too many plain quarter notes, so the line\nwalked rather than flowed. v4 changes the texture, not the structure.\n\n| | v3 average per song | **v4 minimum per song** |\n|---|---|---|\n| eighth notes | 46 | **88** — roughly double |\n| half notes | 5 | **10** |\n| bars containing a run of 4+ eighths/sixteenths | 7 | **14** |\n\nThe validator checks all three and will tell you your actual numbers.\n\nThe sound you are aiming for is **long notes at the phrase endings, and flowing runs between\nthem.** A landing bar holds; the three bars before it move. Think of the held notes as the\nposts of a fence and the runs as the rails between them. Quarter notes are now the exception,\nnot the default — if you catch yourself writing `4 4 4 4`, that bar should probably be eighths.\n\nEverything else — AABA, the landing rotation, one bar per chord, bars opening on beat 1 — is\nunchanged from v3.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, a **head figure**,\na **syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v4/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:2 D5:2 E5:2 G5:2 A5:2 G5:2 E5:2 D5:2\" },\n    { \"chord\": \"G\",  \"notes\": \"D5:8 E5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.         "spec": "# Songwriting spec v3 — 32-bar AABA, rotating cadence\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nThe song must be **predictable and catchy** — a listener should be able to hum where the tune is\ngoing — while having real rhythmic life: eighths, sixteenths, and genuine syncopation.\n\n> ### What changed from v2, and why\n> **v1's problem:** every *song* ended every phrase the same way, and so did every other song.\n> **v2 fixed the cross-song half** by assigning each song its own landing figure.\n> **v2's remaining problem:** each song still used that one figure for all seven phrase endings,\n> so a single song got monotonous even though the set was varied.\n>\n> **v3 rotates the cadence.** You get **four** landing figures, one per 8-bar section. The two\n> phrase endings *inside* a section share a figure; each section uses a *different* one. So the\n> ear gets a pattern it can learn (8 bars) and then a fresh one.\n>\n> Tempos are also roughly double v2's — these are quicker pieces.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, a **head figure**,\na **syncopation figure**, and a **landing rotation** of four figures. Those are binding. Build\nthe whole piece out of them.\n\n## 2. The file\n\nWrite exactly one file: `v3/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:4 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"A5:4 G5:4 E5:2 D5:2 C5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given on your card: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or ` id the half-bar scale run — it becomes unplayable for the target pianist.\nBelow 150 you have more room.\n\n## 7. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune, plainly, built on your head figure. **Ends OPEN** — bar 8 lands on the dominant and a non-tonic note. |\n| 9–16  | **A′**  | The tune again, varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge. Different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns, decorated with sixteenth runs. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each 8-bar section: bars 1–3 move (head figure, pitches sequencing by step each bar),\nbar 4 lands, bars 5–7 move, bar 8 lands.\n\n## 8. Melody\n\n- **Step more than you leap.** Most intervals a second or a third; after a leap, step back.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step is the single most\n  effective device you have. Use it, and again in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n\n## 9. Harmony\n\nSet up a chord loop and reuse it across A, A′ and A″; give B a different one. One chord per bar.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **D**  | D, Em, F#m, G, A, Bm, A7, Dmaj7, Gmaj7, Em7, Bm7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Cm, Dm, Eb, F, Gm, F7, Bbmaj7, Ebmaj7, Cm7, Gm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm)         "spec": "# Songwriting spec v2 — 32-bar AABA piano lead sheets\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved\nsheet music (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nThe song must be **predictable and catchy** — a listener should be able to hum where the tune\nis going — while having real rhythmic life: eighths, sixteenths, and genuine syncopation.\n\n> ### What went wrong in v1, and what this version fixes\n> The v1 spec told every writer to use \"quarter, quarter, half\" as their landing figure. All six\n> songs came back ending every phrase identically and sounding like each other.\n>\n> **Predictability belongs inside one song, not across the set.** So v2 assigns you a\n> *rhythmic identity* — a specific head figure, landing figure, and syncopation figure.\n> Commit to yours and repeat it. Do not drift toward the generic.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, and three\nfigures — **head**, **landing**, **syncopation** — chosen from the menus in §5.\nThose three figures are your song's identity. Build the whole piece out of them.\n\n**Do not use a landing figure other than the one you were assigned.** In particular, if you\nwere not assigned `4 4 8`, do not use `4 4 8` anywhere as a phrase ending.\n\n## 2. The file\n\nWrite exactly one file: `v2/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 92,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:4 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"A5:4 G5:4 E5:2 D5:2 C5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given on your card: `C`, `G`, `F`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card   try { var _ut = localStorage.getItem('userTempo'); if (_ut) userTempo = +_ut; } catch (e) {}
  var loadToken = 0, idc = 0, lastTop = null, playhead = null;
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var strip = $("strip"), paper = $("paper");

  var PC = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6,
             G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };
  var MAJOR = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  var MINOR = ["Am","Bbm","Bm","Cm","C#m","Dm","Ebm","Em","Fm","F#m","Gm","G#m"];

  function tonicPc(key) { return PC[key.replace(/m$/, "")]; }
  function isMinor(key) { return /m$/.test(key); }

  /* ================= collections ================= */
  var dirlist = $("dirlist");
  COLLECTIONS.forEach(function (c) {
    var n = c.sets.reduce(function (a, s) { return a + s.songs.length; }, 0);
    var b = document.createElement("button");
    b.className = "dircard"; b.type = "button";
    b.innerHTML = '<span class="dt"></span><span class="dn"></span><span class="db"></span>';
    b.querySelector(".dt").textContent = c.title;
    b.querySelector(".dn").textContent =
      n + (n === 1 ? " song" : " songs") +
      (c.sets.length > 1 ? "  ·  " + c.sets.length + " sets" : "");
    b.querySelector(".db").textContent = c.blurb || "";
    b.addEventListener("click", function () { selectCollection(c.id); closeDir(); });
    b.dataset.cid = c.id;
    dirlist.appendChild(b);
  });

  function selectCollection(cid) {
    coll = COLLECTIONS.filter(function (c) { return c.id === cid; })[0] || COLLECTIONS[0];
    flat = [];
    coll.sets.forEach(function (s) {
      s.songs.forEach(function (sg) { flat.push({ song: sg, set: s }); });
    });
    var n = flat.length;
    $("count").textContent = coll.title + " · " + n + (n === 1 ? " song" : " songs");
    var cards = dirlist.querySelectorAll(".dircard");
    for (var i = 0; i < cards.length; i++) {
      cards[i].setAttribute("aria-current", String(cards[i].dataset.cid === coll.id));
    }
    buildSongList();
    try { localStorage.setItem("lastCollection", coll.id); } catch (e) {}
    if (flat.length) select(0);
  }

  function buildSongList() {
    var sel = $("songsel");
    sel.innerHTML = "";
    var multi = coll.sets.length > 1;
    var n = 0;
    coll.sets.forEach(function (s) {
      var parent = sel;
      if (multi) {
        parent = document.createElement("optgroup");
        parent.label = s.id + "  —  " + (s.label || "");
        sel.appendChild(parent);
      }
      s.songs.forEach(function (sg) {
        var o = document.createElement("option");
        o.value = String(n++);
        o.textContent = sg.title + "   ·   " + sg.key + "  ·  " + sg.meter +
                        "  ·  " + sg.bars + " bars  ·  ♩ " + sg.tempo;
        parent.appendChild(o);
      });
    });
    sel.addEventListener("change", function () { select(+this.value); });
  }

  /* ================= song ================= */
  function select(i) {
    if (i < 0 || i >= flat.length) return;
    idx = i;
    song = flat[i].song;
    set = flat[i].set;
    totalBars = song.bars;
    targetBpm = userTempo || song.tempo;
    transpose = 0;
    $("songsel").value = String(i);
    $("where").textContent = (idx + 1) + " / " + flat.length +
      (coll.sets.length > 1 ? "  ·  " + set.id : "");
    $("prev").disabled = idx === 0;
    $("next").disabled = idx === flat.length - 1;
    $("barsof").textContent = totalBars;
    strip.setAttribute("aria-valuemax", totalBars);
    targetBpm = Math.max(40, Math.min(targetBpm, 225));
    $("tempo").value = targetBpm;
    $("bpm").textContent = targetBpm + " bpm" + (userTempo ? "" : "");
    $("pdf").href = song.pdf;
    $("pdf").setAttribute("download", song.slug + ".pdf");
    $("spectitle").textContent = "Spec — " + coll.title +
      (coll.sets.length > 1 ? " · " + set.id : "");
    $("spectext").textContent = set.spec || (coll.blurb || "(no spec recorded)");
    buildKeys();
    buildTicks();
    render();
    curBar = 0; setBar(1);
    setupAudio();
    try { localStorage.setItem("lastSong", coll.id + "/" + song.slug); } catch (e) {}
  }

  function buildKeys() {
    var sel = $("keysel");
    sel.innerHTML = "";
    var names = isMinor(song.key) ? MINOR : MAJOR;
    var home = tonicPc(song.key);
    names.forEach(function (nm) {
      var semis = ((tonicPc(nm) - home + 6) % 12) - 6;   // keep it near the written key
      var o = document.createElement("option");
      o.value = String(semis);
      o.textContent = nm + (semis === 0 ? "  (written)" : "");
      sel.appendChild(o);
    });
    sel.value = "0";
  }

  function buildTicks() {
    var t = $("track");
    t.innerHTML = "";
    var every = totalBars > 24 ? 4 : 2;
    for (var b = 1 + every; b <= totalBars; b += every) {
      var d = document.createElement("div");
      d.className = "tick" + ((b - 1) % (every * 2) === 0 ? " period" : "");
      d.style.left = ((b - 1) / totalBars * 100) + "%";
      t.appendChild(d);
    }
  }

  /* ================= score ================= */

  // Left to itself abcjs fits four bars to a line and justifies each system to
  // the full width, so a sparse tune ends up with 250px bars. MAX_BAR_PX is the
  // only number worth touching here.
  var MAX_BAR_PX = 175;        // target width for the widest bar, in screen pixels
  var PER_LINE_MIN = 4;        // layouts to try, in measures per line
  var PER_LINE_MAX = 10;

  // abcjs stretches the final, short system out to the full width -- that is
  // where the very widest bars come from. %%stretchlast 0 leaves it alone.
  // It is a directive, not a render option, so it has to go into the ABC itself.
  function noStretch(abc) {
    var L = abc.split(/\r?\n/);
    L.splice(1, 0, "%%stretchlast 0");   // after X:, before the rest of the header
    return L.join("\n");
  }

  function renderWith(perLine) {
    paper.innerHTML = "";
    visualObj = ABCJS.renderAbc("paper", noStretch(song.abc), {
      responsive: "resize", add_classes: true, staffwidth: 880,
      paddingtop: 0, paddingbottom: 14, paddingleft: 0, paddingright: 0,
      visualTranspose: transpose,
      wrap: { minSpacing: 1.0, maxSpacing: 1.4, preferredMeasuresPerLine: perLine }
    });
  }

  // Widest gap between two barlines on the same system, in screen pixels.
  function widestBar() {
    var svg = paper.querySelector("svg");
    if (!svg) return 0;
    var rows = {};
    [].forEach.call(svg.querySelectorAll(".abcjs-bar"), function (e) {
      var b = e.getBoundingClientRect();
      var y = Math.round(b.top / 8) * 8;       // bucket by system
      (rows[y] = rows[y] || []).push(b.left);
    });
    var max = 0;
    Object.keys(rows).forEach(function (y) {
      var xs = rows[y].sort(function (a, b) { return a - b; });
      for (var i = 1; i < xs.length; i++) max = Math.max(max, xs[i] - xs[i - 1]);
    });
    return max;
  }

  // Which measures-per-line setting gives the narrowest bars is not monotonic --
  // it depends on how the remainder falls on the last system -- so try the range
  // and keep the airiest layout that fits. A dense tune may not reach the cap at
  // a readable note size; then we keep the narrowest layout going.
  function render() {
    var best = null, current = null;
    for (var n = PER_LINE_MIN; n <= PER_LINE_MAX; n++) {
      renderWith(n); current = n;
      var w = widestBar();
      if (best === null || w < best.w) best = { n: n, w: w };
      if (w <= MAX_BAR_PX) break;
    }
    if (best && best.n !== current) renderWith(best.n);
    addPlayhead();
  }

  // A <line> appended to abcjs's own <svg>, so it is measured in the score's
  // coordinate system -- which is what the note events report. A DOM overlay
  // would drift as soon as the responsive SVG scaled.
  function addPlayhead() {
    var svg = paper.querySelector("svg");
    if (!svg) { playhead = null; return; }
    playhead = document.createElementNS("http://www.w3.org/2000/svg", "line");
    playhead.setAttribute("class", "playhead");
    playhead.setAttribute("x1", 0); playhead.setAttribute("x2", 0);
    playhead.setAttribute("y1", 0); playhead.setAttribute("y2", 0);
    playhead.style.opacity = 0;
    svg.appendChild(playhead);
  }

  function movePlayhead(ev) {
    if (!playhead || ev.left == null) return;
    var x = ev.left - 2;
    playhead.setAttribute("x1", x);
    playhead.setAttribute("x2", x);
    playhead.setAttribute("y1", ev.top - 2);
    playhead.setAttribute("y2", ev.top + ev.height + 2);
    playhead.style.opacity = "";
  }

  function hidePlayhead() { if (playhead) playhead.style.opacity = 0; }

  function clearHighlights() {
    var old = paper.querySelectorAll(".abcjs-highlight");
    for (var i = 0; i < old.length; i++) old[i].classList.remove("abcjs-highlight");
  }

  /* ================= transport ================= */
  function setBar(bar) {
    if (bar === curBar) return;
    curBar = bar;
    $("barnum").textContent = bar;
    var pc = (bar - 1) / totalBars * 100;
    $("head").style.left = pc + "%";
    $("fill").style.width = pc + "%";
    strip.setAttribute("aria-valuenow", bar);
    strip.setAttribute("aria-valuetext", "bar " + bar + " of " + totalBars);
  }

  function paintPlay() {
    $("glyph").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
    $("playlab").textContent = playing ? "Pause" : "Play";
  }

  var MM_RE = /(?:^|\s)abcjs-mm(\d+)(?:\s|$)/;
  function measureOf(el) {
    if (!el) return null;
    var cls = el.getAttribute ? el.getAttribute("class") : null;
    var m = cls && MM_RE.exec(cls);
    return m ? +m[1] : null;
  }

  var cursorControl = {
    beatSubdivisions: 2,
    onStart: function () { lastTop = null; },
    onBeat: function (beatNumber, totalBeats) {
      if (dragging || busy) return;
      // Fallback only: proportional, so it is right in any meter. onEvent below
      // supersedes it with the exact measure whenever a note is sounding.
      if (!totalBeats) return;
      var frac = beatNumber / totalBeats;
      setBar(Math.max(1, Math.min(totalBars, Math.floor(frac * totalBars) + 1)));
    },
    onEvent: function (ev) {
      if (!ev || dragging || busy || (ev.measureStart && ev.left === null)) return;
      clearHighlights();
      var first = null;
      (ev.elements || []).forEach(function (s) {
        s.forEach(function (el) { el.classList.add("abcjs-highlight"); if (!first) first = el; });
      });
      var mm = measureOf(first);
      if (mm !== null) setBar(Math.max(1, Math.min(totalBars, mm + 1)));
      movePlayhead(ev);
      if (followOn && first && ev.top !== lastTop) {
        lastTop = ev.top;
        var r = first.getBoundingClientRect();
        if (r.top < 120 || r.bottom > innerHeight - 60) {
          scrollBy({ top: r.top - innerHeight * 0.38, behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
    },
    onFinished: function () {
      playing = false; paintPlay(); clearHighlights(); hidePlayhead();
      curBar = 0; setBar(1);
    }
  };

  /* ================= audio ================= */
  function audioParams() {
    // visualTranspose moves the notation and the chord NAMES but the synth
    // ignores it entirely -- the generated MIDI is byte-identical either way, so
    // the score would read Eb while the audio still played C. midiTranspose is
    // the separate lever that moves the sound, melody and comping alike.
    return { chordsOff: !chordsOn, program: 0, midiTranspose: transpose, qpm: targetBpm };
  }

  // A fresh controller per tune: reusing one leaves the previous tune primed, so
  // Play would sound the song you just navigated away from.
  function setupAudio() {
    if (!ABCJS.synth.supportsAudio()) { $("playlab").textContent = "No audio"; return; }
    var token = ++loadToken;
    ready = false; playing = false; busy = false;
    paintPlay();
    $("play").disabled = true;
    if (synth) {
      try { synth.pause(); } catch (e) {}
      try { synth.destroy(); } catch (e) {}
    }
    $("audiohost").innerHTML = "";
    synth = new ABCJS.synth.SynthController();
    synth.load("#audiohost", cursorControl,
      { displayPlay: true, displayProgress: true, displayWarp: true });
    var mine = synth;
    return mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;
      ready = true;
      $("play").disabled = false;
      paintPlay();
      // A fresh controller always starts at the tune's own Q: header -- the qpm
      // we pass to setTune does not stick -- so a sticky user tempo (or a
      // re-prime after transposing) has to be warped back in here. Without this
      // the slider reads 225 while the song plays at its written tempo.
      syncWarp();
    }).catch(function (e) {
      if (token !== loadToken) return;
      $("playlab").textContent = "Audio failed"; console.error(e);
    });
  }

  /* setWarp re-primes the audio AND the timing clock together and restores the
     position, so audio and playhead stay locked. Do not pause/seek around it. */
  function warpPct() { return Math.max(1, Math.round(targetBpm / song.tempo * 100)); }

  // Bring a freshly primed controller up to the current target tempo.
  function syncWarp() {
    if (!synth || !song) return;
    var pct = warpPct();
    if (pct === 100) return;
    try { synth.setWarp(pct); } catch (e) {}
  }

  function applyTempo(bpm) {
    targetBpm = bpm;
    $("bpm").textContent = bpm + " bpm";
    if (!synth || !ready || !song) return;
    var pct = warpPct();
    busy = true;
    var release = function () { busy = false; };
    var res = synth.setWarp(pct);
    if (res && typeof res.then === "function") res.then(release, release);
    else setTimeout(release, 500);
    setTimeout(release, 3000);
  }

  function applyTranspose(semis) {
    if (!song) return;
    transpose = semis;
    var wasPlaying = playing, bar = curBar;
    render();                       // re-engrave at the new key
    setupAudio().then(function () { // and re-prime from the transposed tune
      if (bar > 1) seekToBar(bar);
      if (wasPlaying) { playing = true; paintPlay(); synth.play(); }
    });
  }

  function seekToBar(bar) {
    bar = Math.max(1, Math.min(totalBars, bar));
    setBar(bar);
    if (!ready) return;
    clearHighlights(); hidePlayhead();
    lastTop = null;
    synth.seek((bar - 1) / totalBars);
  }

  /* ================= scrubbing ================= */
  function barAtX(clientX) {
    var r = strip.getBoundingClientRect();
    if (!r.width) return curBar;
    var f = Math.max(0, Math.min(0.99999, (clientX - r.left) / r.width));
    return Math.max(1, Math.min(totalBars, Math.floor(f * totalBars) + 1));
  }
  strip.addEventListener("pointerdown", function (e) {
    if (!ready || (e.button !== 0 && e.pointerType === "mouse")) return;
    dragging = true; strip.classList.add("dragging");
    try { strip.setPointerCapture(e.pointerId); } catch (_) {}
    clearHighlights(); hidePlayhead(); setBar(barAtX(e.clientX));
    e.preventDefault(); strip.focus();
  });
  strip.addEventListener("pointermove", function (e) {
    if (dragging) setBar(barAtX(e.clientX));
  });
  function endScrub(e) {
    if (!dragging) return;
    dragging = false; strip.classList.remove("dragging");
    try { strip.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToBar(barAtX(e.clientX));
  }
  strip.addEventListener("pointerup", endScrub);
  strip.addEventListener("pointercancel", endScrub);
  strip.addEventListener("keydown", function (e) {
    var d = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 4 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -4 : -1;
    else if (e.key === "Home") d = -totalBars;
    else if (e.key === "End") d = totalBars;
    else return;
    e.preventDefault(); seekToBar(curBar + d);
  });

  /* ================= controls ================= */
  $("prev").addEventListener("click", function () { select(idx - 1); });
  $("next").addEventListener("click", function () { select(idx + 1); });
  $("play").addEventListener("click", function () {
    if (!ready) return;
    playing = !playing; paintPlay(); synth.play();
  });
  // Chords and follow are always on now, so there is nothing to toggle.
  function keyStep(dir) {
    var sel = $("keysel");
    if (!sel.options.length) return;
    sel.selectedIndex = (sel.selectedIndex + dir + sel.options.length) % sel.options.length;
    applyTranspose(+sel.value);
  }
  $("keydown").addEventListener("click", function () { keyStep(-1); });
  $("keyup").addEventListener("click", function () { keyStep(1); });
  $("tempo").addEventListener("input", function () { $("bpm").textContent = this.value + " bpm"; });
  $("tempo").addEventListener("change", function () {
    userTempo = +this.value;
    try { localStorage.setItem("userTempo", userTempo); } catch (e) {}
    applyTempo(userTempo);
  });
  $("keysel").addEventListener("change", function () { applyTranspose(+this.value); });

  /* ================= modals ================= */
  function openDir() { $("dirmodal").hidden = false; $("dirclose").focus(); }
  function closeDir() { $("dirmodal").hidden = true; $("browse").focus(); }
  $("browse").addEventListener("click", openDir);
  $("dirclose").addEventListener("click", closeDir);
  $("dirmodal").addEventListener("click", function (e) { if (e.target === this) closeDir(); });

  function openSpec() { $("modal").hidden = false; $("specclose").focus(); }
  function closeSpec() { $("modal").hidden = true; $("specbtn").focus(); }
  $("specbtn").addEventListener("click", openSpec);
  $("specclose").addEventListener("click", closeSpec);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeSpec(); });

  addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("modal").hidden) { e.preventDefault(); closeSpec(); }
      else if (!$("dirmodal").hidden) { e.preventDefault(); closeDir(); }
      return;
    }
    if (!$("modal").hidden || !$("dirmodal").hidden) return;
    var tag = e.target.tagName;
    if (/^(INPUT|TEXTAREA|BUTTON|A|SELECT)$/.test(tag)) return;
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); select(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); select(idx - 1); }
  });

  /* ================= theme ================= */
  // 'auto' leaves the root unstamped so prefers-color-scheme decides; the explicit
  // values stamp data-theme, which every colour token already keys off.
  function applyTheme(v) {
    var root = document.documentElement;
    if (v === "light" || v === "dark") root.setAttribute("data-theme", v);
    else root.removeAttribute("data-theme");
    try { localStorage.setItem("theme", v); } catch (e) {}
  }
  var startTheme = "auto";
  try { startTheme = localStorage.getItem("theme") || "auto"; } catch (e) {}
  var themeRadios = document.querySelectorAll('.seg input[name="theme"]');
  for (var ti = 0; ti < themeRadios.length; ti++) {
    themeRadios[ti].checked = themeRadios[ti].value === startTheme;
    themeRadios[ti].addEventListener("change", function () {
      if (this.checked) applyTheme(this.value);
    });
  }
  applyTheme(startTheme);

  /* ================= boot ================= */
  var startC = COLLECTIONS.length ? COLLECTIONS[0].id : null;
  try {
    var lc = localStorage.getItem("lastCollection");
    for (var i = 0; i < COLLECTIONS.length; i++) if (COLLECTIONS[i].id === lc) startC = lc;
  } catch (e) {}
  if (startC) {
    selectCollection(startC);
    try {
      var ls = localStorage.getItem("lastSong");
      for (var j = 0; j < flat.length; j++) {
        if (coll.id + "/" + flat[j].song.slug === ls) { select(j); break; }
      }
    } catch (e) {}
  }

  window.__p = {
    bar: function () { return curBar; },
    bpm: function () { return targetBpm; },
    ready: function () { return ready; },
    song: function () { return song && song.slug; },
    collection: function () { return coll && coll.id; },
    setId: function () { return set && set.id; },
    index: function () { return idx; },
    count: function () { return flat.length; },
    transpose: function () { return transpose; },
    userTempo: function () { return userTempo; },
    written: function () { return song && song.tempo; },
    synthId: function () { return synth ? (synth.__id || (synth.__id = ++idc)) : null; },
    primedIsCurrent: function () {
      try { return synth.visualObj === visualObj[0]; } catch (e) { return null; }
    },
    playheadX: function () { return playhead ? +playhead.getAttribute("x1") : null; },
    theme: function () { return document.documentElement.getAttribute('data-theme') || 'auto'; },
    keySig: function () {
      try { return visualObj[0].getKeySignature().accidentals.length; } catch (e) { return null; }
    }
  };
})();
</script>
</body>
</html>
