<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>𝑓 Sheets</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1><span class="mark" aria-hidden="true">f</span>Sheets</h1>
    <button class="btn browse" id="browse" type="button">&#9776;&nbsp; Browse Categories</button>
    <span class="count" id="count"></span>
    <div class="ctl theme">
      <div class="seg" role="radiogroup" aria-label="Theme">
        <input type="radio" name="theme" id="th-light" value="light">
        <label for="th-light">Day</label>
        <input type="radio" name="theme" id="th-dusk" value="dusk">
        <label for="th-dusk">Dusk</label>
      </div>
    </div>
  </header>

  <div class="picker">
    <button class="btn nav" id="prev" type="button" aria-label="Previous song">&#8249;</button>
    <!-- A native <select> cannot filter as you type and cannot right-align part
         of an option's text, so the picker is a combobox: a button that opens a
         listbox, with a filter field that appears once a list is long enough to
         need one. #songsel stays in the DOM, hidden, as the accessible source of
         truth and so anything that still reaches for it keeps working. -->
    <div class="songbox" id="songbox">
      <button class="songbtn" id="songbtn" type="button" aria-haspopup="listbox"
              aria-expanded="false" aria-label="Choose a song">
        <span class="songname" id="songname">Loading&hellip;</span>
        <span class="songbars" id="songbars"></span>
        <svg class="songcaret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9.5l6 6 6-6"/>
        </svg>
      </button>
      <div class="songpop" id="songpop" hidden>
        <input class="songfilter" id="songfilter" type="search" autocomplete="off"
               spellcheck="false" placeholder="Type to search…" aria-label="Search songs">
        <div class="songlist" id="songlist" role="listbox" aria-label="Songs"></div>
        <p class="songnone" id="songnone" hidden>No songs match.</p>
      </div>
    </div>
    <select id="songsel" aria-label="Choose a song" hidden></select>
    <button class="btn nav" id="next" type="button" aria-label="Next song">&#8250;</button>
    <button class="btn nav shuffle" id="shuffle" type="button" aria-pressed="false"
            aria-label="Shuffle: the next button picks a random song" title="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6.5h3.6l3 4.2M3 17.5h3.6l8-11.2H19M3 6.5"/>
        <path d="M14.6 17.7H19M11.4 13.3l3.2 4.4"/>
        <path d="M16.9 3.6 19.8 6.3 16.9 9M16.9 15.1l2.9 2.6-2.9 2.7"/>
      </svg>
    </button>
    <span class="where" id="where"></span>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <span class="ctl keygrp"><span>Key</span>
        <select id="keysel" aria-label="Key"></select>
      </span>
      <span class="ctl octgrp"><span>Octave</span>
        <button class="btn step" id="octdown" type="button" aria-label="Down an octave">&#9662;</button>
        <output id="octnow" aria-live="polite">0</output>
        <button class="btn step" id="octup" type="button" aria-label="Up an octave">&#9652;</button>
      </span>
      <label class="ctl tempo" for="tempo"><span>Tempo</span>
        <input type="range" id="tempo" min="40" max="250" step="1" value="100">
        <output id="bpm" for="tempo">100 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
      <!-- The URL already carries the song, the key, the octave and the tempo.
           This button is here because on a tablet the address bar is often not
           on screen at all, so there is nothing to select and copy. -->
      <button class="btn share" id="share" type="button"
              aria-label="Copy a link to this song">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.2 13.8a3.9 3.9 0 0 0 5.9.4l2.5-2.5a3.9 3.9 0 1 0-5.6-5.5l-1.4 1.4"/>
          <path d="M13.8 10.2a3.9 3.9 0 0 0-5.9-.4l-2.5 2.5a3.9 3.9 0 1 0 5.6 5.5l1.4-1.4"/>
        </svg><span id="sharelab">Link</span>
      </button>
    </div>
    <div class="barrow">
      <div class="bar-strip" id="strip" role="slider" tabindex="0"
           aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="32" aria-valuenow="1">
        <div id="track"></div>
        <div id="fill"></div>
        <div id="head"></div>
      </div>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">32</b></span>
    </div>
  </div>

  <div class="sheet">
    <button class="favmark" id="favstar" type="button" aria-pressed="false"
            aria-label="Add this song to favorites" title="Add to favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.45 6.19 20.5 7.3 14.03 2.6 9.45l6.5-.95z"/>
      </svg>
    </button>
    <p class="credit" id="credit"></p>
    <div id="paper"><p class="empty">Loading&hellip;</p></div>
  </div>
</div>

<div class="modal" id="dirmodal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dirtitle">
    <div class="modal-head">
      <span class="dirheadicon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </span>
      <h2 id="dirtitle">Categories</h2>
      <button class="favcard" id="favcard" type="button" aria-label="Open your favorites">
        <span class="fi">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.1l2.7 5.5 6.1.9-4.4 4.3 1.04 6.06L12 17l-5.44 2.86L7.6 13.8 3.2 9.5l6.1-.9z"/>
          </svg>
        </span>
        <span>Favorites</span>
        <span class="fn" id="favcount"></span>
      </button>
      <button class="btn" id="dirclose" type="button">Close</button>
    </div>
    <div class="dirlist" id="dirlist"></div>
  </div>
</div>

<div id="audiohost"></div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<!-- Generated: the manifest only. Each collection's notation is in data/<id>.js
     and is loaded the first time that collection is opened. -->
<script src="data/collections.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/player.js"></script>
</body>
</html>
