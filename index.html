<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Lead Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E7EAE5; --surface:#F3F5F1; --paper:#FCFBF7; --paper-edge:#DCDFD7;
  --ink:#16201E; --ink-2:#55635E; --ink-3:#8A968F;
  --line:#C9D0C8; --accent:#2C6E67; --accent-soft:rgba(44,110,103,.13);
  --accent-on:#FCFBF7; --radius:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
    --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
    --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
    --accent-on:#0D1312;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1312; --surface:#161E1C; --paper:#19221F; --paper-edge:#26322E;
  --ink:#DFE6E2; --ink-2:#8D9A95; --ink-3:#6A7873;
  --line:#2A3633; --accent:#63B8AE; --accent-soft:rgba(99,184,174,.15);
  --accent-on:#0D1312;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:36px 64px}

/* ---------- masthead ---------- */
.masthead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:18px}
h1{font-family:"Bodoni Moda",Didot,"Times New Roman",serif; font-weight:400;
  font-size:clamp(34px,6vw,52px); line-height:1; margin:0; letter-spacing:.005em}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; margin-left:auto}
.vpick{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.vpick select{font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:6px 9px; cursor:pointer}
.vpick select:hover{border-color:var(--accent)}
.btn.ghost{padding:6px 11px; font-size:12.5px}

/* ---------- spec modal ---------- */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; padding:20px}
/* author rules beat the UA sheet's [hidden]{display:none}, so restate it here */
.modal[hidden]{display:none}
.modal-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:14px; padding:14px 16px;
  border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-family:"Bodoni Moda",Didot,serif; font-weight:400; font-size:23px}
.modal-head .btn{margin-left:auto}
#spectext{margin:0; padding:18px 20px; overflow:auto; white-space:pre-wrap; word-break:break-word;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  color:var(--ink-2); tab-size:2}

/* ---------- song list ---------- */
.library{display:grid; grid-template-columns:repeat(auto-fill,minmax(224px,1fr));
  gap:8px; margin-top:20px}
.card{
  display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px; font:inherit; color:inherit; position:relative;
  transition:border-color .15s, background .15s;
}
.card:hover{border-color:var(--accent)}
.card[aria-current="true"]{border-color:var(--accent); background:var(--accent-soft)}
.card .t{font-weight:600; font-size:15px; line-height:1.3}
.card .m{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.card[aria-current="true"] .m{color:var(--accent)}

/* ---------- transport ---------- */
.transport{position:sticky; top:0; z-index:20; margin-top:22px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
.btn{border:1px solid var(--line); border-radius:var(--radius); background:var(--bg);
  padding:7px 13px; font-size:13px; font-weight:500; white-space:nowrap;
  transition:border-color .15s,color .15s; text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default}
.btn:disabled:hover{border-color:var(--line); color:inherit}
.play{min-width:100px; display:inline-flex; align-items:center; gap:8px;
  background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.play:hover{color:var(--accent-on); filter:brightness(1.08)}
.play:disabled{filter:none}
.play .glyph{font-size:11px; line-height:1}
a.dl{color:var(--ink)} a.dl:hover{color:var(--accent)}
a.dl .arrow{color:var(--accent); font-weight:600}
.tempo{display:inline-flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-2)}
.tempo input{accent-color:var(--accent); width:150px}
.tempo output{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; min-width:52px}
.readout{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-2); font-variant-numeric:tabular-nums; margin-left:auto}
.readout b{color:var(--ink); font-weight:500}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- scrub bar ---------- */
.bar-strip{position:relative; height:30px; cursor:pointer; touch-action:none; user-select:none}
.bar-strip.dragging{cursor:grabbing}
#track{position:absolute; inset:0; background:var(--bg); border-radius:2px; overflow:hidden}
#fill{position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--accent); opacity:.16; pointer-events:none}
.tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}
.tick.period{background:var(--ink-3); opacity:.5}
#head{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px;
  background:var(--ink); pointer-events:none}
#head::after{content:""; position:absolute; left:-4px; right:-4px; top:-2px; height:6px;
  background:var(--ink); border-radius:1px}
.bar-strip:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ---------- score ---------- */
.sheet{margin-top:22px; background:var(--paper); border:1px solid var(--paper-edge);
  border-radius:var(--radius); padding:24px 18px 30px}
#paper{color:var(--ink)}
#paper svg{max-width:100%; height:auto; display:block}
#paper svg path{fill:currentColor}
#paper svg text,#paper svg tspan{fill:currentColor}
#paper .abcjs-highlight,#paper .abcjs-highlight path,#paper .abcjs-highlight text{
  fill:var(--accent) !important}
.empty{color:var(--ink-3); font-size:13px; font-style:italic; padding:48px 0; text-align:center}
#audiohost{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

@media (max-width:560px){
  .readout{margin-left:0; width:100%}
  .tempo input{width:110px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important; transition:none !important}}
@media print{
  .masthead,.library,.transport{display:none}
  body{background:#fff} .sheet{border:none; background:#fff; margin:0; padding:0}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Piano Lead Sheets</h1>
    <label class="vpick" for="version">Set
      <select id="version"></select>
    </label>
    <button class="btn ghost" id="specbtn" type="button">View spec</button>
    <span class="count" id="count"></span>
  </header>

  <div class="library" id="library"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="spectitle">
      <div class="modal-head">
        <h2 id="spectitle">Spec</h2>
        <button class="btn" id="specclose" type="button">Close</button>
      </div>
      <pre id="spectext"></pre>
    </div>
  </div>

  <div class="transport">
    <div class="row">
      <button class="btn play" id="play" disabled><span class="glyph" id="glyph">&#9654;</span><span id="playlab">Play</span></button>
      <button class="btn" id="restart" disabled>Restart</button>
      <button class="btn" id="chords" aria-pressed="true">Chords on</button>
      <button class="btn" id="follow" aria-pressed="true">Follow</button>
      <label class="tempo" for="tempo">Tempo
        <input type="range" id="tempo" min="40" max="250" step="1" value="84">
        <output id="bpm" for="tempo">84 bpm</output>
      </label>
      <a class="btn dl" id="pdf" href="#" download><span class="arrow">&darr;</span>&nbsp; PDF</a>
      <span class="readout">bar <b id="barnum">1</b>/<b id="barsof">40</b></span>
    </div>
    <div class="bar-strip" id="strip" role="slider" tabindex="0"
         aria-label="Playback position in bars" aria-valuemin="1" aria-valuemax="40" aria-valuenow="1">
      <div id="track"></div>
      <div id="fill"></div>
      <div id="head"></div>
    </div>
  </div>

  <div class="sheet">
    <div id="paper"><p class="empty">Pick a song above.</p></div>
  </div>
</div>

<div id="audiohost"></div>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script>
(function () {
  "use strict";
  var VERSIONS = [
  {
    "id": "v5",
    "label": "32-bar AABA, shuffle feel, leaner eighth texture",
    "bars": 32,
    "spec": "# Songwriting spec v5 — 32-bar AABA with a shuffle feel\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\n---\n\n## What changed from v4 — read this first\n\nTwo changes: the songs **swing**, and the texture is **leaner**.\n\n| | v4 average | **v5 target** |\n|---|---|---|\n| eighth notes | 149 | **60–86** (about half) |\n| half notes | 10.8 | at least **10** |\n| bars with a run of 4+ short notes | 20.2 | at least **10** |\n\nv4 filled almost every moving bar with running eighths. v5 pulls that back: fewer eighths, more\nquarters and held notes, and the eighths that remain are grouped into **pairs that swing**.\n\n### How the swing works — this affects how you write\n\nYou write **straight eighths**. At build time, every eighth pair that **starts on a beat** is\nrewritten as a dotted-eighth plus a sixteenth — a shuffle — in the printed score, the on-screen\nscore and the audio alike.\n\n```\nyou write:   C5:2 D5:2 E5:4 F5:4      ->   built as:   C5:3 D5:1 E5:4 F5:4\n```\n\nThis is done literally rather than by printing \"swing the eighths\" over straight notation,\nbecause the playback engine has no swing setting — a marking alone would look right and play\nstraight. The score carries the words *Shuffle — swing the eighths* as well.\n\n**The consequence for you: an eighth only swings if it is in a pair that begins on a beat.**\nA bar is divided into four beats at positions 0, 4, 8 and 12 (counting in sixteenths).\n\n- `4 2 2 4 4` — the pair starts at position 4, on beat 2. **Swings.** ✅\n- `2 2 4 4 4` — the pair starts at position 0, on beat 1. **Swings.** ✅\n- `6 2 4 4` — a lone eighth at position 6, off the beat. **Stays straight.** ❌\n\nThe validator warns if fewer than 70% of your eighths sit in on-beat pairs. Every head and\nsyncopation figure below is already built correctly — if you stick to them you are fine.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: key, tempo, character, a **head figure**, a\n**syncopation figure**, and a **landing rotation** of four figures. Those are binding.\n\n## 2. The file\n\nWrite exactly one file: `v5/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\", \"notes\": \"C5:2 D5:2 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"G\", \"notes\": \"D5:8 E5:4 F5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>` — `C5:4` (`C4` is middle C), `F#5:2`, `Bb4:8`, `R:4` for a rest,\n`[Am]E5:4` to change chord mid-bar. **There is no tie syntax**: a note may not cross a barline.\n\nDo **not** write `3` or `1` yourself. Write straight eighths and let the build swing them.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.**\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb.\n6. Chord suffixes: `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. Head figures — the rhythm of your moving bars\n\nEach has exactly four eighths, all in on-beat pairs, so each bar gives you two shuffle beats\nand two steady ones. That alternation is the shuffle groove.\n\n| id | rhythm | swinging pairs begin at |\n|----|--------|-------------------------|\n| W1 | `2 2 4 2 2 4`   | beats 1 and 3 |\n| W2 | `2 2 2 2 4 4`   | beats 1 and 2 |\n| W3 | `4 2 2 2 2 4`   | beats 2 and 3 |\n| W4 | `4 4 2 2 2 2`   | beats 3 and 4 |\n| W5 | `2 2 4 4 2 2`   | beats 1 and 4 |\n| W6 | `8 2 2 2 2`     | beats 3 and 4 |\n| W7 | `2 2 2 2 8`     | beats 1 and 2 |\n| W8 | `2 2 8 2 2`     | beats 1 and 4 |\n\n## 6. Syncopation figures — use yours across B and at least 3 other bars\n\nEach displaces a longer note off the beat while keeping an on-beat eighth pair.\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| X1 | `2 2 6 2 4`   | | X5 | `2 2 2 2 6 2` |\n| X2 | `4 2 2 6 2`   | | X6 | `4 2 2 4 2 2` |\n| X3 | `6 2 4 2 2`   | | X7 | `2 2 6 4 2` |\n| X4 | `2 2 4 6 2`   | | X8 | `6 2 2 2 4` |\n\n## 7. Landing figures — one per 8-bar section\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\n\n| id | rhythm    | | id | rhythm |\n|----|-----------|-|----|--------|\n| LA | `4 4 8`   | | LE | `2 2 4 8` |\n| LB | `8 4 4`   | | LH | `8 8`     |\n| LD | `6 2 8`   | | LJ | `4 8 4`   |\n\nKeep the rhythm exactly; the pitches are yours, and the two landings in a section should differ\n— the first more open, the second more conclusive.\n\n**Half notes:** your rotation supplies most of the ten you need. If you are short, hold a half\nnote at the top of a phrase. Dotted halves and whole notes do not count toward the total.\n\n## 8. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune on your head figure. **Ends OPEN** — bar 8 on the dominant, a non-tonic note. |\n| 9–16  | **A′**  | The tune varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge: different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the single high point. |\n| 25–32 | **A″**  | The tune returns, lightly decorated. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each section: bars 1–3 move (head figure, the shape sequencing by step), bar 4 lands,\nbars 5–7 move, bar 8 lands.\n\n## 9. Melody\n\n- **Step more than you leap.** A swung eighth pair is at its best as two neighbouring scale\n  steps — the shuffle does the work, the line stays smooth.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step. Use it, and in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n- Sixteenths are not needed in v5 and you should mostly avoid writing them — the shuffle already\n  supplies the short notes. A couple of 2-note turns in A″ is the most you want.\n\n## 10. Harmony\n\nOne chord loop across A, A′ and A″; a different one for B. One chord per bar. Seventh chords\n(`7`, `m7`, `maj7`, `6`) suit a shuffle especially well — use them freely.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, C6, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, G6, Cmaj7, Am7, Em7 |\n| **D**  | D, Em, F#m, G, A, Bm, A7, Dmaj7, D6, Gmaj7, Em7, Bm7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, F6, Bbmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Cm, Dm, Eb, F, Gm, F7, Bbmaj7, Bb6, Ebmaj7, Cm7, Gm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Am6, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Em6, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Dm6, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at the A′ and A″\ncadences, with its raised leading tone (`G#`, `D#`, `C#`) in the melody.\n\n**Key signatures:** D has F# and C#. Bb has Bb and Eb. F and Dm have Bb. G and Em have F#.\n\n## 11. Check your work — required\n\n```bash\npython src/validate.py v5/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`. The validator reports your actual eighth-note, half-note and run-bar counts, and\nwarns if too few of your eighths sit in on-beat pairs.\n\nThen confirm by eye:\n\n- bars 4 and 8 share a figure; 12 and 16 a different one; 20 and 24 a third; 28 a fourth;\n- bars 8, 16 and 32 end differently (open / closed / final);\n- your eighths are in pairs starting on beats 1, 2, 3 or 4 — never stranded off the beat.\n\n## 12. File-format reference\n\n`src/example-song.json` is a valid song — read it **for JSON syntax only**. It is a 40-bar v1\nsong and does not follow any of the rules above.\n",
    "songs": [
      {
        "slug": "vigil-am",
        "title": "Slow Ember",
        "key": "Am",

      },
      {
        "slug": "amber-bb",
        "title": "Amber Hour",
        "key": "Bb",
        "tempo": 126,

    "spec": "# Songwriting spec v3 — 32-bar AABA, rotating cadence\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved sheet\nmusic (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nThe song must be **predictable and catchy** — a listener should be able to hum where the tune is\ngoing — while having real rhythmic life: eighths, sixteenths, and genuine syncopation.\n\n> ### What changed from v2, and why\n> **v1's problem:** every *song* ended every phrase the same way, and so did every other song.\n> **v2 fixed the cross-song half** by assigning each song its own landing figure.\n> **v2's remaining problem:** each song still used that one figure for all seven phrase endings,\n> so a single song got monotonous even though the set was varied.\n>\n> **v3 rotates the cadence.** You get **four** landing figures, one per 8-bar section. The two\n> phrase endings *inside* a section share a figure; each section uses a *different* one. So the\n> ear gets a pattern it can learn (8 bars) and then a fresh one.\n>\n> Tempos are also roughly double v2's — these are quicker pieces.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, a **head figure**,\na **syncopation figure**, and a **landing rotation** of four figures. Those are binding. Build\nthe whole piece out of them.\n\n## 2. The file\n\nWrite exactly one file: `v3/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 152,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:4 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"A5:4 G5:4 E5:2 D5:2 C5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given on your card: `C`, `G`, `D`, `F`, `Bb`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card (v3 tempos run 130–200).\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>`:\n\n- `C5:4` — `C4` is middle C, so `C5` sits in the treble staff.\n- `F#5:2` `Bb4:8` — accidentals with `#` / `b`.\n- `R:4` — a quarter rest.\n- `[Am]E5:4` — changes the chord *mid-bar*, starting at this note.\n\nThere is deliberately **no tie syntax**. A note may not be held across a barline.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 32 is a single whole note on the tonic** — `C5:16` in C, `A5:16` in Am, `Bb5:16` in Bb,\n   `D5:16` in D and Dm, and so on.\n6. Chord symbols use a root (`A`–`G`, optional `#`/`b`) plus one of:\n   `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. The landing rotation — the heart of v3\n\nA **landing bar** is the last bar of a 4-bar phrase: bars 4, 8, 12, 16, 20, 24, 28.\n(Bar 32 is the final whole note and is exempt.)\n\nYour card gives four figures in order. Apply them by section:\n\n| section | bars | landing bars | figure |\n|---------|------|--------------|--------|\n| A       | 1–8   | **4 and 8**   | your 1st |\n| A′      | 9–16  | **12 and 16** | your 2nd |\n| B       | 17–24 | **20 and 24** | your 3rd |\n| A″      | 25–32 | **28**        | your 4th |\n\n**Both landing bars inside a section use the same figure. No two sections share a figure.**\nThe validator checks both of these and warns if you slip.\n\nThe figures you may be assigned:\n\n| id | rhythm    | feel |\n|----|-----------|------|\n| LA | `4 4 8`   | quarter, quarter, half — the plain full stop |\n| LB | `8 4 4`   | lands long, then walks onward |\n| LC | `4 12`    | one step, then a long hold |\n| LD | `6 2 8`   | lilt into a held note |\n| LE | `2 2 4 8` | two eighths, quarter, half |\n| LF | `12 4`    | held, with a quarter that pushes into the next phrase |\n| LG | `2 2 12`  | a quick pair, then a long hold |\n| LH | `8 8`     | two halves — the stillest ending |\n| LJ | `4 8 4`   | short, long, short |\n\nKeep the *rhythm* exactly; the *pitches* are yours, and should differ between the two landings\nin a section — the first one open, the second more conclusive.\n\n## 6. Head and syncopation figures\n\n### Head figures — the rhythm of your tune's moving bars\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| H1 | `2 2 4 4 4`   | | H5 | `6 2 4 4` |\n| H2 | `4 4 2 2 4`   | | H6 | `4 2 4 2 4` |\n| H3 | `4 2 2 4 4`   | | H7 | `3 1 4 4 4` |\n| H4 | `2 2 2 2 4 4` | | H8 | `2 2 2 2 2 2 4` |\n\n### Syncopation figures — use yours across the B section and at least 3 other bars\n\n| id | rhythm | | id | rhythm |\n|----|--------|-|----|--------|\n| S1 | `4 2 4 2 4`   | | S5 | `6 6 4` |\n| S2 | `2 4 4 4 2`   | | S6 | `4 6 2 4` |\n| S3 | `3 1 3 1 4 4` | | S7 | `2 2 4 6 2` |\n| S4 | `2 4 2 4 4`   | | S8 | `4 4 6 2` |\n\n### Sixteenth runs — use at least four bars containing sixteenths\n\n```\n1 1 1 1 4 4 4            a turn on beat 1\n4 1 1 1 1 4 4            a turn on beat 2\n2 1 1 2 2 4 4            a flick inside running eighths\n1 1 1 1 1 1 1 1 4 4      a half-bar scale run\n```\n\n**Tempo matters here.** These are fast pieces. At 170 BPM and above, use short turns of two to\nfour sixteenths and avoid the half-bar scale run — it becomes unplayable for the target pianist.\nBelow 150 you have more room.\n\n## 7. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune, plainly, built on your head figure. **Ends OPEN** — bar 8 lands on the dominant and a non-tonic note. |\n| 9–16  | **A′**  | The tune again, varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge. Different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns, decorated with sixteenth runs. **Ends FINAL** — bar 32 is the tonic whole note. |\n\nWithin each 8-bar section: bars 1–3 move (head figure, pitches sequencing by step each bar),\nbar 4 lands, bars 5–7 move, bar 8 lands.\n\n## 8. Melody\n\n- **Step more than you leap.** Most intervals a second or a third; after a leap, step back.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step is the single most\n  effective device you have. Use it, and again in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n\n## 9. Harmony\n\nSet up a chord loop and reuse it across A, A′ and A″; give B a different one. One chord per bar.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **D**  | D, Em, F#m, G, A, Bm, A7, Dmaj7, Gmaj7, Em7, Bm7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Bb** | Bb, Cm, Dm, Eb, F, Gm, F7, Bbmaj7, Ebmaj7, Cm7, Gm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at the A′ and A″\ncadences, with its raised leading tone in the melody (`G#`, `D#`, `C#`). That is the one place a\nchromatic note belongs.\n\n**Key signatures to remember:** D has F# and C#. Bb has Bb and Eb — so write `Bb5`, `Eb5`.\nF has Bb. G and Em have F#. Dm has Bb.\n\n## 10. Check your work — required\n\n```bash\npython src/validate.py v3/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`. The validator checks the landing rotation directly and will tell you which\nsection repeated a figure.\n\nThen re-read your own file once and confirm, by eye:\n\n- bars 4 and 8 share a figure; 12 and 16 share a different one; 20 and 24 a third; 28 a fourth;\n- bars 8, 16 and 32 end **differently** from each other (open / closed / final);\n- your syncopation figure appears in B and at least 3 other bars;\n- at least four bars contain sixteenths, and none of them are too fast for your tempo.\n\n## 11. File-format reference\n\n`src/example-song.json` is a valid, passing song you can read **to understand the JSON format\nand the note language only**. It is a 40-bar v1 song: its structure, its figures and its single\nrepeated landing are all things v3 exists to avoid. Use it for syntax, nothing else.\n",

    "spec": "# Songwriting spec v2 — 32-bar AABA piano lead sheets\n\nYou are writing **one song** as a single JSON file. A build script turns it into engraved\nsheet music (PDF) and playable audio. Your job is only the JSON.\n\nThe target is a **beginner–intermediate pianist**: single-line melody in the treble clef with\nchord symbols above it. No left-hand part, no bass clef.\n\nThe song must be **predictable and catchy** — a listener should be able to hum where the tune\nis going — while having real rhythmic life: eighths, sixteenths, and genuine syncopation.\n\n> ### What went wrong in v1, and what this version fixes\n> The v1 spec told every writer to use \"quarter, quarter, half\" as their landing figure. All six\n> songs came back ending every phrase identically and sounding like each other.\n>\n> **Predictability belongs inside one song, not across the set.** So v2 assigns you a\n> *rhythmic identity* — a specific head figure, landing figure, and syncopation figure.\n> Commit to yours and repeat it. Do not drift toward the generic.\n\n---\n\n## 1. Your assignment\n\nYour dispatch message gives you a **song card**: a key, a tempo, a character, and three\nfigures — **head**, **landing**, **syncopation** — chosen from the menus in §5.\nThose three figures are your song's identity. Build the whole piece out of them.\n\n**Do not use a landing figure other than the one you were assigned.** In particular, if you\nwere not assigned `4 4 8`, do not use `4 4 8` anywhere as a phrase ending.\n\n## 2. The file\n\nWrite exactly one file: `v2/songs/<slug>.json`\n\n```json\n{\n  \"title\": \"Paper Kite\",\n  \"key\": \"C\",\n  \"tempo\": 92,\n  \"bars\": [\n    { \"chord\": \"C\",  \"notes\": \"C5:4 E5:4 G5:2 A5:2 G5:4\" },\n    { \"chord\": \"Am\", \"notes\": \"A5:4 G5:4 E5:2 D5:2 C5:4\" }\n  ]\n}\n```\n\n- `title` — 1–3 words, evocative, no colon or dash.\n- `key` — exactly as given on your card: `C`, `G`, `F`, `Am`, `Em`, or `Dm`.\n- `tempo` — the number on your card.\n- `bars` — exactly **32** objects.\n\n## 3. The note language\n\nEvery bar is 4/4. **Durations are counted in sixteenth notes, so every bar sums to exactly 16.**\n\n| write | means         | | write | means           |\n|-------|---------------|-|-------|-----------------|\n| `1`   | sixteenth     | | `6`   | dotted quarter  |\n| `2`   | eighth        | | `8`   | half            |\n| `3`   | dotted eighth | | `12`  | dotted half     |\n| `4`   | quarter       | | `16`  | whole           |\n\nA token is `<note>:<duration>`:\n\n- `C5:4` — `C4` is middle C, so `C5` sits in the treble staff.\n- `F#5:2` `Bb4:8` — accidentals with `#` / `b`.\n- `R:4` — a quarter rest.\n- `[Am]E5:4` — changes the chord *mid-bar*, starting at this note.\n\nThere is deliberately **no tie syntax**. A note may not be held across a barline.\n\n## 4. Hard rules — the validator rejects these\n\n1. **Exactly 32 bars.**\n2. **Every bar's durations sum to exactly 16.** The most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 32 is a single whole note on the tonic** (`C5:16` in C, `A5:16` in Am, and so on).\n6. Chord symbols use a root (`A`–`G`, optional `#`/`b`) plus one of:\n   `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 5. The menus\n\n### Head figures — the rhythm of your tune's moving bars\n\n| id | rhythm | feel |\n|----|--------|------|\n| H1 | `2 2 4 4 4`   | two eighths then walking quarters |\n| H2 | `4 4 2 2 4`   | quarters first, eighths in the middle |\n| H3 | `4 2 2 4 4`   | a quarter, a pair of eighths, quarters |\n| H4 | `2 2 2 2 4 4` | running eighths into quarters |\n| H5 | `6 2 4 4`     | dotted-quarter lilt |\n| H6 | `4 2 4 2 4`   | off-beat, springy |\n| H7 | `3 1 4 4 4`   | dotted-eighth snap |\n\n### Landing figures — how every 4-bar phrase ends\n\n| id | rhythm | feel |\n|----|--------|------|\n| LA | `4 4 8`   | quarter, quarter, half |\n| LB | `8 4 4`   | lands long, then walks on |\n| LC | `4 12`    | one step, then a long hold |\n| LD | `6 2 8`   | lilt into a held note |\n| LE | `2 2 4 8` | two eighths, quarter, half |\n| LF | `12 4`    | held, with a quarter that pushes into the next phrase |\n\n### Syncopation figures — use yours for the B section and at least 3 other bars\n\n| id | rhythm | where the accents fall |\n|----|--------|------------------------|\n| S1 | `4 2 4 2 4` | on the \"and\" of 2 and of 3 |\n| S2 | `2 4 4 4 2` | everything after beat 1 is displaced |\n| S3 | `3 1 3 1 4 4` | two dotted-eighth/sixteenth snaps |\n| S4 | `2 4 2 4 4` | early off-beat pair |\n| S5 | `6 6 4`     | two dotted quarters across the beat |\n| S6 | `4 6 2 4`   | a dotted quarter straddling beat 2 |\n\n### Sixteenth runs — use at least two of these bars\n\n```\n1 1 1 1 4 4 4            a turn on beat 1\n4 1 1 1 1 4 4            a turn on beat 2\n1 1 1 1 1 1 1 1 4 4      a half-bar scale run\n2 1 1 2 2 4 4            a flick inside running eighths\n```\n\n## 6. Structure — AABA, 8 bars each\n\n| bars  | section | what happens |\n|-------|---------|--------------|\n| 1–8   | **A**   | The tune, plainly, built on your head figure. **Ends OPEN** — bar 8 lands on the dominant chord and a non-tonic note, so it sounds unfinished. |\n| 9–16  | **A′**  | The tune again, varied. **Ends CLOSED** — bar 16 resolves to the tonic. |\n| 17–24 | **B**   | The bridge. Different harmony (lean on IV, or the relative major/minor), your syncopation figure, and the song's single high point. |\n| 25–32 | **A″**  | The tune returns, decorated with your sixteenth runs. **Ends FINAL** — bar 32 is the tonic whole note. |\n\n**The three A sections must not end the same way.** Open, then closed, then final. That contrast\nis what keeps a 32-bar AABA from sounding like a loop.\n\nWithin each 8-bar section: bars 1–3 move (head figure, pitches sequencing up or down a step\neach bar), bar 4 lands (your landing figure), bars 5–7 move, bar 8 lands.\n\n## 7. Melody\n\n- **Step more than you leap.** Most intervals a second or a third; after a leap, step back.\n- **Land on chord tones** on beat 1, and usually beat 3.\n- **Sequence**: bars 1–3 sharing one rhythm with the shape moving by step is the single most\n  effective device you have. Use it, and use it again in A″.\n- **One high point**, in B, reached once.\n- Never repeat the same pitch more than twice in a row.\n\n## 8. Harmony\n\nSet up a chord loop and reuse it across A, A′ and A″; give B a different one. One chord per bar.\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **Em** | Em, Am, Bm, C, D, G, B7, Em7, Am7, Cmaj7 |\n| **Dm** | Dm, Gm, Am, Bb, C, F, A7, Dm7, Gm7, Bbmaj7 |\n\nIn the minor keys use the major dominant (`E7` in Am, `B7` in Em, `A7` in Dm) at the A′ and A″\ncadences, with its raised leading tone in the melody (`G#`, `D#`, `C#`). That is the one place\na chromatic note belongs.\n\n## 9. Check your work — required\n\n```bash\npython src/validate.py v2/songs/<slug>.json\n```\n\nFix every `ERROR` **and** every `WARNING`, then run it again. You are not finished until it\nprints `PASS`.\n\nThen re-read your own file once and confirm, by eye:\n\n- bars 8, 16 and 32 end **differently** from each other;\n- every phrase-ending bar (4, 8, 12, 16, 20, 24, 28, 32) uses **your assigned landing figure**;\n- your syncopation figure appears in the B section and at least 3 other bars;\n- at least two bars contain sixteenth runs.\n\n## 10. File-format reference\n\n`src/example-song.json` is a valid, passing song you can read **to understand the JSON format\nand the note language**. It is a 40-bar v1 song in the old form — its structure, its figures and\nits la validator rejects these\n\n1. **Exactly 40 bars.**\n2. **Every bar's durations sum to exactly 16.** This is the most common mistake. Add them up.\n3. **Every bar begins with a struck note on beat 1** — never a rest, never a held-over note.\n4. **Range `G4` to `C6`.** Nothing lower, nothing higher.\n5. **Bar 40 is a single whole note on the tonic**, e.g. `\"C5:16\"` in C, `\"A5:16\"` in Am.\n6. Chord symbols use a root (`A`–`G`, optional `#`/`b`) plus one of:\n   `` (major), `m`, `7`, `m7`, `maj7`, `sus4`, `7sus4`, `m7b5`, `dim`, `6`, `m6`.\n   A slash bass is allowed: `G/B`.\n\n## 4. Structure — follow this shape\n\n40 bars = five 8-bar sections. Each 8-bar section is two 4-bar phrases.\n\n| bars   | section | what happens |\n|--------|---------|--------------|\n| 1–8    | **A**   | State the tune plainly. This is the melody everything else refers back to. |\n| 9–16   | **A′**  | The same tune again, lifted in register or lightly varied. Ends with a full cadence on the tonic. |\n| 17–24  | **B**   | Contrast: a different rhythmic figure, and harmony that leans away from the tonic (IV, vi, or the relative key). |\n| 25–32  | **A″**  | The tune returns, now decorated with sixteenth notes. |\n| 33–40  | **Coda**| Quote the opening, wind down, cadence and stop. |\n\n**Phrase landings — this is what makes a song feel like it lands:**\n\n- Bars **4, 8, 12, 16, 20, 24, 28, 32, 36, 40** end 4-bar phrases. Each must be a\n  **landing bar**: at most 4 notes, ideally `X:4 Y:4 Z:8` — quarter, quarter, half.\n- Bars **8, 16, 24, 32, 40** end 8-bar periods. Their last note must be a **half note or\n  longer**, so the phrase can breathe.\n- Use the *same* landing figure repeatedly. Hearing `F5:4 E5:4 D5:8` come back four times is\n  the point, not a flaw.\n\n## 5. Rhythm — repeat a figure, don't invent a new one every bar\n\nPick **one** rhythm for the moving bars of a phrase and use it for all three, changing only the\npitches. That single decision is most of what makes a tune predictable.\n\nGood bar rhythms (each sums to 16):\n\n```\n4 4 8          landing            2 2 2 2 4 4      running eighths\n4 4 4 4        walking quarters   1 1 1 1 4 4 4    sixteenth turn, then quarters\n2 2 4 4 4      the head figure    1 1 2 2 2 4 4    sixteenth pickup\n6 2 4 4        lilt               3 1 4 4 4        dotted eighth + sixteenth\n8 4 4          long note first    2 2 4 2 2 4      eighths around a quarter\n```\n\nDensity requirements (the validator warns):\n\n- At least **16 of the 40 bars** contain eighth notes.\n- At least **6 bars** contain sixteenth notes. Put them in section A″ (bars 25–32) and one or\n  two elsewhere — sixteenths are decoration on a tune you have already established.\n- Keep a dotted quarter *inside* its bar (`6 2 4 4` finishes on beat 2½). Never let a long note\n  run past the barline.\n\n## 6. Melody\n\n- **Step more than you leap.** Most intervals should be a second or a third. After a leap,\n  turn around and step back the other way.\n- **Land on chord tones.** The note on beat 1 — and usually beat 3 — should belong to the bar's\n  chord. Passing dissonance on weak beats is good; on beat 1 it should be deliberate.\n- **Sequence.** Three bars of the same rhythm with the shape moving up or down a step each time\n  is the single most effective device available to you. Use it in section A.\n- Give the song **one high point**, usually in B or A″, and only go there once.\n- Do not repeat the same pitch more than twice in a row.\n\n## 7. Harmony\n\nSet up a 4-bar or 8-bar chord loop and reuse it. Repetition here is what lets the melody vary\nwithout the song becoming confusing. One chord per bar is the default.\n\nDiatonic chords to draw from:\n\n| key | chords |\n|-----|--------|\n| **C**  | C, Dm, Em, F, G, Am, G7, Cmaj7, Fmaj7, Dm7, Am7 |\n| **G**  | G, Am, Bm, C, D, Em, D7, Gmaj7, Cmaj7, Am7, Em7 |\n| **F**  | F, Gm, Am, Bb, C, Dm, C7, Fmaj7, Bbmaj7, Gm7, Dm7 |\n| **Am** | Am, Dm, Em, F, G, C, E7, Am7, Dm7, Fmaj7 |\n| **         "abc": "X:1\nM:4/4\nL:1/16\nQ:1/4=76\nK:Em clef=treble\n\"Em\"e4 g2f2 e4 g4 | \"D\"f4 a2g2 f4 a4 | \"Cmaj7\"g4 b2a2 g4 b4 | \"B7\"a4 f4 ^d8 |\n\"Em\"e4 g2f2 e4 g4 | \"D\"f4 a2g2 f4 a4 | \"B7\"b4 a2g2 ^d4 e4 | \"Em\"g4 f4 e8 |\n\"Em\"e4 g2f2 e4 g4 | \"D\"f4 a2g2 f4 a4 | \"Cmaj7\"g4 b2a2 g4 b4 | \"B7\"a4 f4 ^d8 |\n\"Em\"e4 g2f2 e4 g4 | \"Am7\"a4 g1f1e2 a4 g4 | \"B7\"b4 a2g2 ^d4 e4 | \"Em\"g4 f4 e8 |\n\"G\"g6 a2 b4 a4 | \"D\"f6 g2 a4 g4 | \"Em\"e6 f2 g4 f4 | \"Am7\"a4 g4 e8 |\n\"Cmaj7\"g6 b2 c'4 a4 | \"G\"b6 a2 g4 a4 | \"Am7\"g6 f2 e4 g4 | \"B7\"a4 f4 ^d8 |\n\"Em\"e1f1g2f2g2 e4 g4 | \"D\"f1g1a2g2a2 f4 a4 | \"Cmaj7\"g1a1b2a2b2 g4 b4 | \"B7\"a4 f4 ^d8 |\n\"Em\"e1f1g2f2g2 e4 g4 | \"D\"f1g1a2g2a2 f4 a4 | \"B7\"b1a1g2a2g2 ^d4 e4 | \"Em\"g4 f4 e8 |\n\"Em\"e4 g2f2 e4 g4 | \"D\"f4 a2g2 f4 a4 | \"Cmaj7\"g4 b2a2 g4 b4 | \"B7\"a4 f4 ^d8 |\n\"Em\"e4 g4 b8 | \"Am7\"a4 g4 e8 | \"B7\"f4 e4 ^d8 | \"Em\"He16 |]\n"
      },
      {
        "slug": "meadow-f",
        "title": "Meadow Hours",
        "key": "F",
        "tempo": 76,
        "bars": 40,
        "pdf": "songs/v1/meadow-f.pdf",
        "abc": "X:1\nM:4/4\nL:1/16\nQ:1/4=76\nK:F clef=treble\n\"F\"f4 g4 a2g2 f4 | \"Gm7\"g4 a4 b2a2 g4 | \"Bb\"b4 a4 f2g2 a4 | \"C7\"b4 a4 g8 |\n\"F\"f4 g4 a2g2 f4 | \"Gm7\"g4 a4 b2a2 g4 | \"C7\"e4 g4 b2a2 g4 | \"F\"a4 g4 f8 |\n\"F\"a4 b4 a2g2 f4 | \"Gm7\"b4 a4 g2a2 b4 | \"Dm7\"a4 g4 f2g2 a4 | \"C7\"b4 a4 g8 |\n\"F\"a4 b4 a2g2 f4 | \"Dm7\"d1e1f1g1 a4 f2e2 d4 | \"C7\"e4 g4 b2a2 g4 | \"F\"a4 g4 f8 |\n\"Bbmaj7\"f6 g2 a4 b4 | \"Gm7\"g6 a2 b4 a4 | \"Dm7\"a6 g2 f4 a4 | \"C7\"b4 a4 g8 |\n\"Dm7\"a6 b2 c'4 a4 | \"Gm7\"g6 a2 b4 g4 | \"C7\"e6 g2 b4 a4 | \"C7\"b4 a4 g8 |\n\"F\"f4 g1a1g1f1a2g2 f4 | \"Gm7\"g4 a1b1a1g1b2a2 g4 | \"Bbmaj7\"b4 a1g1f1g1a2g2 a4 | \"C7\"b4 a4 g8 |\n\"F\"f4 g1a1g1f1a2g2 f4 | \"Gm7\"g4 a1b1a1g1b2a2 g4 | \"C7\"e4 g1a1b1a1g2a2 g4 | \"F\"a4 g4 f8 |\n\"F\"f4 g4 a2g2 f4 | \"Gm7\"g4 a4 b2a2 g4 | \"Bb\"b4 a4 f2g2 a4 | \"C7\"b4 a4 g8 |\n\"Dm7\"a4 g4 f2e2 d4 | \"Bbmaj7\"f4 g4 a2g2 f4 | \"C7\"e4 g4 b2a2 g4 | \"F\"Hf16 |]\n"
      },
      {
        "slug": "morning-g",
        "title": "Morning Window",
        "key": "G",
        "tempo": 76,
        "bars": 40,
        "pdf": "songs/v1/morning-g.pdf",
        "abc": "X:1\nM:4/4\nL:1/16\nQ:1/4=76\nK:G clef=treble\n\"G\"d2e2 f4 g4 b4 | \"Em\"b2a2 g4 f4 e4 | \"C\"e2f2 g4 a4 b4 | \"D\"a4 g4 f8 |\n\"G\"d2e2 f4 g4 b4 | \"Em\"b2a2 g4 f4 e4 | \"Am7\"c2d2 e4 g4 a4 | \"D\"b4 a4 f8 |\n\"G\"g2a2 b4 a4 g4 | \"Em\"b2a2 g4 f4 e4 | \"C\"e2f2 g4 a4 b4 | \"D\"a4 g4 f8 |\n\"G\"g2a2 b4 a4 g4 | \"C\"e1f1g1a1 b4 a4 g4 | \"D7\"a2g2 f4 a4 b4 | \"G\"b4 a4 g8 |\n\"Am7\"e6 g2 a4 g4 | \"Bm\"f6 a2 b4 a4 | \"C\"g6 b2 c'4 b4 | \"D\"b4 a4 f8 |\n\"Am7\"e6 g2 a4 g4 | \"Bm\"f6 a2 b4 a4 | \"Cmaj7\"g6 a2 b4 a4 | \"D\"b4 a4 f8 |\n\"G\"d1e1f1g1 b4 a4 g4 | \"Em\"b1a1g1f1 e4 f4 g4 | \"C\"e1f1g1a1 b4 a4 g4 | \"D\"a4 g4 f8 |\n\"G\"d1e1f1g1 b4 a4 g4 | \"C\"e1f1g1a1 b4 a4 g4 | \"D7\"f1g1a1g1 f4 a4 b4 | \"G\"b4 a4 g8 |\n\"G\"d2e2 f4 g4 b4 | \"Em\"b2a2 g4 f4 e4 | \"C\"e2f2 g4 a4 b4 | \"D\"a4 g4 f8 |\n\"G\"d4 e4 g8 | \"Em\"g4 a4 b8 | \"D7\"a4 g4 f8 | \"G\"Hg16 |]\n"
      }
    ]
  }
];

  var $ = function (id) { return document.getElementById(id); };
  var version = null, SONGS = [];
  var song = null, visualObj = null, synth = null;
  var ready = false, playing = false, busy = false;
  var chordsOn = true, followOn = true, dragging = false;
  var curBar = 0, totalBars = 40, targetBpm = 84;
  var loadToken = 0;
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var strip = $("strip"), paper = $("paper"), lib = $("library");

  /* ================= versions ================= */
  var vsel = $("version");
  VERSIONS.forEach(function (v) {
    var o = document.createElement("option");
    o.value = v.id;
    o.textContent = v.id + " — " + v.bars + " bars";
    vsel.appendChild(o);
  });
  vsel.addEventListener("change", function () { selectVersion(this.value); });

  function selectVersion(id) {
    version = VERSIONS.filter(function (v) { return v.id === id; })[0] || VERSIONS[0];
    vsel.value = version.id;
    SONGS = version.songs;
    $("count").textContent = SONGS.length + (SONGS.length === 1 ? " song" : " songs");
    $("spectitle").textContent = "Spec — " + version.id + " · " + version.label;
    $("spectext").textContent = version.spec || "(no spec recorded for this set)";
    buildLibrary();
    try { localStorage.setItem("lastVersion", version.id); } catch (e) {}
    if (SONGS.length) select(0);
  }

  /* ================= library ================= */
  function buildLibrary() {
    lib.innerHTML = "";
    SONGS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "card";
      b.type = "button";
      b.setAttribute("aria-current", "false");
      b.innerHTML = '<span class="t"></span><span class="m"></span>';
      b.querySelector(".t").textContent = s.title;
      b.querySelector(".m").textContent =
        s.key + "  ·  " + s.bars + " bars  ·  ♩ " + s.tempo;
      b.addEventListener("click", function () { select(i); });
      lib.appendChild(b);
    });
  }

  function select(i) {
    song = SONGS[i];
    totalBars = song.bars;
    targetBpm = song.tempo;
    var cards = lib.querySelectorAll(".card");
    for (var k = 0; k < cards.length; k++) cards[k].setAttribute("aria-current", String(k === i));
    $("barsof").textContent = totalBars;
    strip.setAttribute("aria-valuemax", totalBars);
    $("tempo").value = targetBpm;
    $("bpm").textContent = targetBpm + " bpm";
    $("pdf").href = song.pdf;
    $("pdf").setAttribute("download", song.slug + ".pdf");
    buildTicks();
    render();
    curBar = 0; setBar(1);
    setupAudio();
    try { localStorage.setItem("lastSong", song.slug); } catch (e) {}
  }

  function buildTicks() {
    var t = $("track");
    t.innerHTML = "";
    for (var b = 5; b <= totalBars; b += 4) {
      var d = document.createElement("div");
      d.className = "tick" + ((b - 1) % 8 === 0 ? " period" : "");
      d.style.left = ((b - 1) / totalBars * 100) + "%";
      t.appendChild(d);
    }
  }

  /* ================= score ================= */
  function render() {
    paper.innerHTML = "";
    visualObj = ABCJS.renderAbc("paper", song.abc, {
      responsive: "resize", add_classes: true, staffwidth: 860,
      paddingtop: 0, paddingbottom: 14, paddingleft: 0, paddingright: 0
    });
  }

  function clearHighlights() {
    var old = paper.querySelectorAll(".abcjs-highlight");
    for (var i = 0; i < old.length; i++) old[i].classList.remove("abcjs-highlight");
  }

  /* ================= transport state ================= */
  function setBar(bar) {
    if (bar === curBar) return;
    curBar = bar;
    $("barnum").textContent = bar;
    var pc = (bar - 1) / totalBars * 100;
    $("head").style.left = pc + "%";
    $("fill").style.width = pc + "%";
    strip.setAttribute("aria-valuenow", bar);
    strip.setAttribute("aria-valuetext", "bar " + bar + " of " + totalBars);
  }

  function paintPlay() {
    $("glyph").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
    $("playlab").textContent = playing ? "Pause" : "Play";
  }

  var lastTop = null;
  var cursorControl = {
    beatSubdivisions: 2,
    onStart: function () { lastTop = null; },
    onBeat: function (beatNumber) {
      if (dragging || busy) return;
      setBar(Math.max(1, Math.min(totalBars, Math.floor(beatNumber / 4) + 1)));
    },
    onEvent: function (ev) {
      if (!ev || dragging || busy || (ev.measureStart && ev.left === null)) return;
      clearHighlights();
      var first = null;
      (ev.elements || []).forEach(function (set) {
        set.forEach(function (el) { el.classList.add("abcjs-highlight"); if (!first) first = el; });
      });
      if (followOn && first && ev.top !== lastTop) {
        lastTop = ev.top;
        var r = first.getBoundingClientRect();
        if (r.top < 120 || r.bottom > innerHeight - 60) {
          scrollBy({ top: r.top - innerHeight * 0.38, behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
    },
    onFinished: function () {
      playing = false; paintPlay(); clearHighlights();
      curBar = 0; setBar(1);
    }
  };

  /* ================= audio ================= */
  function audioParams() {
    return { chordsOff: !chordsOn, program: 0, midiTranspose: 0, qpm: targetBpm };
  }

  /* Picking a new song used to leave the PREVIOUS tune primed inside the controller, so
     pressing Play replayed the song you had just navigated away from. Reusing one
     SynthController across tunes is not reliable -- tear it down and build a fresh one
     for every song. loadToken also defeats the race where you click through songs fast
     and an older setTune() resolves after a newer one. */
  function setupAudio() {
    if (!ABCJS.synth.supportsAudio()) { $("playlab").textContent = "No audio"; return; }
    var token = ++loadToken;
    ready = false; playing = false; busy = false;
    paintPlay();
    $("play").disabled = true; $("restart").disabled = true;
    if (synth) {
      try { synth.pause(); } catch (e) {}
      try { synth.destroy(); } catch (e) {}
    }
    $("audiohost").innerHTML = "";
    synth = new ABCJS.synth.SynthController();
    synth.load("#audiohost", cursorControl,
      { displayPlay: true, displayProgress: true, displayWarp: true });
    var mine = synth;
    return mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;   // superseded by a newer pick
      ready = true;
      $("play").disabled = false; $("restart").disabled = false;
      paintPlay();
    }).catch(function (e) {
      if (token !== loadToken) return;
      $("playlab").textContent = "Audio failed"; console.error(e);
    });
  }

  /* Tempo.
     setWarp() is self-contained: it tears the tune down, re-primes the audio AND the
     TimingCallbacks clock at the new rate, restores the playback position, and resumes
     if it was playing. So audio and playhead stay locked together by construction.
     Do NOT pause/seek/play around it -- doing so races its own restart and stalls the
     clock. Just hold off our beat handler until its promise settles. */
  function applyTempo(bpm) {
    targetBpm = bpm;
    $("bpm").textContent = bpm + " bpm";
    if (!synth || !ready || !song) return;
    var pct = Math.max(1, Math.round(bpm / song.tempo * 100));
    busy = true;
    var release = function () { busy = false; };
    var res = synth.setWarp(pct);
    if (res && typeof res.then === "function") res.then(release, release);
    else setTimeout(release, 500);
    setTimeout(release, 3000);            // safety net if the promise never settles
  }

  function seekToBar(bar) {
    bar = Math.max(1, Math.min(totalBars, bar));
    setBar(bar);
    if (!ready) return;
    clearHighlights();
    lastTop = null;
    synth.seek((bar - 1) / totalBars);
  }

  /* ================= scrubbing ================= */
  function barAtX(clientX) {
    var r = strip.getBoundingClientRect();
    if (!r.width) return curBar;
    var f = (clientX - r.left) / r.width;
    f = Math.max(0, Math.min(0.99999, f));
    return Math.max(1, Math.min(totalBars, Math.floor(f * totalBars) + 1));
  }
  strip.addEventListener("pointerdown", function (e) {
    if (!ready || (e.button !== 0 && e.pointerType === "mouse")) return;
    dragging = true; strip.classList.add("dragging");
    try { strip.setPointerCapture(e.pointerId); } catch (_) {}
    clearHighlights(); setBar(barAtX(e.clientX));
    e.preventDefault(); strip.focus();
  });
  strip.addEventListener("pointermove", function (e) {
    if (dragging) setBar(barAtX(e.clientX));
  });
  function endScrub(e) {
    if (!dragging) return;
    dragging = false; strip.classList.remove("dragging");
    try { strip.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToBar(barAtX(e.clientX));
  }
  strip.addEventListener("pointerup", endScrub);
  strip.addEventListener("pointercancel", endScrub);
  strip.addEventListener("keydown", function (e) {
    var d = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 4 : 1;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -4 : -1;
    else if (e.key === "Home") d = -totalBars;
    else if (e.key === "End") d = totalBars;
    else return;
    e.preventDefault(); seekToBar(curBar + d);
  });

  /* ================= controls ================= */
  $("play").addEventListener("click", function () {
    if (!ready) return;
    playing = !playing; paintPlay(); synth.play();
  });
  $("restart").addEventListener("click", function () {
    if (!ready) return;
    synth.restart(); curBar = 0; setBar(1);
    if (!playing) { playing = true; paintPlay(); synth.play(); }
  });
  $("chords").addEventListener("click", function () {
    if (!ready) return;
    chordsOn = !chordsOn;
    this.setAttribute("aria-pressed", String(chordsOn));
    this.textContent = chordsOn ? "Chords on" : "Chords off";
    var bar = curBar, wasPlaying = playing, token = ++loadToken, mine = synth;
    playing = false; paintPlay(); ready = false;
    mine.setTune(visualObj[0], false, audioParams()).then(function () {
      if (token !== loadToken || mine !== synth) return;
      ready = true; seekToBar(bar);
      if (wasPlaying) { playing = true; paintPlay(); synth.play(); }
    });
  });
  $("follow").addEventListener("click", function () {
    followOn = !followOn;
    this.setAttribute("aria-pressed", String(followOn));
    this.textContent = followOn ? "Follow" : "Follow off";
  });
  $("tempo").addEventListener("input", function () { $("bpm").textContent = this.value + " bpm"; });
  $("tempo").addEventListener("change", function () { applyTempo(+this.value); });

  addEventListener("keydown", function (e) {
    if (e.code === "Space" && !/^(INPUT|TEXTAREA|BUTTON|A)$/.test(e.target.tagName)) {
      e.preventDefault(); $("play").click();
    }
  });

  /* ================= spec modal ================= */
  function openSpec() {
    $("modal").hidden = false;
    $("specclose").focus();
  }
  function closeSpec() { $("modal").hidden = true; $("specbtn").focus(); }
  $("specbtn").addEventListener("click", openSpec);
  $("specclose").addEventListener("click", closeSpec);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeSpec(); });
  addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("modal").hidden) { e.preventDefault(); closeSpec(); }
  });

  /* ================= boot ================= */
  var startVersion = VERSIONS.length ? VERSIONS[0].id : null;
  try {
    var lastV = localStorage.getItem("lastVersion");
    for (var vi = 0; vi < VERSIONS.length; vi++) {
      if (VERSIONS[vi].id === lastV) startVersion = lastV;
    }
  } catch (e) {}
  if (startVersion) {
    selectVersion(startVersion);
    try {
      var last = localStorage.getItem("lastSong");
      for (var i = 0; i < SONGS.length; i++) if (SONGS[i].slug === last) { select(i); break; }
    } catch (e) {}
  }

  // test hook
  window.__p = {
    bar: function () { return curBar; },
    bpm: function () { return targetBpm; },
    ready: function () { return ready; },
    song: function () { return song && song.slug; },
    version: function () { return version && version.id; },
    synthId: function () { return synth ? (synth.__id || (synth.__id = ++idc)) : null; },
    // true when the PRIMED tune is the one currently on screen -- the switching bug
    primedIsCurrent: function () {
      try { return synth.visualObj === visualObj[0]; } catch (e) { return null; }
    },
    dur: function () {
      try { return Math.round(synth.midiBuffer.duration * 100) / 100; } catch (e) { return null; }
    }
  };
  var idc = 0;
})();
</script>
